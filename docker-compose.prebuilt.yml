# §3.2 — drill-time compose override.
#
# Layered over docker-compose.yml to swap `build:` for pre-built
# images from ghcr.io/aieera/sedoc. Use for the Phase A / G1 live
# drill or any time you want a fast `compose up` without burning
# 45 minutes on cold Go + spaCy builds.
#
# Usage:
#   export SEDOC_IMAGE_TAG=main            # or sha-<short>, or v1.2.3
#   docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d
#
# `image:` under a service NAME fully replaces the parent's `build:`
# per compose merge rules when both are specified — compose pulls
# the pre-built image instead of re-building from Dockerfile.

# Must match docker-compose.yml — top-level `name:` is last-file-wins, and a
# different value here forks the stack into a second project (fresh network +
# volumes, colliding container_names) and silently breaks every bare
# `docker compose ps` health wait. Stale `vaultdms-dev` bit exactly that way.
name: sedoc-dev

services:
  # ---- Go services (11) --------------------------------------------------
  auth:
    image: ghcr.io/aieera/sedoc/auth:${SEDOC_IMAGE_TAG:-main}
  policy:
    image: ghcr.io/aieera/sedoc/policy:${SEDOC_IMAGE_TAG:-main}
  document:
    image: ghcr.io/aieera/sedoc/document:${SEDOC_IMAGE_TAG:-main}
  storage:
    image: ghcr.io/aieera/sedoc/storage:${SEDOC_IMAGE_TAG:-main}
  search:
    image: ghcr.io/aieera/sedoc/search:${SEDOC_IMAGE_TAG:-main}
  audit:
    image: ghcr.io/aieera/sedoc/audit:${SEDOC_IMAGE_TAG:-main}
  workflow:
    image: ghcr.io/aieera/sedoc/workflow:${SEDOC_IMAGE_TAG:-main}
  notification:
    image: ghcr.io/aieera/sedoc/notification:${SEDOC_IMAGE_TAG:-main}
  signature:
    image: ghcr.io/aieera/sedoc/signature:${SEDOC_IMAGE_TAG:-main}
  billing:
    image: ghcr.io/aieera/sedoc/billing:${SEDOC_IMAGE_TAG:-main}
  connector:
    image: ghcr.io/aieera/sedoc/connector:${SEDOC_IMAGE_TAG:-main}
  task:
    image: ghcr.io/aieera/sedoc/task:${SEDOC_IMAGE_TAG:-main}

  # ---- Non-Go application services --------------------------------------
  collaboration:
    image: ghcr.io/aieera/sedoc/collaboration:${SEDOC_IMAGE_TAG:-main}
  intelligence:
    image: ghcr.io/aieera/sedoc/intelligence:${SEDOC_IMAGE_TAG:-main}
  intelligence-worker:
    # Worker reuses the intelligence image (same Dockerfile, different CMD
    # supplied by the parent compose file).
    image: ghcr.io/aieera/sedoc/intelligence:${SEDOC_IMAGE_TAG:-main}
  preview-worker:
    image: ghcr.io/aieera/sedoc/preview:${SEDOC_IMAGE_TAG:-main}
