syntax = "proto3";

package vaultdms.v1;

import "google/protobuf/timestamp.proto";
import "vaultdms/v1/common.proto";

option go_package = "github.com/aieera/sedoc/proto/gen/go/vaultdms/v1;vaultdmsv1";

// CollaborationService covers comments, share links, real-time presence,
// and co-annotation on documents.
service CollaborationService {
  rpc CreateComment (CreateCommentRequest) returns (Comment);
  rpc ReplyComment  (ReplyCommentRequest)  returns (Comment);
  rpc ResolveComment(ResolveCommentRequest) returns (Comment);
  rpc DeleteComment (DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListComments  (ListCommentsRequest)  returns (ListCommentsResponse);

  rpc CreateShareLink (CreateShareLinkEventRequest) returns (ShareLinkEvent);
  rpc RevokeShareLink (RevokeShareLinkRequest) returns (RevokeShareLinkResponse);
  rpc ListShareLinks  (ListShareLinkEventsRequest)  returns (ListShareLinkEventsResponse);

  rpc CreateAnnotation (CreateAnnotationRequest) returns (Annotation);
  rpc UpdateAnnotation (UpdateAnnotationRequest) returns (Annotation);
  rpc DeleteAnnotation (DeleteAnnotationRequest) returns (DeleteAnnotationResponse);
  rpc ListAnnotations  (ListAnnotationsRequest)  returns (ListAnnotationsResponse);

  rpc StreamPresence (PresenceHeartbeat) returns (stream PresenceEvent);
}

enum AnnotationKind {
  ANNOTATION_KIND_UNSPECIFIED = 0;
  ANNOTATION_KIND_HIGHLIGHT   = 1;
  ANNOTATION_KIND_NOTE        = 2;
  ANNOTATION_KIND_STAMP       = 3;
  ANNOTATION_KIND_DRAWING     = 4;
}

message Comment {
  string                    id           = 1;
  string                    tenant_id    = 2;
  string                    document_id  = 3;
  string                    parent_id    = 4; // empty for top-level thread
  string                    author_id    = 5;
  string                    body         = 6;
  repeated string           mentioned_user_ids = 7;
  int32                     page         = 8; // 0 = document-level
  bool                      resolved     = 9;
  google.protobuf.Timestamp created_at   = 10;
  google.protobuf.Timestamp resolved_at  = 11;
  string                    resolved_by  = 12;
}

message ShareLinkEvent {
  string                    id              = 1;
  string                    tenant_id       = 2;
  string                    document_id     = 3;
  string                    token_prefix    = 4; // first 8 chars, safe for display
  repeated string           allowed_actions = 5; // "view", "comment", "download"
  string                    password_hash   = 6; // optional
  google.protobuf.Timestamp expires_at      = 7;
  int32                     max_views       = 8; // 0 = unlimited
  int32                     view_count      = 9;
  bool                      revoked         = 10;
  AuditMeta                 audit           = 11;
}

message Annotation {
  string                    id          = 1;
  string                    tenant_id   = 2;
  string                    document_id = 3;
  string                    author_id   = 4;
  AnnotationKind            kind        = 5;
  int32                     page        = 6;
  string                    geometry_json = 7; // shape coords
  string                    text        = 8;
  string                    color       = 9;
  google.protobuf.Timestamp created_at  = 10;
  google.protobuf.Timestamp updated_at  = 11;
}

message PresenceHeartbeat {
  string document_id = 1;
  string user_id     = 2;
  int32  page        = 3;
}

message PresenceEvent {
  string                    document_id = 1;
  repeated PresenceUser     users       = 2;
  google.protobuf.Timestamp at          = 3;
}

message PresenceUser {
  string user_id   = 1;
  string full_name = 2;
  int32  page      = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

// ---- Requests / responses --------------------------------------------------

message CreateCommentRequest {
  string          document_id = 1;
  string          body        = 2;
  int32           page        = 3;
  repeated string mentioned_user_ids = 4;
}
message ReplyCommentRequest    { string parent_id = 1; string body = 2; repeated string mentioned_user_ids = 3; }
message ResolveCommentRequest  { string id = 1; }
message DeleteCommentRequest   { string id = 1; }
message DeleteCommentResponse  { bool deleted = 1; }
message ListCommentsRequest {
  string      document_id = 1;
  bool        include_resolved = 2;
  PageRequest page        = 3;
}
message ListCommentsResponse { repeated Comment comments = 1; PageResponse page = 2; }

message CreateShareLinkEventRequest {
  string                    document_id = 1;
  repeated string           allowed_actions = 2;
  string                    password    = 3; // plaintext; hashed server-side
  google.protobuf.Timestamp expires_at  = 4;
  int32                     max_views   = 5;
}
message RevokeShareLinkRequest  { string id = 1; }
message RevokeShareLinkResponse { bool revoked = 1; }
message ListShareLinkEventsRequest   { string document_id = 1; PageRequest page = 2; }
message ListShareLinkEventsResponse  { repeated ShareLinkEvent links = 1; PageResponse page = 2; }

message CreateAnnotationRequest {
  string         document_id   = 1;
  AnnotationKind kind          = 2;
  int32          page          = 3;
  string         geometry_json = 4;
  string         text          = 5;
  string         color         = 6;
}
message UpdateAnnotationRequest {
  string id           = 1;
  string geometry_json = 2;
  string text         = 3;
  string color        = 4;
  repeated string update_mask = 5;
}
message DeleteAnnotationRequest  { string id = 1; }
message DeleteAnnotationResponse { bool deleted = 1; }
message ListAnnotationsRequest {
  string         document_id = 1;
  int32          page        = 2;
  AnnotationKind kind        = 3;
  PageRequest    page_req    = 4;
}
message ListAnnotationsResponse { repeated Annotation annotations = 1; PageResponse page = 2; }
