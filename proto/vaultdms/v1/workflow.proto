syntax = "proto3";

package vaultdms.v1;

import "google/protobuf/timestamp.proto";
import "vaultdms/v1/common.proto";

option go_package = "github.com/aieera/sedoc/proto/gen/go/vaultdms/v1;vaultdmsv1";

// WorkflowService wraps Temporal workflows: definitions, instances, tasks.
service WorkflowService {
  rpc CreateDefinition (CreateDefinitionRequest) returns (WorkflowDefinition);
  rpc GetDefinition    (GetDefinitionRequest)    returns (WorkflowDefinition);
  rpc ListDefinitions  (ListDefinitionsRequest)  returns (ListDefinitionsResponse);
  rpc PublishDefinition(PublishDefinitionRequest) returns (WorkflowDefinition);

  rpc StartWorkflow  (StartWorkflowRequest)  returns (WorkflowInstance);
  rpc GetInstance    (GetInstanceRequest)    returns (WorkflowInstance);
  rpc ListInstances  (ListInstancesRequest)  returns (ListInstancesResponse);
  rpc CancelWorkflow (CancelWorkflowRequest) returns (WorkflowInstance);

  rpc CompleteTask (CompleteTaskRequest) returns (Task);
  rpc ListTasks    (ListTasksRequest)    returns (ListTasksResponse);
}

enum InstanceStatus {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_PENDING     = 1;
  INSTANCE_STATUS_RUNNING     = 2;
  INSTANCE_STATUS_COMPLETED   = 3;
  INSTANCE_STATUS_CANCELLED   = 4;
  INSTANCE_STATUS_FAILED      = 5;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING     = 1;
  TASK_STATUS_ASSIGNED    = 2;
  TASK_STATUS_COMPLETED   = 3;
  TASK_STATUS_EXPIRED     = 4;
  TASK_STATUS_CANCELLED   = 5;
}

message WorkflowDefinition {
  string    id           = 1;
  string    tenant_id    = 2;
  string    name         = 3;
  int32     version      = 4;
  string    spec_json    = 5; // BPMN-lite JSON (steps, branches, timers)
  bool      published    = 6;
  AuditMeta audit        = 7;
}

message WorkflowInstance {
  string                    id              = 1;
  string                    tenant_id       = 2;
  string                    definition_id   = 3;
  int32                     definition_version = 4;
  string                    document_id     = 5; // optional binding
  InstanceStatus            status          = 6;
  map<string, string>       variables       = 7;
  string                    temporal_workflow_id = 8;
  string                    temporal_run_id      = 9;
  google.protobuf.Timestamp started_at      = 10;
  google.protobuf.Timestamp completed_at    = 11;
}

message Task {
  string                    id              = 1;
  string                    tenant_id       = 2;
  string                    instance_id     = 3;
  string                    step_key        = 4;
  string                    title           = 5;
  string                    assignee_id     = 6;
  string                    assignee_group  = 7;
  TaskStatus                status          = 8;
  google.protobuf.Timestamp due_at          = 9;
  google.protobuf.Timestamp completed_at    = 10;
  map<string, string>       form_data       = 11;
}

// ---- Requests / responses --------------------------------------------------

message CreateDefinitionRequest  { string name = 1; string spec_json = 2; }
message GetDefinitionRequest     { string id = 1; int32 version = 2; }
message ListDefinitionsRequest   { PageRequest page = 1; bool published_only = 2; }
message ListDefinitionsResponse  { repeated WorkflowDefinition definitions = 1; PageResponse page = 2; }
message PublishDefinitionRequest { string id = 1; }

message StartWorkflowRequest {
  string              definition_id = 1;
  int32               version       = 2; // 0 = latest published
  string              document_id   = 3;
  map<string, string> variables     = 4;
}
message GetInstanceRequest     { string id = 1; }
message ListInstancesRequest   {
  string         definition_id = 1;
  string         document_id   = 2;
  InstanceStatus status        = 3;
  PageRequest    page          = 4;
}
message ListInstancesResponse  { repeated WorkflowInstance instances = 1; PageResponse page = 2; }
message CancelWorkflowRequest  { string id = 1; string reason = 2; }

message CompleteTaskRequest {
  string              id        = 1;
  map<string, string> form_data = 2;
  string              decision  = 3; // free-form; workflow step interprets
}
message ListTasksRequest {
  string      assignee_id    = 1;
  string      assignee_group = 2;
  TaskStatus  status         = 3;
  PageRequest page           = 4;
}
message ListTasksResponse { repeated Task tasks = 1; PageResponse page = 2; }
