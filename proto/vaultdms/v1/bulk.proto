syntax = "proto3";

package vaultdms.v1;

import "google/protobuf/timestamp.proto";
import "vaultdms/v1/common.proto";

option go_package = "github.com/vaultdms/vaultdms/proto/gen/go/vaultdms/v1;vaultdmsv1";

// BulkService — high-throughput streaming import + export for
// tenant onboarding and migration off legacy DMSes (ADR 0075).
//
// BulkImport is bidirectional-streaming with explicit ack windows:
// the client sends batches of resource items, the server processes
// each batch and replies with per-item Results. The client waits
// for the response before sending the next batch — TCP backpressure
// shaped through the gRPC stream prevents server overload without a
// custom credit protocol.
//
// BulkExport is server-streaming. The client opens with one filter
// envelope; the server pushes pages of matching records until the
// query is exhausted.
service BulkService {
  rpc BulkImport (stream BulkImportRequest) returns (stream BulkImportResponse);
  rpc BulkExport (BulkExportRequest)        returns (stream BulkExportResponse);
}

// ---- Bulk resource oneof ---------------------------------------------------
//
// Every bulk item carries an `external_id` — the tenant's natural key in
// their previous system. The bulk service maps external_id <-> internal
// UUID via the bulk_external_id_map table; cross-references inside one
// import (folder.workspace_external_id, document.folder_external_id,
// user.group_external_ids) resolve through the same map.

message BulkWorkspace {
  string external_id  = 1;
  string name         = 2;
  string description  = 3;
  string region_pin   = 4; // empty = tenant default
}

message BulkFolder {
  string external_id            = 1;
  string workspace_external_id  = 2; // required
  string parent_external_id     = 3; // empty = root
  string name                   = 4;
}

message BulkDocument {
  string          external_id           = 1;
  string          workspace_external_id = 2; // required
  string          folder_external_id    = 3; // empty = workspace root
  string          title                 = 4;
  string          description           = 5;
  repeated string tags                  = 6;
  string          region_pin            = 7;
  // Optional: if the bytes have already been uploaded via the regular
  // storage upload flow, supply the resulting content_blob_id and the
  // bulk import will create a Version pointing at it. If omitted the
  // document is created in DRAFT state with no content.
  string          content_blob_id       = 8;
}

message BulkUser {
  string          external_id            = 1;
  string          email                  = 2; // required
  string          display_name           = 3;
  string          role                   = 4; // owner | admin | member | viewer | etc
  repeated string group_external_ids     = 5;
}

message BulkGroup {
  string          external_id  = 1;
  string          name         = 2; // required
  string          description  = 3;
}

message BulkItem {
  oneof resource {
    BulkWorkspace workspace = 1;
    BulkFolder    folder    = 2;
    BulkDocument  document  = 3;
    BulkUser      user      = 4;
    BulkGroup     group     = 5;
  }
}

// ---- Import ---------------------------------------------------------------

message BulkImportRequest {
  // request_id is a UUID v7 minted by the client; the (tenant_id,
  // request_id) pair gates idempotency. Replays return the cached
  // status from bulk_import_log.
  string             request_id = 1;
  repeated BulkItem  items      = 2; // batch — server caps at 1000
}

message BulkItemResult {
  string external_id    = 1; // echoes the input
  bool   success        = 2;
  string internal_id    = 3; // UUID assigned (same as map lookup on retry)
  string error          = 4; // empty when success
  bool   skipped        = 5; // true on retry / no-op
}

message BulkImportResponse {
  string                  request_id = 1;
  repeated BulkItemResult results    = 2;
}

// ---- Export ---------------------------------------------------------------

enum BulkResourceKind {
  BULK_RESOURCE_KIND_UNSPECIFIED = 0;
  BULK_RESOURCE_KIND_WORKSPACE   = 1;
  BULK_RESOURCE_KIND_FOLDER      = 2;
  BULK_RESOURCE_KIND_DOCUMENT    = 3;
  BULK_RESOURCE_KIND_USER        = 4;
  BULK_RESOURCE_KIND_GROUP       = 5;
}

message BulkExportRequest {
  BulkResourceKind          resource    = 1;
  google.protobuf.Timestamp from        = 2; // optional inclusive lower bound on created_at
  google.protobuf.Timestamp to          = 3; // optional inclusive upper bound on created_at
  string                    workspace_id = 4; // optional filter for documents/folders
  int32                     page_size   = 5; // default 500, max 5000
}

message BulkExportResponse {
  repeated BulkItem items      = 1;
  bool              has_more   = 2; // false on the final batch
  int32             page_index = 3;
}
