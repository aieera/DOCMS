syntax = "proto3";

package vaultdms.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vaultdms/vaultdms/proto/gen/go/vaultdms/v1;vaultdmsv1";

// StorageService owns physical object storage: upload orchestration, virus
// scanning, lifecycle (hot -> warm), and signed download URLs. Business
// identity (documents/versions) lives in DocumentService.
service StorageService {
  rpc InitiateUpload (InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc CompleteUpload (CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc AbortUpload    (AbortUploadRequest)    returns (AbortUploadResponse);

  rpc GetDownloadURL (GetDownloadURLRequest) returns (GetDownloadURLResponse);
  rpc GetPreviewURL  (GetPreviewURLRequest)  returns (GetPreviewURLResponse);

  rpc GetScanStatus    (GetScanStatusRequest)    returns (ScanStatus);
  rpc RequestLifecycle (RequestLifecycleRequest) returns (LifecycleJob);

  // ShredBlobs cryptographically destroys the wrapped DEKs for a set
  // of content_blobs (ADR 0036). The S3 objects are scheduled for
  // best-effort async delete. Idempotent: blobs already shredded are
  // skipped silently and reported in already_shredded. Caller must
  // be the document service running under its internal-auth identity;
  // user-facing requests have their own delete path.
  rpc ShredBlobs (ShredBlobsRequest) returns (ShredBlobsResponse);

  // TransitionBlobsTier moves a set of blobs to a colder S3 storage
  // class (typically STANDARD → STANDARD_IA when a retention policy
  // archives a document). Idempotent — blobs already in the target
  // class are reported in already_in_target. Document service calls
  // this from its archive lifecycle path; the per-blob mapping
  // (blob_ids ← document.versions) is the document service's job.
  rpc TransitionBlobsTier (TransitionBlobsTierRequest) returns (TransitionBlobsTierResponse);
}

enum StorageTier {
  STORAGE_TIER_UNSPECIFIED = 0;
  STORAGE_TIER_HOT         = 1;
  STORAGE_TIER_WARM        = 2;
  STORAGE_TIER_COLD        = 3;
  STORAGE_TIER_QUARANTINE  = 4;
}

enum ScanResult {
  SCAN_RESULT_UNSPECIFIED = 0;
  SCAN_RESULT_CLEAN       = 1;
  SCAN_RESULT_INFECTED    = 2;
  SCAN_RESULT_ERROR       = 3;
  SCAN_RESULT_PENDING     = 4;
}

message InitiateUploadRequest {
  string region_pin      = 1;
  string filename        = 2;
  string mime_type       = 3;
  int64  size_bytes      = 4;
  string checksum_sha256 = 5; // optional; verified on CompleteUpload if provided
}

message InitiateUploadResponse {
  string                    upload_id        = 1;
  string                    presigned_put_url = 2;
  string                    storage_bucket   = 3;
  string                    storage_key      = 4;
  google.protobuf.Timestamp expires_at       = 5;
  map<string, string>       required_headers = 6;
}

message CompleteUploadRequest {
  string upload_id       = 1;
  string checksum_sha256 = 2;
  int64  size_bytes      = 3;
}
message CompleteUploadResponse {
  string                    storage_bucket = 1;
  string                    storage_key    = 2;
  int64                     size_bytes     = 3;
  string                    checksum_sha256 = 4;
  ScanResult                scan_result    = 5; // PENDING if async scan pipeline not done
  StorageTier               tier           = 6;
}

message AbortUploadRequest  { string upload_id = 1; }
message AbortUploadResponse { bool aborted = 1; }

message GetDownloadURLRequest {
  string document_id = 1;
  string version_id  = 2; // optional; defaults to current
  int32  expiry_secs = 3; // max 3600
}
message GetDownloadURLResponse {
  string                    url        = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetPreviewURLRequest {
  string document_id = 1;
  string version_id  = 2;
  int32  page        = 3; // 1-based page for multi-page docs
  int32  expiry_secs = 4;
}
message GetPreviewURLResponse {
  string                    url        = 1;
  google.protobuf.Timestamp expires_at = 2;
  bool                      available  = 3; // false if preview still generating
}

message GetScanStatusRequest { string upload_id = 1; }

message ScanStatus {
  string                    upload_id = 1;
  ScanResult                result    = 2;
  string                    signature = 3; // e.g. "Eicar-Test-Signature"
  google.protobuf.Timestamp scanned_at = 4;
}

message RequestLifecycleRequest {
  string      document_id  = 1;
  StorageTier target_tier  = 2;
  string      reason       = 3;
}

message ShredBlobsRequest {
  // Tenant + blob ids the document executor wants destroyed. The
  // storage service does NOT cross-check the doc/blob mapping — that
  // is the document service's job (it owns documents/versions). The
  // storage tx zeros the DEK and emits an audit event per blob.
  string          tenant_id = 1;
  repeated string blob_ids  = 2;
  // Audit context — the disposition_candidate id that authorised the
  // shred. Recorded on the dms.blob.shredded.v1 event so an auditor
  // can pivot from the blob row to the approval trail.
  string candidate_id = 3;
  string actor_id     = 4; // reviewer who approved (not the executor system user)
}
message TransitionBlobsTierRequest {
  string          tenant_id     = 1;
  repeated string blob_ids      = 2;
  // Target S3 storage class string. We pass the string verbatim
  // (e.g. "STANDARD_IA", "GLACIER", "DEEP_ARCHIVE") rather than
  // re-using the StorageTier enum because S3's class names differ
  // from the internal hot/warm/cold abstraction.
  string          target_class  = 3;
  // Audit context — the retention_policy id that authorised the
  // transition. Logged on the dms.blob.tier_transitioned.v1 event.
  string          policy_id     = 4;
}
message TransitionBlobsTierResponse {
  repeated string transitioned     = 1; // blob ids moved by this call
  repeated string already_in_target = 2; // blobs already in target_class
  repeated string not_found        = 3;
}

message ShredBlobsResponse {
  repeated string shredded         = 1; // blob ids zeroed by this call
  repeated string already_shredded = 2; // blob ids that were already shredded
  repeated string not_found        = 3; // blob ids that did not exist for this tenant
}

message LifecycleJob {
  string                    id          = 1;
  string                    document_id = 2;
  StorageTier               from_tier   = 3;
  StorageTier               to_tier     = 4;
  string                    status      = 5; // queued | running | done | failed
  google.protobuf.Timestamp created_at  = 6;
  google.protobuf.Timestamp completed_at = 7;
}
