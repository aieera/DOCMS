syntax = "proto3";

package sedoc.v1;

import "google/protobuf/timestamp.proto";
import "sedoc/v1/common.proto";

option go_package = "github.com/aieera/sedoc/proto/gen/go/sedoc/v1;sedocv1";

// BillingService tracks usage, plans, subscriptions, invoices. Metering
// events are ingested from NATS; this API is read-mostly with plan changes
// and invoice retrieval.
service BillingService {
  rpc GetSubscription    (GetSubscriptionRequest)    returns (Subscription);
  rpc ChangePlan         (ChangePlanRequest)         returns (Subscription);
  rpc CancelSubscription (CancelSubscriptionRequest) returns (Subscription);

  rpc GetUsage           (GetUsageRequest)           returns (UsageSummary);
  rpc ListInvoices       (ListInvoicesRequest)       returns (ListInvoicesResponse);
  rpc GetInvoice         (GetInvoiceRequest)         returns (Invoice);
  rpc GetInvoicePDFURL   (GetInvoicePDFURLRequest)   returns (GetInvoicePDFURLResponse);

  rpc ListPlans          (ListPlansRequest)          returns (ListPlansResponse);
  rpc GetPlan            (GetPlanRequest)            returns (Plan);

  rpc RecordUsage        (RecordUsageRequest)        returns (RecordUsageResponse);
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE      = 1;
  SUBSCRIPTION_STATUS_PAST_DUE    = 2;
  SUBSCRIPTION_STATUS_CANCELLED   = 3;
  SUBSCRIPTION_STATUS_TRIALING    = 4;
}

enum MeteredResource {
  METERED_RESOURCE_UNSPECIFIED = 0;
  METERED_RESOURCE_STORAGE_GB  = 1;
  METERED_RESOURCE_SEATS       = 2;
  METERED_RESOURCE_API_CALLS   = 3;
  METERED_RESOURCE_AI_TOKENS   = 4;
  METERED_RESOURCE_SIGNATURES  = 5;
}

message Plan {
  string          code           = 1;
  string          name           = 2;
  Money           monthly_price  = 3;
  Money           annual_price   = 4;
  int32           seat_limit     = 5; // 0 = unlimited
  int64           storage_limit_gb = 6;
  map<string, int64> feature_limits = 7; // "ai_tokens_per_month" -> N
  repeated string features       = 8;
  bool            active         = 9;
}

message Subscription {
  string                    id             = 1;
  string                    tenant_id      = 2;
  string                    plan_code      = 3;
  SubscriptionStatus        status         = 4;
  google.protobuf.Timestamp current_period_start = 5;
  google.protobuf.Timestamp current_period_end   = 6;
  google.protobuf.Timestamp trial_end_at   = 7;
  string                    payment_method_id = 8;
  AuditMeta                 audit          = 9;
}

message UsageSummary {
  string                    tenant_id   = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end   = 3;
  map<string, int64>        totals       = 4; // "storage_gb" -> value
  map<string, int64>        limits       = 5;
}

message Invoice {
  string                    id           = 1;
  string                    tenant_id    = 2;
  string                    subscription_id = 3;
  string                    number       = 4; // human-readable, e.g. "INV-2026-0417"
  Money                     subtotal     = 5;
  Money                     tax          = 6;
  Money                     total        = 7;
  string                    status       = 8; // draft | open | paid | void | uncollectible
  google.protobuf.Timestamp issued_at    = 9;
  google.protobuf.Timestamp due_at       = 10;
  google.protobuf.Timestamp paid_at      = 11;
  repeated InvoiceLine      lines        = 12;
}

message InvoiceLine {
  string          description = 1;
  MeteredResource resource    = 2;
  int64           quantity    = 3;
  Money           unit_price  = 4;
  Money           amount      = 5;
}

// ---- Requests / responses --------------------------------------------------

message GetSubscriptionRequest    {}
message ChangePlanRequest         { string new_plan_code = 1; bool prorate = 2; }
message CancelSubscriptionRequest { bool cancel_at_period_end = 1; string reason = 2; }

message GetUsageRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to   = 2;
}

message ListInvoicesRequest   { PageRequest page = 1; string status = 2; }
message ListInvoicesResponse  { repeated Invoice invoices = 1; PageResponse page = 2; }
message GetInvoiceRequest     { string id = 1; }
message GetInvoicePDFURLRequest  { string id = 1; }
message GetInvoicePDFURLResponse {
  string                    url        = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListPlansRequest  { bool active_only = 1; }
message ListPlansResponse { repeated Plan plans = 1; }
message GetPlanRequest    { string code = 1; }

message RecordUsageRequest {
  string                    idempotency_key = 1;
  MeteredResource           resource   = 2;
  int64                     quantity   = 3;
  google.protobuf.Timestamp occurred_at = 4;
  map<string, string>       dimensions = 5;
}
message RecordUsageResponse { bool accepted = 1; }
