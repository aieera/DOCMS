syntax = "proto3";

package sedoc.v1;

option go_package = "github.com/aieera/sedoc/proto/gen/go/sedoc/v1;sedocv1";

import "google/protobuf/timestamp.proto";

// ---- Pagination (new: cursor-based) ---------------------------------------
message PaginationRequest {
  int32  page_size  = 1; // max 100, default 20
  string page_token = 2; // opaque cursor
}
message PaginationResponse {
  string next_page_token = 1;
  int64  total_count     = 2; // -1 if unknown / too expensive
}

// ---- Legacy pagination (kept for Phase C services) ------------------------
message PageRequest {
  int32  page_size = 1;
  string cursor    = 2;
  string sort_by   = 3;
}
message PageResponse {
  string next_cursor = 1;
  bool   has_more    = 2;
  int64  total       = 3;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC         = 1;
  SORT_ORDER_DESC        = 2;
}

enum RegionPin {
  REGION_PIN_UNSPECIFIED    = 0;
  REGION_PIN_US_EAST_1      = 1;
  REGION_PIN_EU_WEST_1      = 2;
  REGION_PIN_ME_SOUTH_1     = 3;
  REGION_PIN_AP_SOUTHEAST_1 = 4;
}

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  LIFECYCLE_STATE_DRAFT       = 1;
  LIFECYCLE_STATE_IN_REVIEW   = 2;
  LIFECYCLE_STATE_ACTIVE      = 3;
  LIFECYCLE_STATE_SUPERSEDED  = 4;
  LIFECYCLE_STATE_RETAINED    = 5;
  LIFECYCLE_STATE_ARCHIVED    = 6;
  LIFECYCLE_STATE_DISPOSED    = 7;
  LIFECYCLE_STATE_LEGAL_HOLD  = 8;
}

enum LifecycleAction {
  LIFECYCLE_ACTION_UNSPECIFIED        = 0;
  LIFECYCLE_ACTION_SUBMIT_FOR_REVIEW  = 1;
  LIFECYCLE_ACTION_APPROVE            = 2;
  LIFECYCLE_ACTION_REJECT             = 3;
  LIFECYCLE_ACTION_SUPERSEDE          = 4;
  LIFECYCLE_ACTION_ARCHIVE            = 5;
  LIFECYCLE_ACTION_DISPOSE            = 6;
  LIFECYCLE_ACTION_APPLY_HOLD         = 7;
  LIFECYCLE_ACTION_RELEASE_HOLD       = 8;
  LIFECYCLE_ACTION_RESTORE            = 9;
}

message FieldError {
  string field   = 1;
  string message = 2;
  string code    = 3;
}

message ErrorDetail {
  string              type           = 1;
  string              message        = 2;
  repeated FieldError fields         = 3;
  string              correlation_id = 4;
}

message ErrorResponse {
  string              code           = 1;
  string              message        = 2;
  repeated FieldError field_errors   = 3;
  string              correlation_id = 4;
}

message TenantContext {
  string tenant_id      = 1;
  string user_id        = 2;
  string correlation_id = 3;
  string region_pin     = 4;
}

message AuditMeta {
  string                     created_by = 1;
  google.protobuf.Timestamp  created_at = 2;
  string                     updated_by = 3;
  google.protobuf.Timestamp  updated_at = 4;
}

message Label {
  string key   = 1;
  string value = 2;
}

message Money {
  string currency_code = 1;
  int64  amount_minor  = 2;
}
