syntax = "proto3";

package sedoc.v1;

import "google/protobuf/timestamp.proto";
import "sedoc/v1/common.proto";

option go_package = "github.com/aieera/sedoc/proto/gen/go/sedoc/v1;sedocv1";

// AuditService is the append-only audit log. Every state-changing event
// from every service is written here via NATS fan-out; this API is
// read-only for users and admins.
service AuditService {
  rpc Query         (QueryAuditRequest)         returns (QueryAuditResponse);
  rpc GetEvent      (GetAuditEventRequest)      returns (AuditEvent);
  rpc Export        (ExportAuditRequest)        returns (ExportJob);
  rpc GetExport     (GetExportRequest)          returns (ExportJob);
  rpc VerifyChain   (VerifyChainRequest)        returns (VerifyChainResponse);
}

message AuditEvent {
  string                    id             = 1;
  string                    tenant_id      = 2;
  string                    correlation_id = 3;
  string                    actor_id       = 4;
  string                    actor_kind     = 5; // user | system | api_key
  string                    action         = 6; // e.g. "document.create"
  string                    resource_kind  = 7;
  string                    resource_id    = 8;
  string                    outcome        = 9; // success | failure
  string                    source_ip_hash = 10;
  map<string, string>       metadata       = 11;
  string                    prev_hash      = 12; // hash chain pointer
  string                    hash           = 13; // sha256 of (prev_hash || canonicalized fields)
  google.protobuf.Timestamp occurred_at    = 14;
}

message QueryAuditRequest {
  string                    tenant_id     = 1; // admin override; normal users scoped to own tenant
  string                    actor_id      = 2;
  string                    action        = 3;
  string                    resource_kind = 4;
  string                    resource_id   = 5;
  string                    outcome       = 6;
  google.protobuf.Timestamp from          = 7;
  google.protobuf.Timestamp to            = 8;
  string                    correlation_id = 9;
  PageRequest               page          = 10;
}
message QueryAuditResponse {
  repeated AuditEvent events = 1;
  PageResponse        page   = 2;
}

message GetAuditEventRequest { string id = 1; }

message ExportAuditRequest {
  QueryAuditRequest filter    = 1;
  string            format    = 2; // "csv" | "ndjson"
  bool              include_signed = 3;
}
message GetExportRequest { string id = 1; }
message ExportJob {
  string                    id           = 1;
  string                    status       = 2; // queued | running | done | failed
  string                    download_url = 3;
  int64                     row_count    = 4;
  google.protobuf.Timestamp expires_at   = 5;
}

message VerifyChainRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to   = 2;
}
message VerifyChainResponse {
  bool   valid     = 1;
  int64  checked   = 2;
  string first_break_event_id = 3;
}
