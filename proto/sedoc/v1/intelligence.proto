syntax = "proto3";

package sedoc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aieera/sedoc/proto/gen/go/sedoc/v1;sedocv1";

// IntelligenceService exposes AI-powered operations: summarization,
// extraction, Q&A, embeddings, OCR. Long-running tasks return a job ID.
service IntelligenceService {
  rpc Summarize       (SummarizeRequest)       returns (SummarizeResponse);
  rpc ExtractEntities (ExtractEntitiesRequest) returns (ExtractEntitiesResponse);
  rpc AskDocument     (AskDocumentRequest)     returns (AskDocumentResponse);

  rpc RunOCR      (RunOCRRequest)      returns (OCRJob);
  rpc GetOCRJob   (GetOCRJobRequest)   returns (OCRJob);

  rpc Embed       (EmbedRequest)       returns (EmbedResponse);
  rpc BatchEmbed  (BatchEmbedRequest)  returns (BatchEmbedResponse);

  rpc DetectPII   (DetectPIIRequest)   returns (DetectPIIResponse);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED      = 1;
  JOB_STATUS_RUNNING     = 2;
  JOB_STATUS_SUCCEEDED   = 3;
  JOB_STATUS_FAILED      = 4;
  JOB_STATUS_CANCELLED   = 5;
}

message SummarizeRequest {
  string document_id = 1;
  int32  max_words   = 2; // default 200
  string style       = 3; // "bullet" | "paragraph" | "executive"
}
message SummarizeResponse {
  string summary     = 1;
  int32  token_count = 2;
  string model       = 3;
}

message Entity {
  string type       = 1; // PERSON | ORG | DATE | MONEY | EMAIL | PHONE | CUSTOM
  string value      = 2;
  int32  start      = 3;
  int32  end        = 4;
  float  confidence = 5;
}

message ExtractEntitiesRequest  { string document_id = 1; repeated string entity_types = 2; }
message ExtractEntitiesResponse { repeated Entity entities = 1; }

message AskDocumentRequest {
  string          document_id    = 1;
  string          question       = 2;
  int32           max_answer_tokens = 3;
  repeated string citation_fields = 4;
}
message Citation {
  string document_id = 1;
  int32  page        = 2;
  int32  start       = 3;
  int32  end         = 4;
  string snippet     = 5;
}
message AskDocumentResponse {
  string            answer    = 1;
  repeated Citation citations = 2;
  float             confidence = 3;
  string            model     = 4;
}

message RunOCRRequest {
  string document_id = 1;
  string version_id  = 2;
  string language    = 3; // ISO 639-1, empty = auto
}
message GetOCRJobRequest { string id = 1; }
message OCRJob {
  string                    id          = 1;
  string                    document_id = 2;
  JobStatus                 status      = 3;
  int32                     page_count  = 4;
  int32                     pages_done  = 5;
  string                    text_key    = 6; // S3 key to extracted text
  string                    error       = 7;
  google.protobuf.Timestamp started_at  = 8;
  google.protobuf.Timestamp completed_at = 9;
}

message EmbedRequest       { string text = 1; string model = 2; }
message EmbedResponse      { repeated float vector = 1; string model = 2; int32 dimensions = 3; }
message BatchEmbedRequest  { repeated string texts = 1; string model = 2; }
message BatchEmbedResponse { repeated EmbedResponse results = 1; }

message DetectPIIRequest {
  oneof source {
    string document_id = 1;
    string text        = 2;
  }
}
message PIIFinding {
  string type    = 1; // SSN | EMAIL | PHONE | CREDIT_CARD | ...
  int32  count   = 2;
  string sample  = 3; // redacted sample for UI
}
message DetectPIIResponse {
  repeated PIIFinding findings = 1;
  bool                any_found = 2;
}
