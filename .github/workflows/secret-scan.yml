# Gitleaks full-history secret scan.
#
# Pre-commit catches secrets before they land in a commit. This CI
# pass is the backstop: any commit pushed to a branch — including
# ones made with `git commit --no-verify` — gets scanned against the
# full git history.
#
# Why full history (not `--staged` or last-commit-only): once a secret
# is in history, rotating the leaked credential + force-pushing is
# painful. Surfacing at push time lets us catch a laptop-rotation
# window before secrets replicate to CI artefacts.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures the full history is available for
          # gitleaks's `git log -p` walk. Shallow clones miss secrets
          # introduced before the PR's base SHA.
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Pinned config from the repo root. Without this, the action
          # falls back to gitleaks's default rules only and ignores
          # our VaultDMS-specific extensions.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Don't upload to gitleaks.io — telemetry we don't consume.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30
