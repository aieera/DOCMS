# §3.2 — pre-build every service image and push to ghcr.io so the
# Phase A / G1 live drill becomes a compose-pull, not a 45-minute
# cold build on whatever laptop is doing the drill.
#
# Triggered on push to main (latest) and on tag push (release).
# PRs run the build jobs to catch Dockerfile regressions BUT don't
# push — only ref.name == main or a release tag publishes.
#
# Naming (H-21: the one namespace Helm, docker-compose.prebuilt.yml, the
# airgap bundle and install.sh pull from):
#   ghcr.io/aieera/sedoc/<image>:main             → tip of main
#   ghcr.io/aieera/sedoc/<image>:sha-<short>      → pinned snapshot
#   ghcr.io/aieera/sedoc/<image>:<tag>            → release tag
#
# The image list is .github/images.json, shared with ci.yml's Trivy matrix
# and release.yml: the 14 Go services (build/Dockerfile.go-service), plus
# collaboration, intelligence, preview, signature-signer and web.

name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "services/**"
      - "web/**"
      - "build/Dockerfile.go-service"
      - "pkg/**"
      - "proto/gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/images.json"
      - ".github/workflows/images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/aieera/sedoc

jobs:
  image-matrix:
    name: Image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/images.json
          sparse-checkout-cone-mode: false
      - id: m
        run: echo "matrix=$(jq -c . .github/images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [image-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk (torch + spaCy image)
        if: matrix.image == 'intelligence'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # SERVICE selects the binary in build/Dockerfile.go-service; the
          # other Dockerfiles do not declare it.
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
