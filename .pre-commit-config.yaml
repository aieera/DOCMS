# Local hook config. Install once per clone:
#
#   pipx install pre-commit      # or: pip install --user pre-commit
#   pre-commit install           # wires .git/hooks/pre-commit
#
# What runs before every commit:
#   - gitleaks   — staged-diff scan against .gitleaks.toml
#   - golangci   — fast subset on changed Go files only
#   - prettier   — web/ + doc formatting for consistent diffs
#
# Hooks run against staged files, not the full tree, so they stay
# fast (under 10 s on typical diffs). The heavy CI workflows cover
# full-repo passes.
#
# Bypassing with `git commit --no-verify` is allowed for mechanical
# rebases / reverts, but the CI secret-scan + sast jobs still run the
# scan on push — a bypassed secret still gets caught.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # The `gitleaks protect --staged` mode scans only added/changed
        # lines in the staged diff. Fast, and matches what CI sees on
        # the PR.
        name: gitleaks (staged diff)

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.57.2
    hooks:
      - id: golangci-lint
        # Restricted to Go files touched in the commit. Full-repo lint
        # runs in CI (.github/workflows/ci.yml).
        files: \.go$
        args: ["--fast", "--new-from-rev", "HEAD~1"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Only web/ sources + yaml/markdown. Avoid reformatting Go —
        # goimports + gofmt own that via golangci above.
        files: \.(ts|tsx|js|jsx|css|scss|json|yaml|yml|md)$
        exclude: |
          (?x)^(
            web/dist/.*|
            web/src/routeTree\.gen\.ts|
            clients/.*
          )$

  # Light housekeeping. Keep the list small so `pre-commit run` stays
  # under 10 s; heavier checks belong in CI.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
