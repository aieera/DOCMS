// Wave 12.9 — gRPC contract between the Go signature service
// and the Java DSS sidecar.
//
// Narrow by design: one Sign RPC, one Verify RPC. The full PAdES
// configuration (TSA URL, OCSP responders, signature field name,
// reason / location, signer cert chain, level) rides in the
// request. The sidecar is stateless — no persistent config, no
// per-tenant state.

syntax = "proto3";

package sedoc.signer.v1;

option java_package = "io.sedoc.signer.grpc";
option java_multiple_files = true;
option java_outer_classname = "SignerProto";
option go_package = "github.com/aieera/sedoc/proto/gen/go/signerv1;signerv1";

// SignerService is the only surface. All secrets flow in the
// request envelope; nothing persists in the sidecar between
// requests. ADR 0025 §Security boundary.
service SignerService {
  // Sign produces a PAdES revision of `pdf_bytes` at the requested
  // level. Deterministic for a given (pdf, signer_cert, nonce,
  // timestamp) tuple — the signature value itself varies with the
  // TSA's timestamp response but the envelope structure doesn't.
  rpc Sign(SignRequest) returns (SignResponse);

  // Verify inspects a signed PDF and returns the embedded signer
  // info + LTV status. Powers the Go service's /signatures/verify
  // endpoint.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}

// PAdES baseline levels per ETSI EN 319 142.
enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_BB  = 1;  // B-B: basic signature
  LEVEL_BT  = 2;  // B-T: basic + timestamp
  LEVEL_BLT = 3;  // B-LT: + validation material (default for Wave 9)
  LEVEL_BLTA = 4; // B-LTA: + archive timestamp chain
}

// Mode: who holds the signing key?
enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_SERVER_HSM  = 1; // sidecar unwraps DEK via the caller-supplied KMS alias
  MODE_USER_HELD   = 2; // caller provides a detached CMS signature + chain
}

message SignRequest {
  // Document to sign. For incremental signing on a multi-signer
  // envelope, this is the current revision — the previous signer's
  // signature must already be embedded.
  bytes pdf_bytes = 1;

  // Signer appearance / PAdES signerInfo fields.
  string signer_name  = 2;
  string signer_email = 3;
  string reason       = 4;
  string location     = 5;
  string contact_info = 6;

  // PAdES field name — convention "Signer_<order>" so
  // `pdfsig --list` output is greppable.
  string field_name = 7;

  Level level = 8;
  Mode  mode  = 9;

  // Server-HSM mode: the KMS alias the Go service resolved for
  // this request. The sidecar makes exactly one Sign(hash) call
  // to the backing KMS for this alias.
  string kms_alias = 10;

  // User-held mode: detached CMS signature + cert chain
  // (leaf-first, PEM-encoded).
  bytes          detached_signature = 11;
  repeated bytes cert_chain         = 12;

  // Timestamp authority. Empty → sidecar falls back to its
  // configured default (SIGNER_TSA_URL env).
  string tsa_url = 13;
}

message SignResponse {
  bytes  pdf_bytes   = 1;
  Level  level       = 2;
  string signed_at   = 3;  // RFC 3339
  string fingerprint = 4;  // SHA-256 hex of `pdf_bytes`
  string validation_report = 5; // DSS detailed-report JSON
}

message VerifyRequest {
  bytes pdf_bytes = 1;
}

message VerifyResponse {
  int32 signature_count     = 1;
  bool  ltv_enabled         = 2;
  bool  tamper_evident      = 3;
  repeated SignatureInfo signatures = 4;
}

message SignatureInfo {
  string signer_name = 1;
  string signed_at   = 2;
  string issuer      = 3;
  bool   valid       = 4;
  Level  level       = 5;
  string reason      = 6;
}
