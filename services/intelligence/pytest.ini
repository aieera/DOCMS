[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# Custom markers — register here so pytest doesn't warn on them.
# `benchmark` is excluded from the default unit run (timing-sensitive,
# would flake on slow CI runners). Invoke explicitly with
# `pytest -m benchmark` for a perf report.
# `live` is excluded by default too — those tests hit real third-party
# APIs (Anthropic / OpenAI) and need a key in the environment.
markers =
    benchmark: throughput / latency micro-benchmarks (excluded by default)
    live: hits a live external service; needs creds (excluded by default)
    integration: legacy marker used by test_ocr_pipeline (excluded by default)
