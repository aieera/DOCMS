run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.22"

linters:
  disable-all: true
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - gosimple
    - typecheck
    - gocritic
    - gosec
    - exhaustive
    - nilerr
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - noctx
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - prealloc
    - contextcheck
    - forbidigo

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - ifElseChain
      - singleCaseSwitch
  gosec:
    excludes:
      - G104 # handled by errcheck
      - G304 # file path from variable — acceptable with validation
  exhaustive:
    default-signifies-exhaustive: true
  govet:
    enable-all: true
    disable:
      - fieldalignment
  goimports:
    local-prefixes: github.com/vaultdms/vaultdms
  misspell:
    locale: US
  # T-D-5 — block http.DefaultClient anywhere. DefaultClient has no
  # Timeout; under downstream slowness it pins a goroutine + socket
  # until the caller's context expires. Every package must own a
  # named client with an explicit timeout + otelhttp transport, like
  # services/workflow/internal/activities/httpclient.go.
  forbidigo:
    analyze-types: true
    forbid:
      - pattern: '^http\.DefaultClient$'
        msg: "http.DefaultClient has no Timeout; declare a package-local http.Client with a Timeout + otelhttp transport (see services/workflow/internal/activities/httpclient.go)."

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - unparam
        - gocritic
        - forbidigo
    - path: cmd/
      linters:
        - gochecknoinits
