# VaultDMS — local development infrastructure.
# Bring up with `make docker-up`. Services (Go binaries) run on the host during
# development; this compose file provides only their dependencies.

name: vaultdms-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultdms-postgres
    environment:
      POSTGRES_DB: vaultdms
      POSTGRES_USER: vaultdms
      POSTGRES_PASSWORD: devpassword
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vaultdms-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: vaultdms-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevOnly!Passw0rd
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200", "9600:9600"]
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: vaultdms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    # MinIO image ships with bash + mc but not curl/wget. Use bash's
    # /dev/tcp pseudo-file to probe the S3 port — same semantics as a curl
    # against /minio/health/live but with zero extra binaries.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: vaultdms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/dms-us-east-1-hot;
      mc mb --ignore-existing local/dms-us-east-1-warm;
      mc mb --ignore-existing local/dms-us-east-1-previews;
      mc mb --ignore-existing local/dms-quarantine;
      mc mb --ignore-existing local/health-check;
      echo 'bucket provisioning complete';
      "
    restart: "no"

  nats:
    image: nats:2.10
    container_name: vaultdms-nats
    command: -js -sd /data -m 8222
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: vaultdms-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.22
    container_name: vaultdms-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=vaultdms
      - POSTGRES_PWD=devpassword
      - POSTGRES_SEEDS=postgres
    ports: ["7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.22.3
    container_name: vaultdms-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports: ["8233:8080"]
    depends_on: [temporal]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: vaultdms-clamav
    ports: ["3310:3310"]
    volumes:
      - clamdata:/var/lib/clamav
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Application services built from per-service Dockerfiles.
  # Disabled by default via the `app` profile — infra alone is enough
  # for running Go services on the host (see `make run-all`). Start the
  # app tier with `docker compose --profile app up -d`.
  # ---------------------------------------------------------------------

  collaboration:
    profiles: [app]
    build:
      context: .
      dockerfile: services/collaboration/Dockerfile
    container_name: vaultdms-collaboration
    environment:
      WS_PORT: "8083"
      REDIS_URL: "redis://redis:6379"
      AUTH_SERVICE_URL: "http://auth:8080"
    ports: ["8083:8083"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  intelligence-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
    container_name: vaultdms-intelligence-worker
    command:
      - celery
      - "-A"
      - app.worker
      - worker
      - "--loglevel=info"
      - "-Q"
      - "intelligence,intelligence-ocr,intelligence-embed,intelligence-rag"
    environment:
      VAULTDMS_CELERY_BROKER_URL: "redis://redis:6379/1"
      VAULTDMS_DATABASE_URL: "postgres://vaultdms:devpassword@postgres:5432/vaultdms?sslmode=disable"
      VAULTDMS_NATS_URL: "nats://nats:4222"
      VAULTDMS_QDRANT_URL: "http://qdrant:6333"
      VAULTDMS_S3_ENDPOINT: "http://minio:9000"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  preview-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: services/preview/Dockerfile
    container_name: vaultdms-preview-worker
    command:
      - celery
      - "-A"
      - app.worker
      - worker
      - "--loglevel=info"
      - "-Q"
      - "preview,preview-video"
    environment:
      VAULTDMS_CELERY_BROKER_URL: "redis://redis:6379/2"
      VAULTDMS_S3_ENDPOINT: "http://minio:9000"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
  natsdata:
  qdrantdata:
  clamdata:
