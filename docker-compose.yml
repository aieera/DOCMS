# SeDoc — local development infrastructure.
# Bring up with `make docker-up`. Services (Go binaries) run on the host during
# development; this compose file provides only their dependencies.

name: sedoc-dev

# ----- Shared anchors for Go services (§3.2 / A2 Sub-task B) -----
# Docker Compose permits free-form top-level keys prefixed with `x-`.
# Anchored here so they can be merged into each Go-service block via *.
x-go-env: &go-env
  # §3.1 / B2.2 — shared secret; pkg/middleware.RequireGatewaySignature
  # rejects any request that doesn't carry a matching X-Gateway-Signature.
  # Must be identical to the gateway's SEDOC_GATEWAY_SECRET.
  SEDOC_GATEWAY_SECRET: "${SEDOC_GATEWAY_SECRET:?SEDOC_GATEWAY_SECRET must be set — see web/.env.example or run: openssl rand -hex 32}"
  # Shared internal-service secret. Lets autonomous backend workers
  # (connector email ingestion + watched-folder intake) authenticate to
  # the document service's SessionOrAPIKey-gated write routes via
  # X-Internal-Service-Key, acting on behalf of the config owner. Also
  # used by /internal/v1/retention/sweep. The gateway strips inbound
  # X-Internal-Service-Key so only in-cluster services can present it.
  SEDOC_INTERNAL_API_KEY: "${SEDOC_INTERNAL_API_KEY:-dev-internal-service-key-rotate-in-prod}"
  # Service-to-service key (X-Service-Key) for the document→preview
  # watermark call. The preview service reads the same value to gate its
  # internal stamping endpoints (fail-closed when empty). SEDOC_PREVIEW_URL
  # points the document watermark client at the preview API directly (not
  # through the gateway — service-to-service).
  SEDOC_SERVICE_API_KEY: "${SEDOC_SERVICE_API_KEY:-dev-service-key-rotate-in-prod}"
  SEDOC_PREVIEW_URL: "http://preview:8080"
  SEDOC_DATABASE_URL: "postgres://sedoc:devpassword@postgres:5432/sedoc?sslmode=disable"
  # FIX-7 (audit C6) — dev opt-in for the BYPASSRLS connection role.
  # Prod must connect as `dms_app` (NOBYPASSRLS) and leave this unset
  # so pkg/database.AssertRLSPosture refuses to boot under an
  # accidentally-elevated role.
  SEDOC_ALLOW_BYPASS_RLS: "1"
  SEDOC_REDIS_URL:    "redis:6379"
  SEDOC_NATS_URL:     "nats://nats:4222"
  SEDOC_HEALTH_PORT:  "8081"
  SEDOC_HTTP_PORT:    "8080"
  SEDOC_GRPC_PORT:    "9090"
  # ERP integration Files BFF (runs in the separate `sedoc-integration`
  # compose, reached via the host's published port). The auth service's
  # /api/v1/integrations/erp/* proxy forwards here. Default is the host LAN IP
  # (same address the CRM uses); override per environment.
  SEDOC_INTEGRATION_BFF_URL: "${SEDOC_INTEGRATION_BFF_URL:-http://192.168.70.22:18091}"
  SEDOC_S3_ENDPOINT:  "http://minio:9000"
  # Browser-reachable address. Storage service signs presigned URLs
  # against this so the Host header matches in dev (browser can't
  # resolve "minio:9000" — that's docker-internal DNS). In prod set
  # to whatever the customer's browser hits, usually equal to the
  # internal endpoint (e.g. "s3.amazonaws.com").
  SEDOC_S3_PUBLIC_BASE: "localhost:9000"
  SEDOC_S3_ACCESS_KEY: "minioadmin"
  SEDOC_S3_SECRET_KEY: "minioadmin"
  SEDOC_OPENSEARCH_URL: "http://opensearch:9200"
  SEDOC_QDRANT_URL:   "http://qdrant:6333"
  SEDOC_TEMPORAL_ADDR: "temporal:7233"
  # §7.1 / D6 part 2 — search service's dense-vector path. Both must
  # be set for hybrid/semantic mode to activate; otherwise Search()
  # degrades to lexical and logs a notice.
  SEDOC_INTELLIGENCE_EMBED_URL: "http://intelligence:8080/internal/v1/embed-query"
  SEDOC_QDRANT_COLLECTION: "vaultdms_chunks"
  # §10.3 / E6 — OnlyOffice integration
  SEDOC_ONLYOFFICE_URL: "http://onlyoffice"  # in-cluster DNS
  SEDOC_ONLYOFFICE_PUBLIC_URL: "http://localhost:8195"  # what the browser sees
  SEDOC_ONLYOFFICE_JWT: "${SEDOC_ONLYOFFICE_JWT:-dev-only-onlyoffice-jwt-rotate-in-prod}"
  POLICY_SERVICE_ADDR:   "policy:9090"
  STORAGE_SERVICE_ADDR:  "storage:9090"
  # graphql-gateway upstream gRPC clients. Without these set, the gateway's
  # config defaults weren't taking effect, so the Audit/Document/Workflow
  # clients were nil and resolvers (e.g. the per-document Activity feed) silently
  # returned empty. Each points at the service's :9090 gRPC port.
  DOCUMENT_SERVICE_ADDR:  "document:9090"
  AUDIT_SERVICE_ADDR:     "audit:9090"
  WORKFLOW_SERVICE_ADDR:  "workflow:9090"
  # CollaborationService gRPC (comments/annotations) is served by the
  # DOCUMENT service — the Node Yjs container is WebSocket-only.
  COLLABORATION_SERVICE_ADDR: "document:9090"
  SEDOC_ENV:          "development"
  # ADR 0110 — cluster region. Echoed in /healthz so the Residency
  # admin page can confirm which region a service is serving. Without
  # this set, every /healthz reports `"region":"unknown"` and the
  # admin UI shows a "Cluster region unknown" warning banner.
  # Override per regional cluster via deploy/regions/<name>.yaml.
  SEDOC_REGION_ID:    "${SEDOC_REGION_ID:-us-east-1}"
  # ADR 0078 — small-secret AES-256 KEK shared with the intelligence
  # worker for per-tenant LLM key encrypt/decrypt. Same key the auth
  # service uses for MFA secrets.
  SEDOC_LOCAL_KEK:    "${SEDOC_LOCAL_KEK:-}"
  # ADR 0022 envelope encryption-at-rest. Storage auto-enables it
  # whenever a KMS is wired, but the OCR / preview / intelligence
  # workers download raw S3 bytes via boto3 and have no decrypt
  # path — encrypted PDFs surface as "OCR failed: cannot find
  # document handler." Disable for dev until the storage service
  # grows a GetObjectBytes RPC that decrypts before streaming
  # (queued for the next storage wave). Prod sets this true via
  # Helm.
  SEDOC_STORAGE_ENCRYPT_AT_REST: "${SEDOC_STORAGE_ENCRYPT_AT_REST:-false}"
  # ClamAV INSTREAM scans in dev compose take 5–7s per upload —
  # enough that the FE looks hung. Skip in dev. Prod sets this
  # false (or unset) via Helm so every upload is scanned.
  SEDOC_STORAGE_SKIP_VIRUS_SCAN: "${SEDOC_STORAGE_SKIP_VIRUS_SCAN:-true}"
  # ADR 0071 — eSign provider credentials. The supported path is
  # per-tenant configuration from /admin/integrations (saved sealed in
  # esign_provider_configs). SEDOC_ESIGN_DOCUSIGN_* / *_ADOBE_SIGN_*
  # envs remain as an optional deployment-wide fallback for shared
  # tenant setups; leave unset for per-tenant-only mode.
  #
  # Compose only forwards env vars listed in this map (the .env file
  # alone provides variable substitution, NOT auto-forwarding). Each
  # entry defaults to "" so an unset .env stays a no-op.
  SEDOC_ESIGN_STATE_HMAC:           "${SEDOC_ESIGN_STATE_HMAC:-}"
  SEDOC_ESIGN_DOCUSIGN_CLIENT_ID:     "${SEDOC_ESIGN_DOCUSIGN_CLIENT_ID:-}"
  SEDOC_ESIGN_DOCUSIGN_CLIENT_SECRET: "${SEDOC_ESIGN_DOCUSIGN_CLIENT_SECRET:-}"
  SEDOC_ESIGN_DOCUSIGN_AUTHORIZE_URL: "${SEDOC_ESIGN_DOCUSIGN_AUTHORIZE_URL:-}"
  SEDOC_ESIGN_DOCUSIGN_TOKEN_URL:     "${SEDOC_ESIGN_DOCUSIGN_TOKEN_URL:-}"
  SEDOC_ESIGN_DOCUSIGN_REDIRECT_URI:  "${SEDOC_ESIGN_DOCUSIGN_REDIRECT_URI:-}"
  SEDOC_ESIGN_ADOBE_SIGN_CLIENT_ID:     "${SEDOC_ESIGN_ADOBE_SIGN_CLIENT_ID:-}"
  SEDOC_ESIGN_ADOBE_SIGN_CLIENT_SECRET: "${SEDOC_ESIGN_ADOBE_SIGN_CLIENT_SECRET:-}"
  SEDOC_ESIGN_ADOBE_SIGN_AUTHORIZE_URL: "${SEDOC_ESIGN_ADOBE_SIGN_AUTHORIZE_URL:-}"
  SEDOC_ESIGN_ADOBE_SIGN_TOKEN_URL:     "${SEDOC_ESIGN_ADOBE_SIGN_TOKEN_URL:-}"
  SEDOC_ESIGN_ADOBE_SIGN_REDIRECT_URI:  "${SEDOC_ESIGN_ADOBE_SIGN_REDIRECT_URI:-}"

  # Twilio (SMS MFA) — auth service. Env-mode is the deployment-wide
  # fallback; per-tenant rows in tenant_twilio_configs win when present.
  SEDOC_TWILIO_ACCOUNT_SID: "${SEDOC_TWILIO_ACCOUNT_SID:-}"
  SEDOC_TWILIO_AUTH_TOKEN:  "${SEDOC_TWILIO_AUTH_TOKEN:-}"
  SEDOC_TWILIO_VERIFY_SID:  "${SEDOC_TWILIO_VERIFY_SID:-}"

  # SMTP (transactional + email OTP) — auth + notification services.
  # Same per-tenant precedence as Twilio (tenant_smtp_configs wins).
  # Both SEDOC_SMTP_USER (auth) and SEDOC_SMTP_USERNAME
  # (notification) exist until pkg/config is unified.
  SEDOC_SMTP_HOST:     "${SEDOC_SMTP_HOST:-}"
  SEDOC_SMTP_PORT:     "${SEDOC_SMTP_PORT:-587}"
  SEDOC_SMTP_USER:     "${SEDOC_SMTP_USER:-}"
  SEDOC_SMTP_USERNAME: "${SEDOC_SMTP_USERNAME:-}"
  SEDOC_SMTP_PASSWORD: "${SEDOC_SMTP_PASSWORD:-}"

  # ADR 0095 — license JWT. Empty = unlicensed_dev_mode (every feature
  # implicitly enabled, today's behavior). Set via .env or directly to
  # an RS256-signed token minted by cmd/license-gen with the matching
  # private key. Verified at startup + hourly against the public key
  # embedded in pkg/license/dev_pubkey.go.
  SEDOC_LICENSE_JWT:    "${SEDOC_LICENSE_JWT:-}"
  # SEDOC_REQUIRE_LICENSE=true upgrades absent-license to a fatal
  # startup error (prod posture). Leave unset in dev.
  SEDOC_REQUIRE_LICENSE: "${SEDOC_REQUIRE_LICENSE:-}"
  SEDOC_SMTP_FROM:     "${SEDOC_SMTP_FROM:-noreply@vaultdms.local}"
  SEDOC_SMTP_STARTTLS: "${SEDOC_SMTP_STARTTLS:-true}"

  # WebAuthn / Passkeys — auth service. Service still returns 501
  # until the go-webauthn wiring lands, but env propagation goes in
  # now so deploys don't have to round-trip compose later.
  SEDOC_WEBAUTHN_RPID:         "${SEDOC_WEBAUTHN_RPID:-}"
  SEDOC_WEBAUTHN_ORIGINS:      "${SEDOC_WEBAUTHN_ORIGINS:-}"
  SEDOC_WEBAUTHN_DISPLAY_NAME: "${SEDOC_WEBAUTHN_DISPLAY_NAME:-SeDoc}"
  SEDOC_WEBAUTHN_HMAC_SECRET:  "${SEDOC_WEBAUTHN_HMAC_SECRET:-}"

  # Distributed tracing (OpenTelemetry). pkg/tracing.Enabled() is true
  # when SEDOC_TRACING_ENABLED=1 OR OTEL_EXPORTER_OTLP_ENDPOINT is set;
  # here we point every Go service at the jaeger all-in-one OTLP/HTTP
  # receiver (:4318) and default it ON for local dev so a golden trace
  # (upload → document → outbox → search) is visible in the Jaeger UI at
  # http://localhost:16686 out of the box. Sampling defaults to 1% in
  # code; dev overrides to 100% so every request shows up. Set
  # SEDOC_TRACING_ENABLED=0 to turn it off entirely.
  SEDOC_TRACING_ENABLED:        "${SEDOC_TRACING_ENABLED:-1}"
  OTEL_EXPORTER_OTLP_ENDPOINT:  "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
  SEDOC_TRACE_SAMPLE_RATIO:     "${SEDOC_TRACE_SAMPLE_RATIO:-1.0}"

x-go-depends: &go-depends
  postgres: { condition: service_healthy }
  redis:    { condition: service_healthy }
  nats:     { condition: service_healthy }

x-go-healthcheck: &go-healthcheck
  test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    container_name: sedoc-postgres
    # Default max_connections=100 is too low: 13 Go services each open a
    # pgxpool (MinConns=5, MaxConns=50 — see pkg/database/pool.go) plus the
    # Python asyncpg pools, so the stack idles near the ceiling and bursts
    # over it ("FATAL: sorry, too many clients already"), which silently
    # starves freshly-(re)started services of their pool.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_DB: sedoc
      POSTGRES_USER: sedoc
      POSTGRES_PASSWORD: devpassword
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sedoc-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ADR 0062 — slapd for LDAP/AD direct-bind integration tests + dev.
  # Bootstraps an "Example Inc" tree with two groups (engineers,
  # finance) and two users (alice, bob) so the admin UI has something
  # to bind against out of the box. Production deploys point the
  # auth service at the customer's real directory, not this container.
  slapd:
    image: bitnamilegacy/openldap:2.6
    container_name: sedoc-slapd
    environment:
      LDAP_ROOT: "dc=example,dc=com"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_USERS: "alice,bob"
      LDAP_PASSWORDS: "alice-pw,bob-pw"
      LDAP_USER_DC: "users"
      LDAP_GROUP: "engineers"
    ports:
      - "1389:1389"
      - "1636:1636"
    volumes:
      - slapddata:/bitnami/openldap
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:1389", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "admin", "-s", "base"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: sedoc-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevOnly!Passw0rd
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200", "9600:9600"]
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: sedoc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    # MinIO image ships with bash + mc but not curl/wget. Use bash's
    # /dev/tcp pseudo-file to probe the S3 port — same semantics as a curl
    # against /minio/health/live but with zero extra binaries.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: sedoc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # FIX-8 (audit Section 12). Bucket versioning is enabled below so
    # deletes are recoverable — DR runbook documents S3 versioning as
    # the recovery mechanism but the buckets were never versioned in
    # code. Object-lock GOVERNANCE requires --with-lock at bucket
    # create time; legacy clusters need a one-time manual recreate.
    #
    # Inline comments in `>` folded scalars become shell `#` on a
    # single line and silently truncate later commands — that's why
    # the keep-it-comment-free style here.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/dms-us-east-1-hot;
      mc mb --ignore-existing local/dms-us-east-1-warm;
      mc mb --ignore-existing local/dms-us-east-1-previews;
      mc mb --ignore-existing local/dms-quarantine;
      mc mb --ignore-existing local/health-check;
      mc version enable local/dms-us-east-1-hot      || true;
      mc version enable local/dms-us-east-1-warm     || true;
      mc version enable local/dms-us-east-1-previews || true;
      mc version enable local/dms-quarantine         || true;
      echo 'bucket provisioning complete';
      "
    restart: "no"

  nats:
    image: nats:2.10-alpine
    container_name: sedoc-nats
    # JetStream's max_file_store (logical reservation ceiling, not a
    # physical pre-allocation) is pinned to 256GB in nats.conf so the
    # event bus's ~225GB of stream MaxBytes reservations can bootstrap.
    # NATS 2.10 has no --max_file_store CLI flag, so it must come from a
    # config file. See deploy/nats/nats.conf for the full rationale.
    command: -js -c /etc/nats/nats.conf
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # §10.3 / E6 — OnlyOffice Document Server for DOCX/XLSX/PPTX
  # co-editing. JWT-enabled so the document service signs the editor
  # config and OnlyOffice refuses unsigned load requests.
  # ADR 0065 — Collabora Online as the WOPI alternative to OnlyOffice.
  # AGPLv3; the admin UI gates exposure of this option behind an
  # explicit license acknowledgement (tenant_settings.agpl_acknowledged_at).
  # The host (document service) speaks WOPI at /wopi/*; Collabora's
  # `aliasgroup1` config tells it which host to trust for the
  # WOPISrc query param it follows from discovery.xml.
  collabora:
    image: collabora/code:24.04.6.1.1
    container_name: sedoc-collabora
    environment:
      domain: "document\\:8080|localhost\\:8080|host\\.docker\\.internal\\:8080"
      username: "admin"
      password: "${SEDOC_COLLABORA_ADMIN_PASSWORD:-dev-only-rotate-in-prod}"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:storage.wopi.alias_groups.group[1].host=document"
    ports: ["9980:9980"]
    cap_add: ["MKNOD"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9980/hosting/discovery"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles: ["collabora"] # opt-in: docker compose --profile collabora up

  # 4 GB RAM + 2 vCPU is the vendor-minimum; tune in production.
  onlyoffice:
    image: onlyoffice/documentserver:8.0
    container_name: sedoc-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${SEDOC_ONLYOFFICE_JWT:-dev-only-onlyoffice-jwt-rotate-in-prod}"
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
    ports: ["8195:80"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # §3.1 / B1 — Kong API gateway. DBless mode (declarative), no DB
  # dependency. Single source of public traffic; B2 will move every
  # public REST route here and strip `ports:` off the backends so they
  # are only reachable via the gateway. This B1 spike leaves backend
  # ports in place so existing dev tooling keeps working while the
  # route migration lands one PR at a time.
  gateway:
    image: kong:3.5-ubuntu
    container_name: sedoc-gateway
    # Render kong.yaml with the gateway secret at boot (Kong's DBless
    # loader does not template env vars). entrypoint.sh substitutes
    # ${SEDOC_GATEWAY_SECRET} into /tmp/kong.resolved.yaml, then
    # delegates to Kong's stock entrypoint.
    entrypoint: ["/bin/sh", "/kong/declarative/entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      # Source template; entrypoint.sh reads this and writes the resolved
      # copy that Kong actually loads (KONG_DECLARATIVE_CONFIG is exported
      # to the resolved path inside the script).
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Admin API bound to 127.0.0.1 only — never reachable from the
      # network in dev. B2 disables it entirely in prod.
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      # Status listener (health + /metrics) on 8100.
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      # Proxy listener — the single published port.
      KONG_PROXY_LISTEN: "0.0.0.0:8080"
      # §3.1 / B2.2 — shared secret injected into every forwarded
      # request as X-Gateway-Signature. kong.yaml references it as
      # `${SEDOC_GATEWAY_SECRET}`; Kong env-substitutes at boot.
      SEDOC_GATEWAY_SECRET: "${SEDOC_GATEWAY_SECRET:?SEDOC_GATEWAY_SECRET must be set — see web/.env.example or run: openssl rand -hex 32}"
    volumes:
      - ./deploy/gateway:/kong/declarative:ro
    ports:
      - "8080:8080"   # public proxy
      - "8100:8100"   # /metrics + /status (prometheus)
    # `kong health` only checks that worker PROCESSES are alive — it stays
    # green even when Kong's data plane wedges (timer-ng crash) and the proxy
    # returns empty replies, which is exactly the recurring "ports return 000
    # but container is healthy" failure. Probe the actual status listener over
    # HTTP via resty (the image has no curl/wget) so a wedge is detected.
    healthcheck:
      test: ["CMD", "resty", "-e", "local s=ngx.socket.tcp(); s:settimeout(3000); local ok=s:connect('127.0.0.1',8100); if not ok then os.exit(1) end; local c=string.char(13,10); s:send('GET /status HTTP/1.0'..c..'Host: localhost'..c..c); local l=s:receive('*l'); s:close(); if l and l:find(' 200') then os.exit(0) else os.exit(1) end"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # Tagged for the autoheal sidecar: when the data-plane healthcheck above
    # flips this container to "unhealthy" (the Kong timer-ng wedge), autoheal
    # restarts it — Docker does NOT restart on unhealthy by itself.
    labels:
      autoheal: "true"

  # Watchdog that restarts any container labelled `autoheal=true` once Docker
  # reports it unhealthy. Label-scoped so ONLY the gateway is auto-restarted
  # (its healthcheck genuinely detects a data-plane wedge; the other services'
  # healthchecks aren't wired for that, so we don't want them flapping-restarted).
  # Needs the Docker socket to issue the restart (privileged — dev convenience).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: sedoc-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"          # check every 10s
      AUTOHEAL_START_PERIOD: "30"      # grace before monitoring a just-started container
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sedoc-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Distributed-tracing backend. jaeger all-in-one bundles an OTLP
  # receiver (:4318 HTTP, :4317 gRPC), in-memory storage, and the trace
  # UI (:16686). Every Go service exports here via OTEL_EXPORTER_OTLP_ENDPOINT
  # (set in the x-go-env anchor). Not a hard dependency of any service: the
  # OTLP batch exporter tolerates the collector being down, so boot order
  # is unaffected. View the golden trace (upload → document → outbox →
  # search) at http://localhost:16686 — see docs/observability/tracing.md.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sedoc-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (what pkg/tracing exports to)
      - "4317:4317"     # OTLP gRPC
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.22
    container_name: sedoc-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=sedoc
      - POSTGRES_PWD=devpassword
      - POSTGRES_SEEDS=postgres
    ports: ["7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.22.3
    container_name: sedoc-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports: ["8233:8080"]
    depends_on: [temporal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: sedoc-clamav
    ports: ["3310:3310"]
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Non-Go application services built from per-service Dockerfiles.
  # Started by default per §3.2 / A2 so `docker compose up` brings the
  # full compose tier up. The 11 Go services continue to run on the
  # host via `make run-all` (see scripts/run-all-services.sh); the
  # Sub-task B follow-up (§3.2 / A2 part 2) will migrate those into
  # compose as well.
  # ---------------------------------------------------------------------

  collaboration:
    build:
      # Dockerfile does COPY src/ / COPY package.json relative to the
      # service dir, not the repo root — context must match.
      context: services/collaboration
      dockerfile: Dockerfile
    container_name: sedoc-collaboration
    environment:
      WS_PORT: "8083"
      REDIS_URL: "redis://redis:6379"
      AUTH_SERVICE_URL: "http://auth:8080"
      # WS comment mutations persist through the document service's
      # comments API (create/update/delete + room-load hydration).
      DOCUMENT_SERVICE_URL: "http://document:8080"
      # §17.3 / D10 WS fan-out — annotation events bridged from NATS.
      SEDOC_NATS_URL: "nats://nats:4222"
      # ADR 0096 — Yjs snapshot persistence + gateway-sig for auth calls.
      SEDOC_DATABASE_URL: "postgres://sedoc:devpassword@postgres:5432/sedoc?sslmode=disable"
      SEDOC_GATEWAY_SECRET: "${SEDOC_GATEWAY_SECRET:?SEDOC_GATEWAY_SECRET must be set — see web/.env.example or run: openssl rand -hex 32}"
    ports: ["8083:8083"]
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    # Pure WebSocket server — no HTTP /healthz route. TCP probe on the
    # WS listener is the only app-code-free option and is sufficient to
    # detect "process up and accepting connections".
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8083"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # §7.1 / D6 part 2 — intelligence HTTP API. Serves /healthz, /ask,
  # /summarize, and /internal/v1/embed-query (the last is what the
  # search service calls for hybrid mode). Shares the Dockerfile with
  # intelligence-worker but uses the default uvicorn CMD.
  intelligence:
    build:
      context: services/intelligence
      dockerfile: Dockerfile
    container_name: sedoc-intelligence
    environment:
      SEDOC_DATABASE_URL: "postgres://sedoc:devpassword@postgres:5432/sedoc?sslmode=disable"
      SEDOC_NATS_URL: "nats://nats:4222"
      SEDOC_QDRANT_URL: "http://qdrant:6333"
      # MUST match the search service's SEDOC_QDRANT_COLLECTION (x-go-env,
      # = vaultdms_chunks). Without this the Python side falls back to the
      # config default "dms_vectors" and ingest writes to a different
      # collection than search queries → semantic search silently returns
      # nothing and hybrid degrades to lexical-only.
      SEDOC_QDRANT_COLLECTION: "vaultdms_chunks"
      # Per-request LLM budget (streaming included). The 30s code default
      # cut long doc-QA answers mid-stream; see app/config.py.
      SEDOC_LLM_TIMEOUT_SECONDS: "120"
      SEDOC_S3_ENDPOINT: "http://minio:9000"
      # boto3 credentials. The NATS consumer runs in this container
      # and may fetch the blob before enqueueing the Celery task; the
      # task itself runs in sedoc-intelligence-worker. Both need
      # the same creds.
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_DEFAULT_REGION: "us-east-1"
      # ADR 0078 — opt-in LLM NER. The per-tenant key is now stored
      # encrypted in ner_config (set via /admin/intelligence/ner-config);
      # the worker decrypts using SEDOC_LOCAL_KEK. The plain
      # ANTHROPIC_API_KEY / OPENAI_API_KEY env vars are still honored
      # by litellm as a fallback if no per-tenant key is configured.
      SEDOC_LOCAL_KEK: "${SEDOC_LOCAL_KEK:-}"
      ANTHROPIC_API_KEY:  "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY:     "${OPENAI_API_KEY:-}"
    ports: ["8194:8080"]
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  intelligence-worker:
    build:
      context: services/intelligence
      dockerfile: Dockerfile
    container_name: sedoc-intelligence-worker
    command:
      - celery
      - "-A"
      - app.worker
      - worker
      - "--loglevel=info"
      - "--pool=solo"
      - "-Q"
      - "intelligence,intelligence-ocr,intelligence-embed,intelligence-rag"
    environment:
      SEDOC_CELERY_BROKER_URL: "redis://redis:6379/1"
      SEDOC_DATABASE_URL: "postgres://sedoc:devpassword@postgres:5432/sedoc?sslmode=disable"
      SEDOC_NATS_URL: "nats://nats:4222"
      SEDOC_QDRANT_URL: "http://qdrant:6333"
      # MUST match the search service's SEDOC_QDRANT_COLLECTION (x-go-env,
      # = vaultdms_chunks). Without this the Python side falls back to the
      # config default "dms_vectors" and ingest writes to a different
      # collection than search queries → semantic search silently returns
      # nothing and hybrid degrades to lexical-only.
      SEDOC_QDRANT_COLLECTION: "vaultdms_chunks"
      # Per-request LLM budget (streaming included). The 30s code default
      # cut long doc-QA answers mid-stream; see app/config.py.
      SEDOC_LLM_TIMEOUT_SECONDS: "120"
      SEDOC_S3_ENDPOINT: "http://minio:9000"
      # boto3/botocore credentials for the OCR worker to download
      # blobs. Use AWS_* names (boto3 reads these directly without
      # any SeDoc-side glue). In compose dev these are MinIO's
      # admin creds; in prod each worker should use IRSA / instance
      # role.
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_DEFAULT_REGION: "us-east-1"
      # ADR 0078 LLM NER — see the intelligence service block above.
      SEDOC_LOCAL_KEK: "${SEDOC_LOCAL_KEK:-}"
      ANTHROPIC_API_KEY:  "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY:     "${OPENAI_API_KEY:-}"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    # Celery worker: no HTTP surface. `inspect ping` round-trips the
    # broker so a healthy status means (worker process up) AND (worker
    # can still talk to Redis) — stronger than a port probe.
    #
    # Generous retry budget on purpose: with --pool=solo the worker
    # can't answer inspect ping while a long task (OCR is ~30-180s on
    # CPU) is running. Without the budget Docker marks unhealthy mid-
    # OCR and restart kills the task before it can ack, so the
    # document never gets indexed and Q&A has nothing to retrieve.
    # 15s × 30 retries = 7.5 min grace covers the worst-case Surya
    # multi-page run while still catching a truly dead worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -t 10 | grep -q pong"]
      interval: 15s
      timeout: 12s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Companion to intelligence-worker. Same image, different queue subset:
  # everything EXCEPT intelligence-ocr. Without this, a single 30-60min
  # CPU Surya OCR job blocks ocr_quality scoring, lang_detect, classify,
  # embed, etc. behind it on the solo-pool main worker, so the OCR
  # review queue stays at 0 forever.
  intelligence-worker-misc:
    build:
      context: services/intelligence
      dockerfile: Dockerfile
    container_name: sedoc-intelligence-worker-misc
    command:
      - celery
      - "-A"
      - app.worker
      - worker
      - "--loglevel=info"
      - "--pool=solo"
      - "-Q"
      - "intelligence,intelligence-embed,intelligence-rag"
    environment:
      SEDOC_CELERY_BROKER_URL: "redis://redis:6379/1"
      SEDOC_DATABASE_URL: "postgres://sedoc:devpassword@postgres:5432/sedoc?sslmode=disable"
      SEDOC_NATS_URL: "nats://nats:4222"
      SEDOC_QDRANT_URL: "http://qdrant:6333"
      # MUST match the search service's SEDOC_QDRANT_COLLECTION (x-go-env,
      # = vaultdms_chunks). Without this the Python side falls back to the
      # config default "dms_vectors" and ingest writes to a different
      # collection than search queries → semantic search silently returns
      # nothing and hybrid degrades to lexical-only.
      SEDOC_QDRANT_COLLECTION: "vaultdms_chunks"
      # Per-request LLM budget (streaming included). The 30s code default
      # cut long doc-QA answers mid-stream; see app/config.py.
      SEDOC_LLM_TIMEOUT_SECONDS: "120"
      SEDOC_S3_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_DEFAULT_REGION: "us-east-1"
      SEDOC_LOCAL_KEK: "${SEDOC_LOCAL_KEK:-}"
      ANTHROPIC_API_KEY:  "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY:     "${OPENAI_API_KEY:-}"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -t 5 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Preview HTTP API (uvicorn). Serves /api/v1/previews/* (viewer) and the
  # service-authed /api/v1/previews/internal/* stamping endpoints. The
  # Kong gateway routes /api/v1/previews here (`http://preview:8080`);
  # without this container the gateway route had no upstream.
  preview:
    build:
      context: services/preview
      dockerfile: Dockerfile
    container_name: sedoc-preview-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      SEDOC_S3_ENDPOINT: "http://minio:9000"
      SEDOC_S3_ACCESS_KEY: "minioadmin"
      SEDOC_S3_SECRET_KEY: "minioadmin"
      SEDOC_REDIS_CACHE_URL: "redis://redis:6379/3"
      SEDOC_CELERY_BROKER_URL: "redis://redis:6379/2"
      SEDOC_NATS_URL: "nats://nats:4222"
      # Same value as the Go x-go-env anchor so the document→preview
      # watermark call authenticates.
      SEDOC_SERVICE_API_KEY: "${SEDOC_SERVICE_API_KEY:-dev-service-key-rotate-in-prod}"
    # Host port for the deploy-shaped smoke (scripts/preview-gateway-smoke.sh)
    # to reach the service-authed internal watermark path directly, as the
    # document service does in-cluster. Public traffic goes via the gateway.
    # 8193, not 8087 — 8087 is audit's published health port (8087:8081);
    # the original 8087:8080 mapping collided and this container could
    # never start alongside audit. 819x matches the service-HTTP convention.
    ports: ["8193:8080"]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  preview-worker:
    build:
      context: services/preview
      dockerfile: Dockerfile
    container_name: sedoc-preview-worker
    command:
      - celery
      - "-A"
      - app.worker
      - worker
      - "--loglevel=info"
      - "-Q"
      - "preview,preview-video"
    environment:
      SEDOC_CELERY_BROKER_URL: "redis://redis:6379/2"
      SEDOC_S3_ENDPOINT: "http://minio:9000"
      SEDOC_S3_ACCESS_KEY: "minioadmin"
      SEDOC_S3_SECRET_KEY: "minioadmin"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -t 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Go services — §3.2 / A2 Sub-task B.
  # All 11 share one builder (build/Dockerfile.go-service) parameterized
  # by SERVICE. YAML anchors factor the common env/depends_on/healthcheck
  # so per-service blocks carry only what actually differs: SERVICE arg,
  # container_name, and host port mapping for the health port.
  # Container-internal ports are uniform (health=8081, http=8080,
  # grpc=9090); host ports follow scripts/run-all-services.sh so dev
  # tooling keeps working (but compose will fail to bind if `make
  # run-all` is already holding those ports — use one or the other).
  # ---------------------------------------------------------------------

  auth:
    build: &go-build-auth
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: auth }
    container_name: sedoc-auth
    environment: *go-env
    ports: ["8081:8081", "9090:9090", "8180:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  policy:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: policy }
    container_name: sedoc-policy
    environment: *go-env
    ports: ["8082:8081", "9091:9090", "8181:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  document:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: document }
    container_name: sedoc-document
    environment: *go-env
    # Host health port 8084 instead of run-all-services.sh's 8083 to
    # avoid collision with the collaboration WS listener on 8083.
    ports: ["8084:8081", "9092:9090", "8182:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  storage:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: storage }
    container_name: sedoc-storage
    environment: *go-env
    ports: ["8085:8081", "9093:9090", "8183:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: search }
    container_name: sedoc-search
    environment: *go-env
    ports: ["8086:8081", "9094:9090", "8184:8080"]
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      nats:       { condition: service_healthy }
      opensearch: { condition: service_healthy }
    healthcheck: *go-healthcheck
    restart: unless-stopped

  audit:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: audit }
    container_name: sedoc-audit
    environment: *go-env
    ports: ["8087:8081", "9095:9090", "8185:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  workflow:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: workflow }
    container_name: sedoc-workflow
    environment: *go-env
    ports: ["8088:8081", "9096:9090", "8186:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck: *go-healthcheck
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: notification }
    container_name: sedoc-notification
    environment: *go-env
    ports: ["8089:8081", "9097:9090", "8187:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  signature:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: signature }
    container_name: sedoc-signature
    # ADR 0025 — server-seal: use the real DSS sidecar + reach the document
    # service's HTTP for the decrypt-stream fetch.
    environment:
      <<: *go-env
      SEDOC_SIGNER: "dss"
      SIGNER_ADDR: "signature-signer:6060"
      SEDOC_DOCUMENT_HTTP_URL: "http://document:8080"
    ports: ["8090:8081", "9098:9090", "8188:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  # JVM DSS PAdES sidecar (ADR 0025 / Wave 12.9b). Stateless — no DB/NATS, so
  # none of the go-* anchors apply. gRPC on 6060; the dev image bakes a
  # self-signed signing keystore (PAdES-B-B). Set SIGNER_TSA_URL to enable
  # B-T/LT/LTA; offline it downgrades to B-B. The Go signature service dials
  # it via SIGNER_ADDR once the embedding hand-off (qes.go) is wired.
  signature-signer:
    build:
      context: ./services/signature-signer
      dockerfile: Dockerfile
    container_name: sedoc-signature-signer
    image: sedoc-signature-signer:dev
    environment:
      SIGNER_TSA_URL: "${SIGNER_TSA_URL:-}"
    ports: ["6060:6060"]
    restart: unless-stopped

  billing:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: billing }
    container_name: sedoc-billing
    environment: *go-env
    ports: ["8091:8081", "9099:9090", "8189:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  connector:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: connector }
    container_name: sedoc-connector
    environment:
      # On-prem: allow outbound webhooks to plain-http / private-IP
      # receivers (e.g. an internal ERP on the LAN). Waives the https +
      # public-IP SSRF guard in connector ValidateURL; HMAC signing still
      # authenticates every delivery. Leave unset (public-SaaS default)
      # to enforce https + public IPs.
      <<: *go-env
      SEDOC_WEBHOOK_ALLOW_PRIVATE: "true"
    ports: ["8092:8081", "9100:9090", "8190:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped
    # ADR 0088 — watched-folder intake. Admin configures per-tenant
    # subdirs under /data/intake; in prod this would be an SMB / NFS
    # PVC mounted in. In dev we use a named volume so files persist
    # across container rebuilds.
    volumes:
      - intake_data:/data/intake

  # ADR 0091 — MCP server (Model Context Protocol) for LLM agents.
  # Exposes search_documents / get_document / upload_document /
  # start_workflow tools to Claude Desktop, Cursor, GitHub Copilot.
  # API-key authenticated with mcp:read / mcp:write scopes.
  mcp-server:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: mcp-server }
    container_name: sedoc-mcp-server
    environment: *go-env
    ports: ["8094:8081", "8192:8080"]
    depends_on: *go-depends
    healthcheck: *go-healthcheck
    restart: unless-stopped

  # ADR 0074 — GraphQL read gateway. HTTP-only public surface; talks
  # gRPC to document/workflow/collaboration/policy/audit upstream.
  graphql-gateway:
    build:
      context: .
      dockerfile: build/Dockerfile.go-service
      args: { SERVICE: graphql-gateway }
    container_name: sedoc-graphql-gateway
    environment: *go-env
    # 8093 = health, 8191 = http /graphql; no gRPC port (read-only HTTP).
    ports: ["8093:8081", "8191:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck: *go-healthcheck
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
  natsdata:
  qdrantdata:
  clamdata:
  slapddata:
  intake_data:
