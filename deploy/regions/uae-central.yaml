# ============================================================================
# SeDoc — UAE residency overlay (ADR 0110)
# ============================================================================
#
# Apply on TOP of deploy/helm/sedoc/values.yaml:
#
#   helm upgrade --install sedoc ./deploy/helm/sedoc \
#     --namespace vaultdms --create-namespace \
#     --values ./deploy/helm/sedoc/values.yaml \
#     --values ./deploy/regions/uae-central.yaml \
#     --wait --timeout 20m
#
# Hard guarantees this overlay enforces:
#
#   * All AWS-backed resources (S3, RDS, OpenSearch, KMS) are
#     pinned to me-central-1.
#   * Every service runs with SEDOC_REGION=me-central-1 (the region the
#     code enforces: storage writes only dms-me-central-1-* buckets, new
#     documents are pinned there, billing's residency guard compares
#     against it) and SEDOC_REGION_ID=uae-central (the logical label in
#     /healthz and the residency admin page).
#   * Egress NetworkPolicy denies outbound traffic except in-namespace
#     pods, the cluster DNS and me-central-1 AWS endpoints (FQDN rules
#     need Cilium; on another CNI replace them with ipBlock rules for the
#     published me-central-1 ranges).
#
# O-9: every key below is one the chart reads (values.yaml) — the previous
# overlay used keys the chart ignored (per-service env lists under
# `services:`, global.networkPolicy, global.kms, tenant.*).
#
# What this overlay does NOT do (operator responsibility):
#
#   * Create the AWS account + region quotas + IAM roles. See
#     docs/deploy/uae-residency.md §1.
#   * Provision the KMS keys with no cross-region grants. The
#     overlay references key ARNs; their creation is one-off.
#   * Sign CBUAE compliance attestations. The overlay's encryption
#     posture (AES-256-GCM at rest, TLS 1.3 in transit, envelope
#     encryption per blob via per-tenant KEK) matches CBUAE
#     guidance but isn't a substitute for the auditor sign-off.

global:
  # SEDOC_REGION_ID — logical residency label (NOT an AWS region, so a
  # later Bahrain failover does not rewrite tenant rows).
  region: uae-central

  # The buyer-facing brand domain (Ingress host, public URL, collaboration
  # allowed origin).
  domain: vaultdms.ae

  # S3 — me-central-1. s3.region is also SEDOC_REGION / SEDOC_S3_REGION.
  s3:
    endpoint: "https://s3.me-central-1.amazonaws.com"
    region: me-central-1
    accessKeySecret: vaultdms-s3-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    useSSL: true
    buckets:
      hot:        dms-me-central-1-hot
      warm:       dms-me-central-1-warm
      previews:   dms-me-central-1-previews
      quarantine: dms-me-central-1-quarantine
    # Bucket properties (block public access, NO cross-region replication,
    # object lock) are set by the bucket-creation Terraform — see
    # docs/deploy/uae-residency.md.

  # RDS / Aurora — me-central-1 writer endpoint; never a cross-region
  # replica. verify-full so a misrouted DNS record cannot land us on a
  # non-UAE cluster. Services connect as dms_app (DEC-1); migrations as
  # the master user.
  database:
    host: vaultdms-aurora.cluster-XXX.me-central-1.rds.amazonaws.com
    port: 5432
    name: vaultdms
    sslMode: verify-full
    username: dms_app
    existingSecret: vaultdms-db-credentials
    passwordKey: dms-app-password
    migration:
      username: vaultdms_master
      existingSecret: vaultdms-db-credentials
      passwordKey: master-password

  # OpenSearch — me-central-1 VPC domain, no cross-cluster replication.
  openSearchURL: "https://vpc-vaultdms-XXX.me-central-1.es.amazonaws.com:443"

  # NATS / Temporal / Redis — operator-managed in the same VPC + AZs.
  nats:
    host: nats.vaultdms-uae.svc.cluster.local
    port: 4222
  redis:
    host: redis.vaultdms-uae.svc.cluster.local
    port: 6379
    existingSecret: vaultdms-redis-credentials
  temporalAddr: "temporal-frontend.vaultdms-uae.svc.cluster.local:7233"

  # KMS: the storage service supports only the local KEK today
  # (global.encryption, Secret sedoc-encryption/local-kek). Keep the KEK
  # material itself in me-central-1 (Secrets Manager via
  # externalSecrets); the AWS KMS aliases (alias/vaultdms-uae-central-kek)
  # apply once the KMS key manager is wired.

  # ADR 0110 — egress lockdown.
  networkPolicy:
    egress:
      enabled: true
      allowInNamespace: true
      allowDNS: true
      # Customer IdP / SMTP endpoints are allow-listed per tenant by
      # separate NetworkPolicies; add shared ones here as NetworkPolicy
      # egress rules (to/ports).
      rules: []
      fqdns:
        - "*.me-central-1.amazonaws.com"
        - "*.me-central-1.es.amazonaws.com"
        - "*.me-central-1.rds.amazonaws.com"

# Managed services replace the bundled data stores.
postgresql:
  enabled: false
opensearch:
  enabled: false
redis:
  enabled: false
nats:
  enabled: false

# Per-service env (maps, as the chart reads them). The region itself comes
# from global.* above; these add the AWS SDK region for the services that
# build S3 clients, so a stale role ARN cannot write outside me-central-1.
document:
  env:
    AWS_REGION: me-central-1
storage:
  env:
    AWS_REGION: me-central-1
signature:
  env:
    AWS_REGION: me-central-1
