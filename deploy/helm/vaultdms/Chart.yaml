apiVersion: v2
name: vaultdms
description: SeDoc — Enterprise Document Management System
type: application
version: 1.0.0
appVersion: "1.0.0"
maintainers:
  - name: SeDoc Team
    email: sulthansha@raabyt.com

dependencies:
  # Bitnami StatefulSet-backed Postgres (default). Suitable for
  # single-AZ dev/staging.
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  # CloudNativePG operator path (ADR 0092, opt-in). Renders a Cluster
  # CRD instead of a StatefulSet — streaming replication, automated
  # failover, WAL archiving, PITR. The operator's CRDs MUST be
  # pre-installed in the cluster; the chart only renders the
  # Cluster custom resource.
  - name: cloudnative-pg
    version: "0.x.x"
    repository: https://cloudnative-pg.github.io/charts
    condition: postgresql.useOperator
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: opensearch
    version: "2.x.x"
    repository: https://opensearch-project.github.io/helm-charts
    condition: opensearch.enabled
  - name: nats
    version: "1.x.x"
    repository: https://nats-io.github.io/k8s/helm/charts
    condition: nats.enabled
  - name: qdrant
    version: "0.x.x"
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled
  - name: temporal
    version: "0.x.x"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
