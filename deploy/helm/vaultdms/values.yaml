# ADR 0074 — GraphQL read gateway. HTTP-only public surface; calls
# document/workflow/collaboration/policy/audit over gRPC.
graphql-gateway:
  enabled: true
  replicas: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/graphql-gateway"
    tag: "{{ .Values.global.imageTag }}"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
  env:
    WORKFLOW_SERVICE_ADDR: "workflow:9090"
    COLLABORATION_SERVICE_ADDR: "collaboration:9090"
    AUDIT_SERVICE_ADDR: "audit:9090"
  httpPort: 8080
  healthPort: 8081

# ADR 0091 — MCP server for LLM agents (Claude Desktop, Cursor,
# GitHub Copilot). Exposes search/get/upload/start_workflow tools
# behind API-key auth with mcp:read / mcp:write scopes. The service
# is stateless; tools dispatch to search/document/workflow services
# over HTTP. No grpcPort — the only contract is HTTP+SSE.
mcpServer:
  enabled: true
  replicas: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/mcp-server"
    tag: "{{ .Values.global.imageTag }}"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  env:
    SEARCH_BASE_URL:       "http://search:8080"
    DOCUMENT_BASE_URL:     "http://document:8080"
    WORKFLOW_BASE_URL:     "http://workflow:8080"
    INTELLIGENCE_BASE_URL: "http://intelligence:8080"
  httpPort: 8080
  healthPort: 8081

intelligence:
  enabled: true
  replicas: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/intelligence"
    tag: "{{ .Values.global.imageTag }}"
  resources:
    requests: { cpu: 500m, memory: "1Gi" }
    limits:   { cpu: "2", memory: "4Gi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
  env:
    VAULTDMS_DEFAULT_LLM_MODEL: gpt-4o-mini
  celery:
    replicas: 2
    queues: intelligence,intelligence-ocr,intelligence-embed,intelligence-rag
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  apiPort: 8080

preview:
  enabled: true
  replicas: 1
  image:
