# ============================================================================
# VaultDMS Helm Chart — Default Values
# ============================================================================

global:
  imageRegistry: ghcr.io/vaultdms
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  storageClass: ""
  tenantIsolation: shared  # shared | schema | database

  # PodSecurityStandards enforcement (ADR 0092). The chart's
  # goServiceDeployment macro always sets a restricted-compatible
  # securityContext; the labels here are what tell the K8s admission
  # controller to enforce it. Default leaves namespace management to
  # the operator (createNamespace=false) but documents the labels
  # that MUST be applied externally.
  podSecurity:
    createNamespace: false
    profile: restricted  # restricted | baseline | privileged

  domain: vaultdms.example.com
  tlsSecretName: vaultdms-tls

  s3:
    endpoint: "https://s3.us-east-1.amazonaws.com"
    region: us-east-1
    accessKeySecret: vaultdms-s3-credentials   # Secret name
    accessKeyKey: access-key
    secretKeyKey: secret-key
    useSSL: true
    buckets:
      hot: dms-us-east-1-hot
      warm: dms-us-east-1-warm
      previews: dms-us-east-1-previews
      quarantine: dms-quarantine

  database:
    host: ""           # set by subchart or external
    port: 5432
    name: vaultdms
    username: vaultdms
    existingSecret: vaultdms-db-credentials
    passwordKey: password

  redis:
    host: ""
    port: 6379
    existingSecret: ""
    passwordKey: password

  nats:
    url: "nats://vaultdms-nats:4222"

  opensearch:
    url: "http://vaultdms-opensearch:9200"
    username: ""
    password: ""

  qdrant:
    url: "http://vaultdms-qdrant:6333"

  temporal:
    address: "vaultdms-temporal-frontend:7233"

  encryption:
    kmsProvider: local   # local | vault | aws
    localKEK: ""         # base64 32-byte AES key
    existingSecret: vaultdms-encryption

  # Externally reachable base URL of the platform. Used by auth SSO
  # redirect URLs and document share links. Set explicitly in prod.
  publicURL: "https://{{ .Values.global.domain }}"

  # Optional override for S3 endpoint host in presigned URLs.
  s3PublicBase: ""

  # gRPC address of the policy service used by document + storage.
  policyServiceAddr: "vaultdms-policy:9090"

  # Temporal + ClamAV + OpenSearch addresses (no change; re-documented
  # here for discoverability).
  clamAVAddr: "vaultdms-clamav:3310"
  temporalAddr: "vaultdms-temporal-frontend:7233"
  openSearchURL: "http://vaultdms-opensearch:9200"

  # Billing secrets (set via Kubernetes Secrets, never hardcoded).
  # Both secrets must exist with keys `api-key` and `webhook-secret`.
  billing:
    existingSecret: vaultdms-billing-secrets
    internalAPIKeyKey: api-key
    stripeWebhookSecretKey: webhook-secret

# ============================================================================
# External Secrets Operator (ADR 0092)
# ============================================================================
# When enabled, ExternalSecret resources sync sensitive values from an
# upstream SecretStore (Vault, AWS Secrets Manager, GCP Secret Manager)
# into K8s Secret objects the application pods mount. Disable this and
# the chart still works against operator-provisioned Secret resources
# with the same names — application pods don't know the difference.

externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore       # or SecretStore
    name: vaultdms-vault
  secrets:
    vaultdms-platform-secrets:
      data:
        - secretKey: VAULTDMS_LOCAL_KEK
          remoteKey: secret/data/vaultdms/local-kek
          property: value
        - secretKey: VAULTDMS_GATEWAY_SECRET
          remoteKey: secret/data/vaultdms/gateway-secret
          property: value
        - secretKey: VAULTDMS_INTERNAL_API_KEY
          remoteKey: secret/data/vaultdms/internal-api-key
          property: value
    vaultdms-esign-secrets:
      data:
        - secretKey: VAULTDMS_ESIGN_STATE_HMAC
          remoteKey: secret/data/vaultdms/esign-state-hmac
          property: value
        - secretKey: VAULTDMS_ESIGN_DOCUSIGN_CLIENT_SECRET
          remoteKey: secret/data/vaultdms/esign-docusign-client-secret
          property: value
    vaultdms-twilio-secrets:
      data:
        - secretKey: VAULTDMS_TWILIO_AUTH_TOKEN
          remoteKey: secret/data/vaultdms/twilio-auth-token
          property: value
    vaultdms-stripe-secrets:
      data:
        - secretKey: STRIPE_WEBHOOK_SECRET
          remoteKey: secret/data/vaultdms/stripe-webhook-secret
          property: value

# ============================================================================
# Services
# ============================================================================

document:
  enabled: true
  replicas: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/document"
    tag: "{{ .Values.global.imageTag }}"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
  env: {}
  grpcPort: 9090
  httpPort: 8080
  healthPort: 8081

# §3.1 / B1 — Kong API gateway (DBless). ONLY ingress; backend
# services are ClusterIP-only from B2 onwards.
gateway:
  enabled: true
  replicaCount: 1
  image: kong:3.5-ubuntu
  service:
    type: ClusterIP       # cloud: LoadBalancer; on-prem: NodePort
    proxyPort: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 1000m, memory: 512Mi }
  # §3.1 / B2.2 — shared secret for the gateway-signature header.
  # Operator creates the Secret out of band (`kubectl create secret
  # generic vaultdms-gateway --from-literal=shared-secret=$(openssl
  # rand -base64 48)`). The same Secret is mounted into every backend
  # Deployment as env VAULTDMS_GATEWAY_SECRET so that
  # pkg/middleware.RequireGatewaySignature accepts the traffic.
  secret:
    name: vaultdms-gateway
    sharedSecretKey: shared-secret

auth:
  enabled: true
  replicas: 2
  image:
    repository: "{{ .Values.global.imageRegistry }}/auth"
    tag: "{{ .Values.global.imageTag }}"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
  env: {}
  grpcPort: 9090
  httpPort: 8080
  healthPort: 8081

policy:
