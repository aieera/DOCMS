# ============================================================================
# Ingress
# ============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: vaultdms-collaboration
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: "{{ .Values.global.tlsSecretName }}"
      hosts:
        - "{{ .Values.global.domain }}"

# ============================================================================
# Subcharts
# ============================================================================

postgresql:
  # Bitnami StatefulSet (default). Suitable for single-AZ deploys.
  enabled: true
  auth:
    database: vaultdms
    username: vaultdms
    existingSecret: vaultdms-db-credentials
  primary:
    persistence:
      size: 50Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: "2", memory: "4Gi" }
  # CloudNativePG operator path (ADR 0092, opt-in). When useOperator
  # is true, the chart renders a postgresql.cnpg.io/v1 Cluster CRD
  # (templates/postgres-cluster.yaml) instead of relying on Bitnami.
  # The operator's own CRDs MUST be pre-installed:
  #   helm install cnpg cloudnative-pg/cloudnative-pg \
  #     --namespace cnpg-system --create-namespace
  # Migrating from Bitnami requires a pg_dump → restore step before
  # disabling the Bitnami subchart. See docs/runbooks/helm-install.md.
  useOperator: false
  operator:
    instances: 3                 # primary + 2 hot replicas
    image: ghcr.io/cloudnative-pg/postgresql:16.4
    maxConnections: 200
    sharedBuffers: 512MB
    storageSize: 100Gi
    credentialsSecret: vaultdms-postgres-credentials
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: "2", memory: 4Gi }
    backup:
      destinationPath: "s3://vaultdms-postgres-backups/{{ .Release.Name }}"
      credentialsSecret: vaultdms-postgres-backup-credentials
      retentionPolicy: "30d"

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 5Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

opensearch:
  enabled: true
  singleNode: true
  resources:
    requests: { cpu: 500m, memory: "1Gi" }
    limits:   { cpu: "2", memory: "4Gi" }
  persistence:
    size: 50Gi

nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi

qdrant:
  enabled: true
  persistence:
    size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1", memory: "2Gi" }

temporal:
  enabled: true
  server:
    resources:
      requests: { cpu: 100m, memory: 128Mi }

# ============================================================================
# Backup
# ============================================================================

backup:
  enabled: true
  schedule: "0 2 * * *"   # daily at 2am
  s3Bucket: vaultdms-backups
  retention: 30            # days
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
