{{- if .Values.intelligence.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vaultdms-intelligence-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligence-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
