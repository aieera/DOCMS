{{- if .Values.intelligence.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultdms-intelligence-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelligence-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.intelligence.apiPort | default 8080 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultdms-intelligence-worker
spec:
  # Workers have no ingress — they pull from Redis + NATS only.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelligence-worker
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
