apiVersion: batch/v1
kind: Job
metadata:
  name: vaultdms-seed
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: {{ .Values.global.imageRegistry }}/document:{{ .Values.global.imageTag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Creating default admin user and S3 buckets..."
              # Create default admin — the auth service seed endpoint
              curl -sf -X POST http://vaultdms-auth:8080/api/v1/auth/register \
                -H 'Content-Type: application/json' \
                -d '{"email":"admin@vaultdms.local","password":"ChangeMe123!","display_name":"Admin"}' || true
              # S3 buckets are pre-created via IAM/Terraform — no minio-init needed.
              echo "Seed complete."
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.existingSecret }}
                  key: {{ .Values.global.database.passwordKey }}
