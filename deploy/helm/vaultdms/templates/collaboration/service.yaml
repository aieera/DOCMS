{{- if .Values.collaboration.enabled }}
{{- /*
Collaboration exposes a single ws port for the authenticated
`/ws` endpoint + the `/yjs/...` sub-path. Node service has no gRPC
side, so only the WS port is wired. Health port is separate so
readiness probes don't spam the WS upgrade path.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: vaultdms-collaboration
  labels:
    {{- include "vaultdms.labels" (dict "name" "collaboration" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vaultdms.selectorLabels" (dict "name" "collaboration" "Release" .Release) | nindent 4 }}
  ports:
    - name: ws
      port: {{ .Values.collaboration.wsPort | default 8083 }}
      targetPort: ws
    - name: health
      port: {{ .Values.collaboration.healthPort | default 8081 }}
      targetPort: health
{{- end }}
