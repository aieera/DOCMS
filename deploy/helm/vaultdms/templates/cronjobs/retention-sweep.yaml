{{- /*
§9.4 / G5 — daily retention sweep. CronJob iterates every active
tenant and POSTs to document service's internal sweep endpoint.
Archive / dispose decisions go through UpdateLifecycle so legal
holds still win and audit events fire normally.
*/ -}}
{{- if .Values.retentionSweep.enabled | default true }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultdms-retention-sweep
spec:
  schedule: {{ .Values.retentionSweep.schedule | default "0 2 * * *" | quote }}  # 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: curlimages/curl:8.6.0
              env:
                - name: DOC_URL
                  value: "http://vaultdms-document:{{ .Values.document.healthPort | default 8081 }}"
                - name: INTERNAL_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.billing.existingSecret | default "vaultdms-billing-secrets" }}
                      key: {{ .Values.global.billing.internalAPIKeyKey | default "api-key" }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "$(date -Iseconds) retention-sweep starting"
                  {{- range .Values.retentionSweep.tenantIds | default (list) }}
                  echo "sweeping tenant {{ . }}"
                  STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
                    -X POST "$DOC_URL/internal/v1/retention/sweep" \
                    -H "Authorization: Bearer $INTERNAL_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d '{"tenant_id":"{{ . }}","batch_size":500}')
                  if [ "$STATUS" != "200" ]; then
                    echo "retention-sweep HTTP $STATUS for {{ . }}"
                    cat /tmp/body
                    exit 1
                  fi
                  cat /tmp/body
                  echo
                  {{- end }}
                  echo "$(date -Iseconds) retention-sweep complete"
{{- end }}
