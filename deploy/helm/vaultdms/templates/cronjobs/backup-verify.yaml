{{- /*
FIX-8 (audit Section 12) — weekly automated restore verification.

The pg_dump CronJob in backup.yaml produces a daily snapshot, but
before this template there was NO automated proof the dump was
restorable. Audit-grade DR requires that backups are not just
produced but periodically RESTORED into a scratch environment with
sanity checks — otherwise corrupt dumps surface only at recovery
time, when it's too late.

This CronJob:
  1. lists s3://{backup.s3Bucket} and picks the lexicographically
     newest object (the daily backup names are vaultdms-YYYYMMDD-
     HHMMSS.sql.gz so lex-sort == time-sort);
  2. downloads it locally;
  3. spins up a transient postgres in the same pod (sidecar pattern
     would also work; single-pod keeps the manifest small);
  4. pg_restore (or `gunzip | psql`) into a scratch DB;
  5. SELECTs row counts on the canonical tables (documents,
     document_versions, audit_events). Each must be >= the
     configured minRowCount; otherwise the Job fails and oncall
     pages.

Pairs with the existing audit-verify.yaml + soc2-evidence.yaml so
the compliance review cycle has restore proof on file.
*/ -}}
{{- if and .Values.backup.enabled .Values.backup.verify.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultdms-backup-verify
spec:
  schedule: {{ .Values.backup.verify.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  apk add --no-cache aws-cli >/dev/null 2>&1 || true
                  echo "Locating latest backup..."
                  LATEST=$(aws s3 ls s3://{{ .Values.backup.s3Bucket }}/ \
                      --endpoint-url {{ .Values.global.s3.endpoint }} \
                    | sort | awk '{print $4}' | tail -1)
                  if [ -z "$LATEST" ]; then
                    echo "FAIL: no backups in s3://{{ .Values.backup.s3Bucket }}/"
                    exit 1
                  fi
                  echo "Latest backup: $LATEST"
                  aws s3 cp "s3://{{ .Values.backup.s3Bucket }}/$LATEST" /tmp/backup.sql.gz \
                    --endpoint-url {{ .Values.global.s3.endpoint }}

                  # Start a transient local postgres for the restore.
                  # Single-pod is intentional — keeps the CronJob
                  # self-contained, no Service or Secret dance.
                  initdb -D /tmp/pgdata -U postgres -A trust >/dev/null
                  pg_ctl -D /tmp/pgdata -o "-p 55432" -l /tmp/pglog start >/dev/null
                  createdb -h localhost -p 55432 -U postgres scratch

                  echo "Restoring into scratch DB..."
                  gunzip -c /tmp/backup.sql.gz | psql -h localhost -p 55432 -U postgres -d scratch -q >/tmp/restore.log 2>&1 || {
                    echo "FAIL: restore errors"
                    tail -20 /tmp/restore.log
                    exit 1
                  }

                  fail=0
                  for pair in \
                    "documents={{ .Values.backup.verify.minRowCount.documents }}" \
                    "document_versions={{ .Values.backup.verify.minRowCount.document_versions }}" \
                    "audit_events={{ .Values.backup.verify.minRowCount.audit_events }}"; do
                    table=$(echo $pair | cut -d= -f1)
                    minc=$(echo $pair | cut -d= -f2)
                    n=$(psql -h localhost -p 55432 -U postgres -d scratch -tAc "SELECT count(*) FROM $table" || echo 0)
                    if [ "$n" -lt "$minc" ]; then
                      echo "FAIL: $table has $n rows, minimum is $minc"
                      fail=1
                    else
                      echo "OK:   $table has $n rows"
                    fi
                  done
                  pg_ctl -D /tmp/pgdata stop >/dev/null
                  if [ "$fail" = "1" ]; then
                    exit 1
                  fi
                  echo "Restore verification passed."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.s3.accessKeySecret }}
                      key: {{ .Values.global.s3.accessKeyKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.s3.accessKeySecret }}
                      key: {{ .Values.global.s3.secretKeyKey }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.global.s3.region }}
                - name: PGDATA
                  value: /tmp/pgdata
              resources:
                requests: { cpu: 200m, memory: 512Mi }
                limits:   { cpu: 1000m, memory: 1Gi }
{{- end }}
