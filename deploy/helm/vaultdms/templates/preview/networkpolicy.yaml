{{- if .Values.preview.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultdms-preview-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preview-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.preview.apiPort | default 8080 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultdms-preview-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preview-worker
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
