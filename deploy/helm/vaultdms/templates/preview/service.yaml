{{- if .Values.preview.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vaultdms-preview
  labels: { app.kubernetes.io/name: preview-api }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: preview-api }
  ports:
    - name: http
      port: {{ .Values.preview.apiPort | default 8080 }}
      targetPort: http
{{- end }}
