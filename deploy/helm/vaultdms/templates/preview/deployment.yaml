{{- if .Values.preview.enabled }}
---
# API server (optional — only consumed by preview/generate REST calls)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultdms-preview-api
  labels: { app.kubernetes.io/name: preview-api, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.preview.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: preview-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: preview-api }
    spec:
      containers:
        - name: api
          image: {{ .Values.global.imageRegistry }}/preview:{{ .Values.global.imageTag }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: {{ .Values.preview.apiPort | default 8080 }}
          env:
            {{- include "vaultdms.commonEnv" (dict "Values" .Values) | nindent 12 }}
            - name: VAULTDMS_CELERY_BROKER_URL
              value: "redis://{{ .Values.global.redis.host }}:{{ .Values.global.redis.port }}/2"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.preview.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, runAsUser: 1000 }
---
# Celery workers — poppler + libreoffice + ffmpeg heavy. Separate
# deployment so it can scale independently of the API tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultdms-preview-worker
  labels: { app.kubernetes.io/name: preview-worker, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.preview.celery.replicas | default 2 }}
  selector:
    matchLabels: { app.kubernetes.io/name: preview-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: preview-worker }
    spec:
      containers:
        - name: worker
          image: {{ .Values.global.imageRegistry }}/preview:{{ .Values.global.imageTag }}
          command:
            - celery
            - "-A"
            - app.worker
            - worker
            - "--loglevel=info"
            - "-Q"
            - {{ .Values.preview.celery.queues | default "preview" | quote }}
          env:
            {{- include "vaultdms.commonEnv" (dict "Values" .Values) | nindent 12 }}
            - name: VAULTDMS_CELERY_BROKER_URL
              value: "redis://{{ .Values.global.redis.host }}:{{ .Values.global.redis.port }}/2"
          resources:
            {{- toYaml .Values.preview.celery.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, runAsUser: 1000 }
{{- end }}
