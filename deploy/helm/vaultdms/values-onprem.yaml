# On-premises deployment overrides.
# Uses S3-compatible storage (e.g. Dell ECS, Ceph), local SMTP, no telemetry.

global:
  s3:
    endpoint: "https://s3.internal.corp:9000"
    region: on-prem
    useSSL: true
    buckets:
      hot: dms-onprem-hot
      warm: dms-onprem-warm
      previews: dms-onprem-previews
      quarantine: dms-quarantine

  encryption:
    kmsProvider: vault
    # Vault address configured via external Secret

  # On-prem service-to-service addresses (internal DNS).
  publicURL: "https://dms.internal.corp"
  policyServiceAddr: "vaultdms-policy.vaultdms.svc.cluster.local:9090"
  clamAVAddr: "vaultdms-clamav.vaultdms.svc.cluster.local:3310"
  temporalAddr: "vaultdms-temporal-frontend.vaultdms.svc.cluster.local:7233"
  openSearchURL: "http://vaultdms-opensearch.vaultdms.svc.cluster.local:9200"
  s3PublicBase: "https://s3.internal.corp"

  # Billing secrets still sourced from Kubernetes Secret.
  billing:
    existingSecret: vaultdms-billing-secrets-onprem
    internalAPIKeyKey: api-key
    stripeWebhookSecretKey: webhook-secret

intelligence:
  env:
    VAULTDMS_DEFAULT_LLM_MODEL: "ollama/llama3"
    VAULTDMS_LLM_BASE_URL: "http://ollama.internal:11434"
  celery:
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "8", memory: "16Gi" }

# Disable external telemetry
notification:
  env:
    VAULTDMS_SMTP_HOST: "smtp.internal.corp"
    VAULTDMS_SMTP_PORT: "25"
    VAULTDMS_SMTP_TLS: "false"

backup:
  s3Bucket: dms-onprem-backups
