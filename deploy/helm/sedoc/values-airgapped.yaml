# Air-gapped deployment overrides.
# All images from local registry, offline license, bundled OCR models,
# local vLLM for AI features.

global:
  imageRegistry: registry.internal.corp/vaultdms
  imagePullSecrets:
    - name: registry-credentials

  s3:
    endpoint: "https://s3.internal.corp:9000"
    region: airgap
    useSSL: true
    buckets:
      hot: dms-airgap-hot
      warm: dms-airgap-warm
      previews: dms-airgap-previews
      quarantine: dms-quarantine

  encryption:
    kmsProvider: local

# Override all subchart images to use local registry
postgresql:
  image:
    registry: registry.internal.corp
    repository: bitnami/postgresql

redis:
  image:
    registry: registry.internal.corp
    repository: bitnami/redis

opensearch:
  image:
    repository: registry.internal.corp/opensearchproject/opensearch

nats:
  container:
    image:
      repository: registry.internal.corp/nats
      tag: "2.10"

qdrant:
  image:
    repository: registry.internal.corp/qdrant/qdrant

intelligence:
  env:
    SEDOC_DEFAULT_LLM_MODEL: "openai/local-model"
    SEDOC_LLM_BASE_URL: "http://vllm.internal:8000/v1"
    SEDOC_EMBEDDING_MODEL: "/models/all-MiniLM-L6-v2"
    SEDOC_CLASSIFIER_MODEL: "/models/distilbert-base-uncased"
    SEDOC_RERANKER_MODEL: "/models/ms-marco-MiniLM-L-6-v2"
  celery:
    resources:
      requests: { cpu: "4", memory: "8Gi" }
      limits:   { cpu: "8", memory: "16Gi" }

preview:
  celery:
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "4", memory: "8Gi" }

auth:
  env:
    SEDOC_LICENSE_MODE: "offline"
    SEDOC_LICENSE_JWT_SECRET: ""  # set via external Secret

backup:
  s3Bucket: dms-airgap-backups
