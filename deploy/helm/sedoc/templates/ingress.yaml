{{- /*
C-1 — the Ingress routes to TWO backends only:
  /api, /yjs, /ws  -> the Kong gateway (identity-header strip, gateway
                      signature, body caps, rate limits)
  /                -> the static web app
It used to send /api/v1/* straight to backend pods, bypassing Kong: every
backend rejected the unsigned requests (fail-closed outage) and the storage
Service had no port 8080. tests/assert-ingress-backends.sh enforces this.
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $gateway := include "sedoc.gatewayServiceName" . }}
{{- $gwPort := .Values.gateway.service.proxyPort }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sedoc
  labels:
    {{- include "sedoc.labels" (dict "name" "ingress" "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.global.tlsSecretName }}
      hosts:
        - {{ .Values.global.domain }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          {{- range list "/api" "/yjs" "/ws" }}
          {{- if not (has . $.Values.ingress.longRunning.paths) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $gateway }}
                port: { number: {{ $gwPort }} }
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sedoc.webServiceName" . }}
                port: { number: {{ .Values.web.port }} }
{{- if .Values.ingress.longRunning.paths }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sedoc-long-running
  labels:
    {{- include "sedoc.labels" (dict "name" "ingress" "Release" .Release "Chart" .Chart) | nindent 4 }}
  {{- /* Same annotations, long timeouts win; cert-manager stays on the
         primary Ingress only (both share the TLS Secret). */}}
  {{- $ann := dict }}
  {{- range $k, $v := .Values.ingress.annotations }}
  {{- if not (hasPrefix "cert-manager.io/" $k) }}{{ $_ := set $ann $k $v }}{{ end }}
  {{- end }}
  annotations:
    {{- toYaml (merge (dict) .Values.ingress.longRunning.annotations $ann) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.global.tlsSecretName }}
      hosts:
        - {{ .Values.global.domain }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          {{- range .Values.ingress.longRunning.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $gateway }}
                port: { number: {{ $gwPort }} }
          {{- end }}
{{- end }}
{{- end }}
