{{- /*
External Secrets Operator wiring (ADR 0092).

Instead of expecting operators to `kubectl create secret` every
sensitive value manually, ESO synchronises secrets from an upstream
SecretStore (Vault / AWS Secrets Manager / GCP Secret Manager) into
plain Kubernetes Secret objects that the application pods mount as
env vars or files.

This is OFF by default — set externalSecrets.enabled=true and a
SecretStore reference to switch on. Without ESO, the chart still
works against operator-provisioned Secret resources with the same
names; the application pods don't know the difference.

The default refresh interval is 1 hour (matching how often we
expect upstream rotation events to surface). Per-secret overrides
go in values.yaml under externalSecrets.refreshInterval.

Each secret listed below maps to an env-var consumed by one or
more services. See pkg/config/config.go for the full set; this
template covers the ~10 most sensitive (KEK, gateway secret,
Twilio, DocuSign client secret, Stripe webhook signing key, SMTP
password, eSign state HMAC, internal API key). Tenant-scoped
credentials (per-tenant DocuSign / Twilio / SMTP in the
{esign,tenant_smtp,tenant_twilio}_configs tables) flow through
the DB, not Kubernetes Secrets.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.externalSecrets.secretStoreRef }}
{{- $refresh := .Values.externalSecrets.refreshInterval | default "1h" }}
{{- range $name, $cfg := .Values.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sedoc.labels" (dict "name" $name "Release" $.Release "Chart" $.Chart) | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: {{ $store.kind | default "ClusterSecretStore" }}
    name: {{ $store.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $cfg.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
