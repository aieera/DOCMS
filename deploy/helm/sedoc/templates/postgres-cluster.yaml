{{- /*
CloudNativePG opt-in (ADR 0092 — Postgres operator migration path).

When postgresql.useOperator=true the chart renders this Cluster
custom resource instead of relying on the Bitnami subchart's
StatefulSet. The CloudNativePG operator reconciles the Cluster spec
into a primary + N replicas with streaming replication, automated
failover, WAL archiving to S3, and point-in-time recovery.

REQUIRES the operator's CRDs to be pre-installed in the cluster.
Install separately:

    helm install cnpg cloudnative-pg/cloudnative-pg --namespace cnpg-system --create-namespace

Migration from Bitnami: see docs/runbooks/helm-install.md §"Postgres
operator migration". Cannot be a flip-the-flag operation — data must
be pg_dump'd from Bitnami → restored into the operator-managed
cluster before disabling the Bitnami StatefulSet.
*/ -}}
{{- if .Values.postgresql.useOperator }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "sedoc.labels" (dict "name" "postgres" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  instances: {{ .Values.postgresql.operator.instances | default 3 }}
  imageName: {{ .Values.postgresql.operator.image | default "ghcr.io/cloudnative-pg/postgresql:16.4" }}
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      max_connections: {{ .Values.postgresql.operator.maxConnections | default 200 | quote }}
      shared_buffers: {{ .Values.postgresql.operator.sharedBuffers | default "512MB" | quote }}
      # RLS-friendly defaults — SeDoc relies on row-level security,
      # so the app role MUST be NOBYPASSRLS (set by the post-init job
      # below, not here).
      log_min_duration_statement: "1000"
  bootstrap:
    initdb:
      database: vaultdms
      owner: vaultdms
      secret:
        # The application reads credentials from the K8s Secret named
        # below — set via ExternalSecrets (preferred) or kubectl create.
        name: {{ .Values.postgresql.operator.credentialsSecret | default "sedoc-postgres-credentials" }}
      postInitApplicationSQL:
        - "ALTER ROLE vaultdms NOBYPASSRLS;"
  {{- with .Values.postgresql.operator.backup }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .destinationPath | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .credentialsSecret | default "sedoc-postgres-backup-credentials" }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .credentialsSecret | default "sedoc-postgres-backup-credentials" }}
          key: SECRET_ACCESS_KEY
    retentionPolicy: {{ .retentionPolicy | default "30d" | quote }}
  {{- end }}
  storage:
    size: {{ .Values.postgresql.operator.storageSize | default "100Gi" }}
    {{- if .Values.global.storageClass }}
    storageClass: {{ .Values.global.storageClass }}
    {{- end }}
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: {{ .Values.postgresql.operator.resources.requests.memory | default "1Gi" }}
      cpu: {{ .Values.postgresql.operator.resources.requests.cpu | default "500m" }}
    limits:
      memory: {{ .Values.postgresql.operator.resources.limits.memory | default "4Gi" }}
      cpu: {{ .Values.postgresql.operator.resources.limits.cpu | default "2" }}
{{- end }}
