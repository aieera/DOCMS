{{- /*
H-18 — schema migrations. Replaces the old pre-install hook that ran
`/app --migrate-only || true` (implemented by no service, failure ignored)
and the post-install seed that registered admin@vaultdms.local /
ChangeMe123!.

Image: ghcr.io/aieera/sedoc/migrate (build/Dockerfile.migrate) =
golang-migrate + psql + every service's track + scripts/migrate-all.sh, the
same ordered, per-bookkeeping-table sequence as `make migrate` and
install.sh. SEDOC_DB_BOOTSTRAP_ROLES=1 first creates dms_app / dms_readonly
(NOLOGIN, NOBYPASSRLS), gives dms_app LOGIN with the password from the DB
secret (O-6, DEC-1) and sets the default privileges later tables rely on.

Install vs upgrade:
  * helm install  — a plain Job. Pre-install hooks run before the bundled
    Postgres exists, so a hook could never connect. The app pods start in
    parallel and restart until the schema is there.
  * helm upgrade  — a pre-upgrade hook: the schema moves BEFORE any new
    binary rolls out (e.g. document 000107 must precede the storage binary).
The name carries the release revision so each run is a fresh Job.
*/ -}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: sedoc-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sedoc.labels" (dict "name" "migrate" "Release" .Release "Chart" .Chart) | nindent 4 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "sedoc.selectorLabels" (dict "name" "migrate" "Release" .Release) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.global.imageRegistry }}/migrate:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              deadline=$(( $(date +%s) + {{ .Values.migrations.waitForDatabaseSeconds }} ))
              until pg_isready -q -d "$DATABASE_URL"; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "database not reachable after {{ .Values.migrations.waitForDatabaseSeconds }}s" >&2
                  exit 1
                fi
                sleep 5
              done
              exec /opt/sedoc/scripts/migrate-all.sh
          env:
            # Password via PGPASSWORD (psql and lib/pq both read it), so the
            # URL needs no escaping and never carries the secret.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.migration.existingSecret }}
                  key: {{ .Values.global.database.migration.passwordKey }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.global.database.migration.username }}@{{ include "sedoc.dbHost" . }}:{{ .Values.global.database.port }}/{{ .Values.global.database.name }}?sslmode={{ .Values.global.database.sslMode }}"
            - name: SEDOC_DB_BOOTSTRAP_ROLES
              value: "1"
            - name: DMS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.existingSecret }}
                  key: {{ .Values.global.database.passwordKey }}
            {{- if .Values.soc2Evidence.enabled }}
            - name: DMS_EVIDENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.evidence.existingSecret }}
                  key: {{ .Values.global.database.evidence.passwordKey }}
            {{- end }}
            {{- if .Values.backup.enabled }}
            - name: DMS_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.database.backup.existingSecret }}
                  key: {{ .Values.global.database.backup.passwordKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "sedoc.restrictedSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
