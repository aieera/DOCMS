{{- /*
§3.1 / B1 — Kong DBless gateway Deployment: the only backend the Ingress
routes /api, /yjs and /ws to (C-1). Runs deploy/gateway/entrypoint.sh (from
the ConfigMap), which substitutes the gateway secret into the declarative
config and starts Kong — the stock entrypoint never did, so every forwarded
request carried the literal ${SEDOC_GATEWAY_SECRET} and every backend
rejected it.
*/ -}}
{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sedoc.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ include "sedoc.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sedoc.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sedoc.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        # Force pod restart on declarative-config change.
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "/kong/declarative/entrypoint.sh"]
          env:
            - { name: KONG_DATABASE,           value: "off" }
            # Read-only root filesystem: Kong's runtime prefix and the
            # entrypoint's resolved config live on emptyDirs.
            - { name: KONG_PREFIX,             value: "/kong_prefix" }
            - { name: KONG_DECLARATIVE_CONFIG, value: "/kong/declarative/kong.yaml" }
            - { name: KONG_PROXY_ACCESS_LOG,   value: "/dev/stdout" }
            - { name: KONG_ADMIN_ACCESS_LOG,   value: "/dev/stdout" }
            - { name: KONG_PROXY_ERROR_LOG,    value: "/dev/stderr" }
            - { name: KONG_ADMIN_ERROR_LOG,    value: "/dev/stderr" }
            # Admin API on loopback only — production operators port-forward
            # to reach it; it must never be network-reachable.
            - { name: KONG_ADMIN_LISTEN,  value: "127.0.0.1:8001" }
            - { name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100" }
            - { name: KONG_PROXY_LISTEN,  value: "0.0.0.0:8080" }
            # DEC-5 — honour X-Forwarded-For only from the ingress
            # controller / load balancer; Kong appends its peer when it
            # forwards, and the backends resolve the client against
            # SEDOC_TRUSTED_PROXIES.
            - { name: KONG_TRUSTED_IPS,       value: {{ .Values.gateway.trustedIPs | quote }} }
            - { name: KONG_REAL_IP_HEADER,    value: "X-Forwarded-For" }
            - { name: KONG_REAL_IP_RECURSIVE, value: "on" }
            # §3.1 / B2.2 — gateway-signature shared secret. Sourced
            # from the sedoc-gateway Secret; MUST match the value
            # wired into every backend Deployment as the same env var.
            - name: SEDOC_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secret.name }}
                  key:  {{ .Values.gateway.secret.sharedSecretKey }}
          ports:
            - { name: proxy,   containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 8100, protocol: TCP }
          livenessProbe:
            httpGet: { path: /status, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /status, port: metrics }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /kong/declarative
              readOnly: true
            - name: prefix
              mountPath: /kong_prefix
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          # R-15 — restricted profile; the kong image's user is uid 1000.
          securityContext:
            {{- include "sedoc.restrictedSecurityContext" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sedoc.fullname" . }}-gateway
        - name: prefix
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
