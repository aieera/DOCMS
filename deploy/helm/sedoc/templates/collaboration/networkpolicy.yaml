{{- if .Values.collaboration.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sedoc-collaboration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: collaboration
  policyTypes:
    - Ingress
  ingress:
    # Ingress controller → WebSocket port; same-release pods may also
    # reach this service (auth service validates session cookies on
    # the upgrade handshake).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.collaboration.wsPort }}
{{- end }}
