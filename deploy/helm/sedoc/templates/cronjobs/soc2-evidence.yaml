{{- /*
§9.6 / H1 — nightly SOC 2 evidence bundle.

H-19: the script ships IN the chart (files/soc2-evidence.sh, a link to
scripts/soc2-evidence.sh) as a ConfigMap and runs from the mount. It used
to be wget'ed from GitHub `main` at run time and executed with the database
credentials and the evidence signing key — anyone who could change `main`
(or the network path) ran code with both. A ConfigMap checksum annotation
makes a script change visible in the release diff.
*/ -}}
{{- if .Values.soc2Evidence.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sedoc-soc2-evidence
spec:
  schedule: {{ .Values.soc2Evidence.schedule | quote }}  # 04:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800   # keep pod 7 days for debug
      template:
        metadata:
          annotations:
            checksum/script: {{ .Files.Get "files/soc2-evidence.sh" | sha256sum }}
        spec:
          restartPolicy: Never
          containers:
            - name: soc2
              # Multi-arch alpine + everything the script touches.
              image: alpine:3.19
              env:
                # Cross-tenant evidence needs the owner role (RLS hides
                # tenant rows from dms_app). Password via PGPASSWORD; the
                # old `database-url` key existed in no Secret.
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.database.migration.existingSecret }}
                      key: {{ .Values.global.database.migration.passwordKey }}
                - name: DATABASE_URL
                  value: "postgres://{{ .Values.global.database.migration.username }}@{{ include "sedoc.dbHost" . }}:{{ .Values.global.database.port }}/{{ .Values.global.database.name }}?sslmode=require"
                - name: SEDOC_EVIDENCE_SIGNING_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.soc2Evidence.secret.name }}
                      key: {{ .Values.soc2Evidence.secret.signingKeyKey }}
                - name: PROMETHEUS_URL
                  value: {{ .Values.soc2Evidence.prometheusURL | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.soc2Evidence.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.global.s3.endpoint | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache bash postgresql-client aws-cli curl openssl
                  exec bash /opt/soc2/soc2-evidence.sh
              volumeMounts:
                - name: script
                  mountPath: /opt/soc2
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: sedoc-soc2-evidence-script
{{- end }}
