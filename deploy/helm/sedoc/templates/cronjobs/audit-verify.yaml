{{- /*
§8.8 / G8 — daily audit chain verification.

CronJob hits POST /api/v1/audit/verify-integrity once per tenant. The
endpoint increments `audit_chain_break_total{tenant_id}` on any break;
the p0-platform-emergency alert in deploy/monitoring/alerts/tiered-
alerts.yml pages on-call within seconds.

Calls the audit service's HTTP port directly (in-cluster, not through Kong)
with the gateway signature + X-Internal-Service-Key + the tenant header.
OFF by default (values.auditVerify): the endpoint still requires an admin
session, which an unattended job cannot present — it needs an
internal-key route on the audit service first.
*/ -}}
{{- /* `| default true` made false impossible: sprig default treats false as empty. */ -}}
{{- if .Values.auditVerify.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sedoc-audit-verify
  labels:
    app.kubernetes.io/name: sedoc-audit-verify
    app.kubernetes.io/component: audit
spec:
  schedule: {{ .Values.auditVerify.schedule | quote }}  # daily 03:15 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify
              image: curlimages/curl:8.6.0
              env:
                # The audit API is on the HTTP port behind the gateway
                # signature; the health port serves only /healthz, /readyz.
                - name: AUDIT_URL
                  value: "http://sedoc-audit:{{ .Values.audit.httpPort }}"
                - name: INTERNAL_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.platformSecrets.existingSecret }}
                      key: {{ .Values.global.platformSecrets.internalAPIKeyKey }}
                - name: GATEWAY_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gateway.secret.name }}
                      key: {{ .Values.gateway.secret.sharedSecretKey }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "$(date -Iseconds) audit-verify starting"
                  # Tenant ids are passed in as a newline-separated
                  # string via the `.Values.auditVerify.tenantIds`
                  # chart value for small deployments. Large multi-
                  # tenant SaaS should swap this for a call to an
                  # /internal/tenants endpoint — follow-up when
                  # control-plane surfaces stabilize.
                  printf '%s\n' {{- range .Values.auditVerify.tenantIds }}
                    "{{ . }}"
                  {{- end }} | while read TENANT; do
                    echo "verifying tenant=$TENANT"
                    STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
                      -X POST "$AUDIT_URL/api/v1/audit/verify-integrity" \
                      -H "X-Gateway-Signature: $GATEWAY_SECRET" \
                      -H "X-Internal-Service-Key: $INTERNAL_API_KEY" \
                      -H "X-Auth-Tenant-ID: $TENANT")
                    if [ "$STATUS" != "200" ]; then
                      echo "$(date -Iseconds) audit-verify HTTP $STATUS for $TENANT"
                      cat /tmp/body
                      exit 1
                    fi
                    # Log the result; actual alerting is from
                    # audit_chain_break_total in Prometheus.
                    cat /tmp/body
                  done
                  echo "$(date -Iseconds) audit-verify complete"
{{- end }}
