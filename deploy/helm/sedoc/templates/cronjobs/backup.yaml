{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sedoc-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ .Values.global.imageRegistry }}/ops-tools:{{ .Values.global.imageTag }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  FILENAME="sedoc-${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${FILENAME}"
                  pg_dump "${DATABASE_URL}" | gzip > /tmp/${FILENAME}
                  # aws-cli is baked into ops-tools (no run-time apk).
                  aws s3 cp /tmp/${FILENAME} s3://{{ .Values.backup.s3Bucket }}/${FILENAME} \
                    --endpoint-url {{ .Values.global.s3.endpoint }}
                  echo "Backup uploaded: s3://{{ .Values.backup.s3Bucket }}/${FILENAME}"
                  # Prune old backups
                  aws s3 ls s3://{{ .Values.backup.s3Bucket }}/ \
                    --endpoint-url {{ .Values.global.s3.endpoint }} | \
                    sort | head -n -{{ .Values.backup.retention }} | \
                    awk '{print $4}' | \
                    xargs -I{} aws s3 rm s3://{{ .Values.backup.s3Bucket }}/{} \
                      --endpoint-url {{ .Values.global.s3.endpoint }} 2>/dev/null || true
                  echo "Backup complete."
              env:
                # dms_backup: pg_read_all_data + BYPASSRLS (a dump as the
                # NOBYPASSRLS app role fails on every FORCE-RLS table).
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.database.backup.existingSecret }}
                      key: {{ .Values.global.database.backup.passwordKey }}
                - name: DATABASE_URL
                  value: "postgresql://{{ .Values.global.database.backup.username }}@{{ include "sedoc.dbHost" . }}:{{ .Values.global.database.port }}/{{ .Values.global.database.name }}?sslmode={{ .Values.global.database.sslMode }}"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.s3.accessKeySecret }}
                      key: {{ .Values.global.s3.accessKeyKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.s3.accessKeySecret }}
                      key: {{ .Values.global.s3.secretKeyKey }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.global.s3.region }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
{{- end }}
