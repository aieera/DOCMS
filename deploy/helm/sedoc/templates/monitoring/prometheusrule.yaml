{{- /* GENERATED by deploy/monitoring/gen-helm-monitoring.py from deploy/monitoring/alerts/kubernetes.yml, deploy/monitoring/alerts/sedoc-rules.yml, deploy/monitoring/alerts/slo-burn-rate.yml, deploy/monitoring/alerts/tiered-alerts.yml — do not edit. */ -}}
{{- $mon := include "sedoc.monitoring.values" . | fromYaml }}
{{- if and $mon.enabled $mon.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: sedoc
    {{- with $mon.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
{{ `  # --- deploy/monitoring/alerts/kubernetes.yml ---
    - name: sedoc-kubernetes
      rules:
        # O-3: a pod that keeps restarting (crash loop, OOM kill, failed
        # liveness probe) is invisible in the app metrics — it just
        # disappears and comes back.
        - alert: PodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="__SEDOC_NAMESPACE__"}[1h]) > 3
          for: 5m
          labels:
            severity: p2
            service: "{{ $labels.container }}"
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} restarted {{ $value }} times in the last hour"
            description: "kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}; check the previous container's logs (--previous)."

        - alert: JobFailing
          expr: kube_job_status_failed{namespace="__SEDOC_NAMESPACE__"} > 0
          for: 30m
          labels:
            severity: p3
            service: "{{ $labels.job_name }}"
            team: platform
          annotations:
            summary: "Job {{ $labels.job_name }} has failed pods"

        - alert: DiskUsageHigh
          expr: |
            (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_avail_bytes{mountpoint="/"})
              / node_filesystem_size_bytes{mountpoint="/"} > 0.85
          for: 10m
          labels:
            severity: p2
            service: infra
            team: infra
          annotations:
            summary: "Disk > 85% on {{ $labels.instance }}"
  # --- deploy/monitoring/alerts/sedoc-rules.yml ---
    # ===========================================================================
    # P1 — Pages (PagerDuty)
    # ===========================================================================
    - name: vaultdms.p1
      rules:
        # BUG-01 / O-3: an audit event the consumer cannot store is NAK'd and
        # lost after MaxDeliver. Any sustained error rate is audit evidence
        # being dropped — page, like a chain break.
        - alert: AuditIngestErrors
          expr: sum(rate(audit_ingest_events_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: p1
            service: audit
            team: platform
          annotations:
            summary: "Audit ingest is failing — audit evidence is being dropped"
            description: "audit_ingest_events_total{result=\"error\"} rising for 5m. audit_ingest_failures_total by subject shows which event class."
            runbook: "https://wiki.vaultdms.io/runbooks/audit-ingest"

    # ===========================================================================
    # P2 — Slack notifications
    # ===========================================================================
    - name: vaultdms.p2
      rules:
        # O-3: per-row publish failures. A single transient failure retries;
        # a sustained rate means the drain is not getting events out (bus
        # down, unbound subject) and the DLQ is next.
        - alert: OutboxPublishFailures
          expr: sum by (service, exported_service) (rate(outbox_publish_failures_total[10m])) > 0
          for: 15m
          labels:
            severity: p2
            service: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }}"
            team: platform
          annotations:
            summary: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }} outbox publishes failing for 15m"
            description: "outbox_publish_failures_total is rising; see the event_type label and the drain logs."
            runbook: "https://wiki.vaultdms.io/runbooks/outbox-dlq"

        # Wave 0.2 — any dead-lettered outbox row means an event could not
        # be published after MaxAttempts (e.g. an unbound JetStream subject).
        # The drain no longer wedges on it, but a non-empty DLQ is data that
        # never reached its consumer and needs operator triage + replay.
        - alert: OutboxDLQNotEmpty
          expr: max by (service, exported_service) (outbox_dlq_depth) > 0
          for: 5m
          labels:
            severity: p2
            service: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }}"
            team: platform
          annotations:
            summary: "Outbox dead-letter queue is non-empty"
            description: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }} has {{ $value }} row(s) in outbox_dlq (failed to publish after retries). Inspect outbox_dlq.last_error and replay."
            runbook: "https://wiki.vaultdms.io/runbooks/outbox-dlq"

        # A steadily rising drain lag means the publisher is falling behind
        # (or wedged on a slow/failing subject before the DLQ kicks in).
        - alert: OutboxDrainLagHigh
          expr: max by (service, exported_service) (outbox_drain_lag_seconds) > 300
          for: 5m
          labels:
            severity: p2
            service: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }}"
            team: platform
          annotations:
            summary: "Outbox drain lag >5m"
            description: "{{ with $labels.exported_service }}{{ . }}{{ else }}{{ $labels.service }}{{ end }} oldest unpublished outbox row is {{ $value }}s old."

        # BUG-01: the in-process maintainer creates the monthly audit_events
        # partitions ahead of time. A failing pass means next month's
        # inserts land in the DEFAULT partition (or fail).
        - alert: AuditPartitionMaintenanceFailing
          expr: sum(increase(audit_partition_ensure_total{result="error"}[1h])) > 0
          for: 0m
          labels:
            severity: p2
            service: audit
            team: platform
          annotations:
            summary: "audit_events partition maintenance failed in the last hour"
            runbook: "https://wiki.vaultdms.io/runbooks/audit-partitions"

        - alert: AuditDefaultPartitionRows
          expr: max(audit_default_partition_rows) > 0
          for: 15m
          labels:
            severity: p2
            service: audit
            team: platform
          annotations:
            summary: "{{ $value }} audit event(s) in the audit_events DEFAULT partition"
            description: "Rows are stored and queryable, but created_at is landing outside the maintained monthly window; create the missing partitions and move the rows."
            runbook: "https://wiki.vaultdms.io/runbooks/audit-partitions"

        - alert: GatewayLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(kong_request_latency_ms_bucket[5m]))) > 500
          for: 5m
          labels:
            severity: p2
            service: gateway
            team: platform
          annotations:
            summary: "P95 latency above 500ms at the gateway for 5 minutes"
            description: "P95 = {{ $value }}ms"
  # --- deploy/monitoring/alerts/slo-burn-rate.yml ---
    # ===========================================================================
    # SLO burn-rate alerts — multi-window, multi-burn-rate (Google SRE workbook)
    #
    # Two pages per SLO:
    #   - fast: 2% of 30d budget burned in 1h  (short + long window confirm)
    #   - slow: 10% of 30d budget burned in 6h
    #
    # Short-window is the "is it happening right now" signal; long-window is
    # the "is this a real trend, not a blip" signal. Both must fire, so a
    # single bad minute can't page.
    #
    # Each SLO is defined by its target availability/latency; the burn-rate
    # multiplier is derived from how fast we'd exhaust the budget at current
    # error rate. 14.4x in 1h = 2% of a 30d budget consumed in one hour.
    #
    # SLOs tracked here (spec §13.6), measured where the metric exists:
    #   api-avail    : 99.9% non-5xx at the gateway (Kong, every route)
    #   storage      : 99.9% of /api/v1/storage requests < 500ms (Kong route
    #                  "storage": upload initiate/complete, download URLs)
    #   search-query : 99.0% of /api/v1/search requests < 500ms (Kong route
    #                  "search"). The spec target is 400ms, but Kong's latency
    #                  histogram has no 400ms bucket bound (…200, 500…); the
    #                  bucket-independent p99 check is SearchLatencyBreach in
    #                  tiered-alerts.yml.
    #
    # Latency buckets are matched with a regex: Kong's exporter pads 'le'
    # (le="00500.0").
    # No alert yet (O-3): permission-check latency (policy exports none) and
    # OCR completion (recorded in Celery workers, which expose no /metrics).
    # ===========================================================================
    - name: slo.burn-rate.api-availability
      rules:
        # --- fast burn: 2% budget in 1h (14.4x) ---
        - alert: SLOBurnFastAPIAvailability
          expr: >
            (
              sum(rate(kong_http_requests_total{code=~"5.."}[1h]))
              / sum(rate(kong_http_requests_total[1h]))
            ) > (14.4 * 0.001)
            and
            (
              sum(rate(kong_http_requests_total{code=~"5.."}[5m]))
              / sum(rate(kong_http_requests_total[5m]))
            ) > (14.4 * 0.001)
          for: 2m
          labels:
            severity: p1
            service: gateway
            team: platform
            slo: api-availability
            burn: fast
          annotations:
            summary: "API availability SLO burning fast (2% of 30d budget in 1h)"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

        # --- slow burn: 10% budget in 6h (6x) ---
        - alert: SLOBurnSlowAPIAvailability
          expr: >
            (
              sum(rate(kong_http_requests_total{code=~"5.."}[6h]))
              / sum(rate(kong_http_requests_total[6h]))
            ) > (6 * 0.001)
            and
            (
              sum(rate(kong_http_requests_total{code=~"5.."}[30m]))
              / sum(rate(kong_http_requests_total[30m]))
            ) > (6 * 0.001)
          for: 15m
          labels:
            severity: p2
            service: gateway
            team: platform
            slo: api-availability
            burn: slow
          annotations:
            summary: "API availability SLO burning slow (10% of 30d budget in 6h)"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

    - name: slo.burn-rate.storage
      rules:
        - alert: SLOBurnFastStorage
          expr: >
            (
              sum(rate(kong_request_latency_ms_count{route="storage"}[1h]))
              -
              sum(rate(kong_request_latency_ms_bucket{route="storage",le=~"0*500(\\.0+)?"}[1h]))
            )
            /
            sum(rate(kong_request_latency_ms_count{route="storage"}[1h]))
            > (14.4 * 0.001)
            and
            (
              sum(rate(kong_request_latency_ms_count{route="storage"}[5m]))
              -
              sum(rate(kong_request_latency_ms_bucket{route="storage",le=~"0*500(\\.0+)?"}[5m]))
            )
            /
            sum(rate(kong_request_latency_ms_count{route="storage"}[5m]))
            > (14.4 * 0.001)
          for: 2m
          labels:
            severity: p1
            service: storage
            team: platform
            slo: storage-latency
            burn: fast
          annotations:
            summary: "storage API latency SLO burning fast (2% budget in 1h)"
            description: ">0.1% of /api/v1/storage requests exceed 500ms, fast enough to burn 2% of 30d budget in 1h"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

        - alert: SLOBurnSlowStorage
          expr: >
            (
              sum(rate(kong_request_latency_ms_count{route="storage"}[6h]))
              -
              sum(rate(kong_request_latency_ms_bucket{route="storage",le=~"0*500(\\.0+)?"}[6h]))
            )
            /
            sum(rate(kong_request_latency_ms_count{route="storage"}[6h]))
            > (6 * 0.001)
          for: 15m
          labels:
            severity: p2
            service: storage
            team: platform
            slo: storage-latency
            burn: slow
          annotations:
            summary: "storage API latency SLO burning slow (10% budget in 6h)"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

    - name: slo.burn-rate.search
      rules:
        - alert: SLOBurnFastSearch
          expr: >
            (
              sum(rate(kong_request_latency_ms_count{route="search"}[1h]))
              -
              sum(rate(kong_request_latency_ms_bucket{route="search",le=~"0*500(\\.0+)?"}[1h]))
            )
            /
            sum(rate(kong_request_latency_ms_count{route="search"}[1h]))
            > (14.4 * 0.01)
          for: 2m
          labels:
            severity: p1
            service: search
            team: search
            slo: search-latency
            burn: fast
          annotations:
            summary: "search p99 SLO burning fast (2% budget in 1h)"
            description: "search latency target: 99% of queries < 500ms at the gateway"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

        - alert: SLOBurnSlowSearch
          expr: >
            (
              sum(rate(kong_request_latency_ms_count{route="search"}[6h]))
              -
              sum(rate(kong_request_latency_ms_bucket{route="search",le=~"0*500(\\.0+)?"}[6h]))
            )
            /
            sum(rate(kong_request_latency_ms_count{route="search"}[6h]))
            > (6 * 0.01)
          for: 15m
          labels:
            severity: p2
            service: search
            team: search
            slo: search-latency
            burn: slow
          annotations:
            summary: "search p99 SLO burning slow (10% budget in 6h)"
            runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"
  # --- deploy/monitoring/alerts/tiered-alerts.yml ---
    # ---- P0 — platform emergency ----------------------------------
    - name: p0-platform-emergency
      interval: 30s
      rules:
        - alert: APIAvailabilityCatastrophic
          expr: |
            sum(rate(kong_http_requests_total{code!~"5.."}[1m]))
              / sum(rate(kong_http_requests_total[1m])) < 0.95
          for: 2m
          labels: { severity: p0, service: gateway, runbook: api-down }
          annotations:
            summary: "API availability < 95% at the gateway (SLO 99.95%) for 2 minutes"

        - alert: AuditChainBreak
          # §8.8 / G8 — hash-chain tamper detection. ANY non-zero
          # increment is a compliance emergency (tamper or silent data
          # corruption). Alert auto-opens the audit-chain-break runbook.
          expr: increase(audit_chain_break_total[10m]) > 0
          for: 0m
          labels: { severity: p0, service: audit, runbook: audit-chain-break }
          annotations:
            summary: "Audit hash chain BROKEN for tenant {{ $labels.tenant_id }}"
            description: "audit_chain_break_total incremented; treat as compromise class until investigated."

        - alert: DatabasePrimaryDown
          # pg_up comes from postgres_exporter (bitnami chart,
          # postgresql.metrics.enabled); cnpg_collector_up from the
          # CloudNativePG PodMonitor. Whichever the deployment runs.
          expr: pg_up == 0 or cnpg_collector_up == 0
          for: 1m
          labels: { severity: p0, service: postgres, runbook: db-failover }
          annotations:
            summary: "Postgres unreachable from its exporter ({{ $labels.instance }})"

    # ---- P1 — SLO breach ------------------------------------------
    - name: p1-slo-breach
      interval: 1m
      rules:
        - alert: APIAvailabilityBreach
          expr: |
            sum(rate(kong_http_requests_total{code!~"5.."}[5m]))
              / sum(rate(kong_http_requests_total[5m])) < 0.9995
          for: 5m
          labels: { severity: p1, service: gateway, runbook: slo-availability }
          annotations:
            summary: "API availability below 99.95% at the gateway (§15.2 SLI 1)"

        - alert: SearchLatencyBreach
          # kong_request_latency_ms is in milliseconds (gateway + upstream).
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(kong_request_latency_ms_bucket{route="search"}[5m]))) > 300
          for: 10m
          labels: { severity: p1, service: search, runbook: slo-search-latency }
          annotations:
            summary: "Search p99 > 300ms at the gateway, sustained 10m (§15.2 SLI 2)"

        - alert: ErrorBudgetBurnHigh
          # 14.4x burn = exhaust in 2d from 1h window (fast burn).
          expr: |
            ( (1 - 0.9995) / (1 - (sum(rate(kong_http_requests_total{code!~"5.."}[1h])) / sum(rate(kong_http_requests_total[1h])))) ) > 14.4
          for: 5m
          labels: { severity: p1, service: gateway, runbook: error-budget }
          annotations:
            summary: "Error budget burning 14.4× baseline — feature freeze candidate (§15.2 SLI 19)"

    # ---- P3 — dashboard-only --------------------------------------
    - name: p3-informational
      interval: 5m
      rules:
        - alert: RouteRateLimited
          # Informational: a route answering 429s persistently signals a
          # misbehaving integration, not a platform issue. Kong does not
          # label requests by tenant; the route narrows it down.
          expr: sum by (route) (rate(kong_http_requests_total{code="429"}[15m])) > 1
          for: 30m
          labels: { severity: p3, service: gateway }
          annotations:
            summary: "Route {{ $labels.route }} sustained 429s"
` | replace "__SEDOC_NAMESPACE__" .Release.Namespace }}
{{- end }}
