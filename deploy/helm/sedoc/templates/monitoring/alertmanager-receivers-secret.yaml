{{- /*
O-1 — Alertmanager receiver credentials, read through *_file paths in
deploy/monitoring/alertmanager.yml. Mount it on the Alertmanager with
alertmanagerSpec.secrets: [sedoc-alertmanager-receivers] (the Operator
mounts it at /etc/alertmanager/secrets/sedoc-alertmanager-receivers/).
The name is fixed because the config file names that path.

Production: leave receiversSecret.create false and provide the Secret
from your secret store (ExternalSecrets etc.) with these keys. create:
true renders it from values for test clusters.
*/ -}}
{{- $mon := include "sedoc.monitoring.values" . | fromYaml }}
{{- $am := $mon.alertmanager }}
{{- $rs := $am.receiversSecret }}
{{- if and $mon.enabled $rs.create }}
apiVersion: v1
kind: Secret
metadata:
  name: sedoc-alertmanager-receivers
  namespace: {{ $am.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: sedoc
type: Opaque
data:
  pagerduty-p0-service-key: {{ required "monitoring.alertmanager.receiversSecret.pagerdutyP0ServiceKey is required" $rs.pagerdutyP0ServiceKey | b64enc }}
  pagerduty-p1-service-key: {{ required "monitoring.alertmanager.receiversSecret.pagerdutyP1ServiceKey is required" $rs.pagerdutyP1ServiceKey | b64enc }}
  slack-oncall-webhook: {{ required "monitoring.alertmanager.receiversSecret.slackOncallWebhook is required" $rs.slackOncallWebhook | b64enc }}
  slack-incidents-webhook: {{ required "monitoring.alertmanager.receiversSecret.slackIncidentsWebhook is required" $rs.slackIncidentsWebhook | b64enc }}
{{- end }}
