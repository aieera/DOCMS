{{- /* GENERATED by deploy/monitoring/gen-helm-monitoring.py from deploy/monitoring/alertmanager.yml — do not edit. */ -}}
{{- $mon := include "sedoc.monitoring.values" . | fromYaml }}
{{- $am := $mon.alertmanager }}
{{- if and $mon.enabled $am.configSecret.enabled }}
{{- $smtp := $am.smtp }}
{{- $cfg := `# §15.4 / F4 — Alertmanager routing by severity tier.
#
# Routing:
#   p0 → pagerduty-phone + slack #oncall-immediate
#   p1 → pagerduty-standard
#   p2 → slack #incidents
#   p3 → email digest (no pager)
#
# Inhibition rule: if a service is marked DOWN (up{job="$svc"}==0)
# we suppress downstream alerts from THAT service and its
# dependents — otherwise a single pod kill emits a page-storm.
#
# Deployment (O-1). This one file is used as-is by both paths:
#   Helm     templates/monitoring/alertmanager-config-secret.yaml embeds it
#            (generated by deploy/monitoring/gen-helm-monitoring.py) in the
#            Secret the Prometheus Operator's Alertmanager reads; set
#            alertmanagerSpec.configSecret to it.
#   compose  deploy/monitoring/compose.monitoring.yml (profile monitoring).
#
# Credentials are never in this file. Alertmanager does not expand
# environment variables (the old placeholders were sent verbatim), so every
# secret is read from a file (*_file, Alertmanager >= 0.25) under
#   /etc/alertmanager/secrets/sedoc-alertmanager-receivers/
# which is where the Operator mounts alertmanagerSpec.secrets:
# [sedoc-alertmanager-receivers], and where compose mounts
# SEDOC_ALERTMANAGER_SECRETS_DIR. Keys:
#   pagerduty-p0-service-key, pagerduty-p1-service-key,
#   slack-oncall-webhook, slack-incidents-webhook
# The three __SMTP_*__/__ALERT_DIGEST_TO__ tokens are not secret; Helm
# replaces them from monitoring.alertmanager.smtp.*, compose from
# SEDOC_ALERT_SMTP_SMARTHOST / SEDOC_ALERT_SMTP_FROM / SEDOC_ALERT_DIGEST_TO.

global:
  resolve_timeout: 5m
  smtp_smarthost: "__SMTP_SMARTHOST__"
  smtp_from: "__SMTP_FROM__"

route:
  # Fallthrough for an alert without a p0..p3 severity: Slack, not the
  # email digest, so a mislabelled alert is still seen the same day
  # (O-2). check-metrics.py rejects rules without a tier label.
  receiver: slack-incidents
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="p0"]
      receiver: pager-immediate
      group_wait: 0s
      repeat_interval: 15m
      continue: true                # also deliver to slack-oncall
    - matchers: [severity="p0"]
      receiver: slack-oncall

    - matchers: [severity="p1"]
      receiver: pager-standard
      repeat_interval: 1h

    - matchers: [severity="p2"]
      receiver: slack-incidents
      repeat_interval: 2h

    - matchers: [severity="p3"]
      receiver: email-digest
      repeat_interval: 24h

receivers:
  - name: pager-immediate
    pagerduty_configs:
      - service_key_file: /etc/alertmanager/secrets/sedoc-alertmanager-receivers/pagerduty-p0-service-key
        severity: critical
        description: '{{ template "pagerduty.default.description" . }}'
  - name: pager-standard
    pagerduty_configs:
      - service_key_file: /etc/alertmanager/secrets/sedoc-alertmanager-receivers/pagerduty-p1-service-key
        severity: error
  - name: slack-oncall
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/sedoc-alertmanager-receivers/slack-oncall-webhook
        channel: "#oncall-immediate"
        title: "P0 {{ .GroupLabels.alertname }}"
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: slack-incidents
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/sedoc-alertmanager-receivers/slack-incidents-webhook
        channel: "#incidents"
        title: "{{ .CommonLabels.severity | toUpper }} {{ .GroupLabels.alertname }}"
  - name: email-digest
    email_configs:
      - to: "__ALERT_DIGEST_TO__"
        send_resolved: false

inhibit_rules:
  # A service totally down silences its SLO-breach alerts; the
  # "service down" P0 is the informative one.
  - source_matchers: [alertname="DatabasePrimaryDown"]
    target_matchers: [severity=~"p1|p2"]
    equal: [service]
  - source_matchers: [alertname="APIAvailabilityCatastrophic"]
    target_matchers: [severity="p1", service=~"document|storage|search|audit"]
` }}
{{- $cfg = replace "__SMTP_SMARTHOST__" (required "monitoring.alertmanager.smtp.smarthost is required" $smtp.smarthost) $cfg }}
{{- $cfg = replace "__SMTP_FROM__" (required "monitoring.alertmanager.smtp.from is required" $smtp.from) $cfg }}
{{- $cfg = replace "__ALERT_DIGEST_TO__" (required "monitoring.alertmanager.smtp.digestTo is required" $smtp.digestTo) $cfg }}
apiVersion: v1
kind: Secret
metadata:
  # Point the Alertmanager at it: kube-prometheus-stack
  # alertmanager.alertmanagerSpec.configSecret, and mount the receiver
  # credentials with alertmanagerSpec.secrets: [sedoc-alertmanager-receivers].
  name: {{ $am.configSecret.name }}
  namespace: {{ $am.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: sedoc
type: Opaque
data:
  alertmanager.yaml: {{ $cfg | b64enc }}
{{- end }}
