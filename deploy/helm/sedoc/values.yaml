# ============================================================================
# Migrations (H-18)
# ============================================================================
# ghcr.io/aieera/sedoc/migrate (build/Dockerfile.migrate) runs
# scripts/migrate-all.sh: role bootstrap (dms_app LOGIN from the DB secret,
# default privileges) then every service's track in dependency order, each
# with its own bookkeeping table. On `helm install` it is a plain Job (the
# bundled Postgres does not exist yet when pre-install hooks run; the app
# pods restart until it finishes). On `helm upgrade` it is a pre-upgrade
# hook, so the schema moves before any new binary rolls out.
migrations:
  enabled: true
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  waitForDatabaseSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ============================================================================
# Scheduled jobs
# ============================================================================
# Daily audit-chain verification. OFF by default: POST
# /api/v1/audit/verify-integrity requires an admin session, so an
# unattended job cannot authenticate yet (needs an internal-key route on the
# audit service). Kept renderable for when that lands.
auditVerify:
  enabled: false
  schedule: "15 3 * * *"
  tenantIds: []

# Daily retention sweep: POST /internal/v1/retention/sweep on the document
# service (Bearer SEDOC_INTERNAL_API_KEY) once per listed tenant. Nothing to
# do without tenant ids, so OFF until you list them.
retentionSweep:
  enabled: false
  schedule: "0 2 * * *"
  tenantIds: []

# Daily records cutoff sweep (DOC2): POST /internal/v1/records/cutoff-sweep
# per listed tenant; flips declared records past cutoff to cutoff_pending.
recordsCutoffSweep:
  enabled: false
  schedule: "30 2 * * *"
  tenantIds: []

# Nightly SOC 2 evidence bundle (scripts/soc2-evidence.sh). Needs an
# evidence bucket and the `signing-key` in soc2Evidence.secret.
soc2Evidence:
  enabled: false
  schedule: "30 4 * * *"
  bucket: ""
  prometheusURL: "http://prometheus-server"
  secret:
    name: sedoc-evidence
    signingKeyKey: signing-key

# ============================================================================
# Ingress
# ============================================================================

# C-1 — the Ingress has exactly two backends: the Kong gateway (/api, /yjs,
# /ws) and the static web app (/). Backends are never exposed directly; they
# reject any request without the gateway signature Kong adds.
ingress:
  enabled: true
  className: nginx
  # Applied to both Ingress objects. Kong enforces the per-route body caps
  # (1 MB, 64 MB on document-carrying routes); this only has to admit the
  # largest.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # Second Ingress (same host, same gateway backend) for paths that need
  # long windows: DOC2's 12-minute m365 filing / bulk import, and the
  # collaboration WebSockets.
  longRunning:
    paths:
      - /api/v1/integrations/m365
      - /api/v1/admin/bulk/import
      - /yjs
      - /ws
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "720"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "720"
  tls:
    - secretName: "{{ .Values.global.tlsSecretName }}"
      hosts:
        - "{{ .Values.global.domain }}"

# ============================================================================
# Subcharts
# ============================================================================

postgresql:
  # Bitnami StatefulSet (default). Suitable for single-AZ deploys.
  enabled: true
  # DEC-1: no application user here — `postgres` (the migration role) owns
  # the schema and the migrate Job creates dms_app. sedoc-db-credentials
  # needs postgres-password (+ dms-app-password for dms_app).
  auth:
    database: vaultdms
    username: ""
    existingSecret: sedoc-db-credentials
    secretKeys:
      adminPasswordKey: postgres-password
  tls:
    enabled: true
    autoGenerated: true
  primary:
    persistence:
      size: 50Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: "2", memory: "4Gi" }
  # CloudNativePG operator path (ADR 0092, opt-in). When useOperator
  # is true, the chart renders a postgresql.cnpg.io/v1 Cluster CRD
  # (templates/postgres-cluster.yaml) instead of relying on Bitnami.
  # The operator's own CRDs MUST be pre-installed:
  #   helm install cnpg cloudnative-pg/cloudnative-pg \
  #     --namespace cnpg-system --create-namespace
  # Migrating from Bitnami requires a pg_dump → restore step before
  # disabling the Bitnami subchart. See docs/runbooks/helm-install.md.
  # With the operator, point global.database.migration at the superuser
  # Secret it generates (<release>-postgres-superuser, key `password`).
  useOperator: false
  operator:
    instances: 3                 # primary + 2 hot replicas
    image: ghcr.io/cloudnative-pg/postgresql:16.4
    maxConnections: 200
    sharedBuffers: 512MB
    storageSize: 100Gi
    credentialsSecret: sedoc-postgres-credentials
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: "2", memory: 4Gi }
    backup:
      destinationPath: "s3://sedoc-postgres-backups/{{ .Release.Name }}"
      credentialsSecret: sedoc-postgres-backup-credentials
      retentionPolicy: "30d"

redis:
  enabled: true
  architecture: standalone
  # R-19 — auth on (was off: any pod could read sessions / Celery queues).
  auth:
    enabled: true
    existingSecret: sedoc-redis-credentials
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      size: 5Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

opensearch:
  enabled: true
  singleNode: true
  resources:
    requests: { cpu: 500m, memory: "1Gi" }
    limits:   { cpu: "2", memory: "4Gi" }
  persistence:
    size: 50Gi

nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
        # The services declare ~225 GB of stream MaxBytes (15 streams x 10 GB
        # + 15 DLQs x 5 GB). max_file_store is a reservation ceiling, not an
        # allocation; below the total, stream bootstrap fails and every Go
        # service crash-loops (same as deploy/nats/nats.conf).
        maxSize: 256Gi
    # O-4 — client authentication (was none). `<< $NATS_PASSWORD >>` is
    # emitted unquoted, i.e. as a reference to the container env var below.
    merge:
      authorization:
        user: sedoc          # = global.nats.user
        password: << $NATS_PASSWORD >>
  container:
    env:
      NATS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: sedoc-nats-credentials   # = global.nats.existingSecret
            key: nats-password             # = global.nats.passwordKey

qdrant:
  enabled: true
  persistence:
    size: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1", memory: "2Gi" }

temporal:
  enabled: true
  server:
    resources:
      requests: { cpu: 100m, memory: 128Mi }

# ============================================================================
# NetworkPolicies for the bundled data stores (R-19 / M-32)
# ============================================================================
# Each bundled store (selected by its subchart's name + instance labels)
# accepts connections only from this release's own pods
# (app.kubernetes.io/part-of: sedoc — every Deployment/Job/CronJob the chart
# renders carries it), from its own peers (replication / clustering, any
# port), and from `extraFrom` (e.g. a Prometheus namespace for exporters).
networkPolicy:
  dataStores:
    enabled: true
    extraFrom: []
    stores:
      postgresql: { enabled: true, name: postgresql, ports: [5432] }
      redis:      { enabled: true, name: redis,      ports: [6379] }
      nats:       { enabled: true, name: nats,       ports: [4222] }
      opensearch: { enabled: true, name: opensearch, ports: [9200] }
      qdrant:     { enabled: true, name: qdrant,     ports: [6333, 6334] }

# ============================================================================
# Backup
# ============================================================================

backup:
  enabled: true
  schedule: "0 2 * * *"   # daily at 2am
  s3Bucket: sedoc-backups
  retention: 30            # days
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # FIX-8 (audit Section 12): restore-verification CronJob. Pulls
  # the most recent backup from s3Bucket, restores it into a scratch
  # postgres pod, asserts at least one row in the canonical tables
  # (documents, versions, audit_events). Failure pages oncall. Runs
  # once a week so backup-rot is detected within 7 days instead of
  # at incident time.
  verify:
    enabled: true
    schedule: "0 4 * * 0"  # Sunday 4am
    minRowCount:
      documents: 1
      document_versions: 1
      audit_events: 1

# FIX-8 (audit Section 12): bucket-init Job. Provisions S3
# versioning + optional object-lock GOVERNANCE retention on every
# content-bearing bucket as a Helm post-install hook. Without this
# the DR runbook's "restore from S3 version history" recovery
# mechanism is documented but not actually configured — the audit's
# Section 12 finding.
s3BucketInit:
  enabled: true
  # R-15: pinned by digest (was minio/mc:latest).
  image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
  buckets:
    - dms-us-east-1-hot
    - dms-us-east-1-warm
    - dms-us-east-1-previews
    - dms-quarantine
  retention:
    # Off by default — only AWS S3 + MinIO-with-object-lock support
    # it; legacy clusters need a one-time `mc mb --with-lock` first.
    enabled: false
    years: 7
