# Monitoring stack values for the load-test cluster.
#
# Pointed at the LOADTEST cluster — not prod. Confirm the cluster
# label below before applying; an Alertmanager misconfig that pages
# the prod oncall during a load test is the worst-case outcome.
prometheus:
  prometheusSpec:
    externalLabels:
      cluster: vaultdms-loadtest
    retention: 7d
    # Generous so a 2-hour run doesn't drop the burst-stage samples.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 200Gi
    # Don't route any alert to PagerDuty / Slack / wherever — load
    # tests are EXPECTED to trip some thresholds. We page humans on
    # prod, not on loadtest.
    additionalAlertmanagerConfigs: []

alertmanager:
  enabled: true
  alertmanagerSpec:
    externalUrl: ""
  config:
    route:
      receiver: "null"  # swallow everything by default
      routes: []
    receivers:
      - name: "null"

grafana:
  # No password here: terraform generates one (random_password) and
  # passes it with set_sensitive, so it never lands in git (O-12).
  # Internal only — port-forward instead of a public LoadBalancer.
  service:
    type: ClusterIP
  defaultDashboardsEnabled: true
  # Mount the same dashboard JSON the prod observability stack uses,
  # but with the cluster label = "vaultdms-loadtest" so panels select
  # this Prometheus instance, not prod's.
  dashboardsConfigMaps:
    default: vaultdms-dashboards
