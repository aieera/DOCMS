# NATS JetStream config for the local dev stack.
#
# max_file_store is a *logical* reservation ceiling, not a physical
# pre-allocation. The event bus declares 15 primary streams (10 GB each)
# + 15 DLQ streams (5 GB each) = 225 GB of MaxBytes reservation. NATS
# otherwise auto-sizes this cap to ~free disk, so stream bootstrap
# overflows at BILLING_EVENTS_DLQ and every Go service crash-loops on
# "insufficient storage resources available". Pin it above the total
# reservation; dev traffic + 7-day MaxAge keep actual on-disk usage near
# zero.
#
# This must live in a config file: NATS 2.10 has no --max_file_store CLI
# flag (only -js/--jetstream and -sd/--store_dir).

http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 256GB
}

# O-4 — client authentication. Every client (Go services, Python workers,
# collaboration, dms-admin) connects with nats://USER:PASSWORD@nats:4222
# (SEDOC_NATS_URL). The values come from the container environment; NATS
# refuses to start if either is unset, so an unauthenticated bus can never
# come up by accident. Client port 4222 is not published outside the host
# (dev: 127.0.0.1 only; prod override: not at all). The monitoring port
# 8222 stays unauthenticated (healthz / varz, no message access) and is
# bound to 127.0.0.1 in dev.
authorization {
  user: $SEDOC_NATS_USER
  password: $SEDOC_NATS_PASSWORD
}
