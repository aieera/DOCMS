# VaultDMS Ansible config (ADR 0093).
# Run from this directory: cd deploy/ansible && ansible-playbook playbooks/site.yml
[defaults]
inventory             = ./inventories/example.ini
roles_path            = ./roles
host_key_checking     = False
retry_files_enabled   = False
forks                 = 20
stdout_callback       = yaml
interpreter_python    = auto_silent
# Vault password file (path is relative). If you keep secrets in
# Ansible Vault, drop the password into .vault-password (chmod 600,
# gitignored). Otherwise pass --ask-vault-pass on the CLI.
vault_password_file   = .vault-password

[ssh_connection]
pipelining            = True
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s
