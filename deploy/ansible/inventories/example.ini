# Example inventory — copy to `prod.ini` (gitignored) and edit for your hosts.
#
# Group layout matches the role structure: every host belongs to exactly one
# "tier" group (db, cache, search, app) and the playbooks target those groups.
# This is the bare-metal/VM equivalent of the Helm chart's per-service
# deployments — see ADR 0093.

[db]
# db01.internal ansible_host=10.0.1.10

[cache]
# cache01.internal ansible_host=10.0.1.20

[search]
# search01.internal ansible_host=10.0.1.30

[messaging]
# nats01.internal ansible_host=10.0.1.40

[blob]
# minio01.internal ansible_host=10.0.1.50

[workflow]
# temporal01.internal ansible_host=10.0.1.60

[antimalware]
# clamav01.internal ansible_host=10.0.1.70

# ----- Application tier ------------------------------------------------------
# Each Go service runs as a systemd unit on these hosts. Roles can target a
# subset (e.g. only [app:document]) to scale services independently. Default:
# every app host runs every Go service via the templated vaultdms-service role.

[app]
# app01.internal ansible_host=10.0.2.10
# app02.internal ansible_host=10.0.2.11

[app:children]
# nothing yet — declare subgroups when you split services across hosts

# ----- Cross-cutting ---------------------------------------------------------

[vaultdms:children]
db
cache
search
messaging
blob
workflow
antimalware
app

[vaultdms:vars]
ansible_user            = vaultdms-deploy
ansible_become          = true
ansible_become_method   = sudo

# Override per-host or per-group as needed:
#   prod.ini:
#     [app]
#     app01.internal vaultdms_release=v1.0.0
