# Defaults for a single Go service install. The caller MUST set
# vaultdms_service_name (one of: auth, document, storage, signature,
# search, audit, policy, workflow, notification, billing, connector,
# graphql-gateway, mcp-server, intelligence-shim).
#
# Ports default to the conventional SeDoc layout but can be
# overridden per service in the playbook.
vaultdms_service_name: ""
vaultdms_service_grpc_port: 9090
vaultdms_service_http_port: 8080
vaultdms_service_health_port: 8081

# Extra env vars to inject into the systemd unit. Useful for
# service-specific config (gateway address, mock toggles, etc.).
vaultdms_service_extra_env: {}

# Secrets every service needs (pkg/config validates SEDOC_LOCAL_KEK in
# prod for kms_provider=local; DEC-3/DEC-4 need the internal key and the
# gateway signature secret on every service). The play fails before
# rendering anything when one is undefined or empty (O-11).
vaultdms_required_secrets_common:
  - vault_local_kek
  - vault_gateway_secret
  - vault_internal_api_key
  - vault_esign_state_hmac

# Secrets only some services read.
vaultdms_required_secrets_by_service:
  document:
    - vault_irm_signing_key
    - vault_zt_token_pepper
    - vault_onlyoffice_jwt
    # Set once: a new salt changes every later DSR pseudonym.
    - vault_dsr_anonymize_salt
    # Signs e-discovery exports; outside dev the code no longer falls
    # back to the gateway secret.
    - vault_ediscovery_signing_key
  audit:
    - vault_audit_signing_key
  billing:
    - vault_stripe_webhook_secret

# Secrets required when vaultdms_require_license is true (ADR 0095, O-10).
# The release public key is not secret: vaultdms_license_public_key in
# group_vars, asserted with the other settings.
vaultdms_required_secrets_license:
  - vault_license_jwt

# Restart-on-failure window. systemd defaults are fine for most cases.
vaultdms_service_restart: on-failure
vaultdms_service_restart_sec: 5
