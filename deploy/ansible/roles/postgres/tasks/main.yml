# PostgreSQL 16 role. Idempotent on RHEL 8/9 and Ubuntu 22.04/24.04.
# Provisions the cluster with TLS, creates the vaultdms DB (owned by the
# vaultdms role) and the dms_app runtime role (LOGIN, NOBYPASSRLS), the
# only role the services connect as (DEC-1; see CLAUDE.md and ADR 0022).

- name: Required secrets are set (no empty defaults)
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | string | length > 0
    fail_msg: "{{ item }} is undefined or empty. Set it in group_vars/all.vault.yml (ansible-vault edit)."
    quiet: true
  loop: "{{ postgres_required_secrets }}"

# ----- RHEL 8/9 install -----------------------------------------------------

- name: RHEL — install PGDG yum repo
  ansible.builtin.dnf:
    name: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_os_family == 'RedHat'

- name: RHEL — disable distro postgres module
  ansible.builtin.command: dnf -qy module disable postgresql
  args:
    creates: /etc/dnf/modules.d/postgresql.module
  when: ansible_os_family == 'RedHat'

- name: RHEL — install postgres packages
  ansible.builtin.dnf:
    name:
      - "postgresql{{ postgres_version }}-server"
      - "postgresql{{ postgres_version }}-contrib"
      - python3-psycopg2
    state: present
  when: ansible_os_family == 'RedHat'

- name: RHEL — initdb (only if data dir doesn't exist)
  ansible.builtin.command: "/usr/pgsql-{{ postgres_version }}/bin/postgresql-{{ postgres_version }}-setup initdb"
  args:
    creates: "{{ postgres_data_dir_rhel }}/PG_VERSION"
  when: ansible_os_family == 'RedHat'

# ----- Ubuntu 22.04/24.04 install -------------------------------------------

- name: Ubuntu — install PGDG apt repo
  when: ansible_os_family == 'Debian'
  block:
    - name: Ubuntu — install ca-certificates + curl
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, python3-psycopg2]
        update_cache: true

    - name: Ubuntu — PGDG signing key
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: /etc/apt/keyrings/postgresql.asc
        mode: "0644"

    - name: Ubuntu — PGDG apt source
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
        filename: pgdg
        state: present

    - name: Ubuntu — install postgres
      ansible.builtin.apt:
        name: "postgresql-{{ postgres_version }}"
        state: present
        update_cache: true

# ----- Common config --------------------------------------------------------

- name: Resolve data + config dirs for this OS
  ansible.builtin.set_fact:
    postgres_data_dir: "{{ postgres_data_dir_rhel if ansible_os_family == 'RedHat' else postgres_data_dir_ubuntu }}"
    postgres_config_dir: "{{ postgres_data_dir_rhel if ansible_os_family == 'RedHat' else postgres_config_dir_ubuntu }}"
    postgres_unit_name: "{{ 'postgresql-' ~ postgres_version if ansible_os_family == 'RedHat' else 'postgresql' }}"

- name: Install server TLS certificate
  ansible.builtin.copy:
    content: "{{ postgres_ssl_cert }}"
    dest: "{{ postgres_data_dir }}/server.crt"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgres

- name: Install server TLS key
  ansible.builtin.copy:
    content: "{{ postgres_ssl_key }}"
    dest: "{{ postgres_data_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: Restart postgres

- name: Render postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgres_config_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart postgres

- name: Render pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgres

- name: Enable + start postgres
  ansible.builtin.systemd:
    name: "{{ postgres_unit_name }}"
    state: started
    enabled: true

- name: Flush handlers (apply config changes before provisioning)
  ansible.builtin.meta: flush_handlers

# ----- Application DB + role provisioning -----------------------------------
# The community.postgresql collection's modules are the right tool here.
# They use the local socket as the postgres OS user, so no password needed
# for the bootstrap connection.

- name: Create database owner role
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ postgres_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOBYPASSRLS,LOGIN
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become: true
  become_user: postgres

# Belt-and-braces in case the role pre-existed without the flag.
- name: Enforce NOBYPASSRLS on the owner role
  community.postgresql.postgresql_query:
    login_db: postgres
    query: "ALTER ROLE {{ postgres_db_user }} NOBYPASSRLS;"
  become: true
  become_user: postgres
  changed_when: false

# O-6 / DEC-1: the document migrations create dms_app NOLOGIN without a
# password and leave an existing role untouched, so creating it here
# first (and on every run) is what gives it LOGIN and the vault password.
# On installs whose older migrations created it with the shared
# 'devpassword', this replaces that password. Only dms_app gets LOGIN:
# the SECURITY DEFINER owner roles the migrations create
# (dms_outbox_drain, dms_audit_admin, dms_token_lookup, dms_auth_lookup,
# dms_org_writer, ...) stay NOLOGIN.
- name: Create runtime role (dms_app — LOGIN, NOBYPASSRLS)
  community.postgresql.postgresql_user:
    name: "{{ postgres_app_db_user }}"
    password: "{{ postgres_app_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOBYPASSRLS,NOREPLICATION,LOGIN
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Runtime role may connect and use the public schema
  community.postgresql.postgresql_query:
    login_db: "{{ postgres_db_name }}"
    query: >-
      GRANT CONNECT ON DATABASE "{{ postgres_db_name }}" TO "{{ postgres_app_db_user }}";
      GRANT USAGE ON SCHEMA public TO "{{ postgres_app_db_user }}";
  become: true
  become_user: postgres
  changed_when: false

# Migrations run as the postgres superuser (roles/sedoc-migrate), so the
# tables and sequences they create are owned by postgres; these default
# privileges give dms_app DML on them (the dev equivalent is
# scripts/init-db.sql). Ownership stays with a role the services never
# use, so ENABLE-but-not-FORCE RLS tables are enforced too (O-7).
- name: Default privileges for objects the migrations create
  community.postgresql.postgresql_query:
    login_db: "{{ postgres_db_name }}"
    query: >-
      ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "{{ postgres_app_db_user }}";
      ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO "{{ postgres_app_db_user }}";
  become: true
  become_user: postgres
  changed_when: false

# Older migrations created dms_readonly LOGIN with 'devpassword'. Nothing
# in the platform logs in as it; disable the login instead of leaving a
# known password behind.
- name: Disable login on the legacy dms_readonly role
  community.postgresql.postgresql_query:
    login_db: postgres
    query: >-
      DO $$ BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dms_readonly') THEN
          ALTER ROLE dms_readonly NOLOGIN PASSWORD NULL;
        END IF;
      END $$;
  become: true
  become_user: postgres
  changed_when: false

# ----- Nightly backup (local disk) ------------------------------------------
# Local pg_dump with retention. Offsite copy / PITR is still the deferred
# production backup role (ADR 0093); ship these files off-host.
# Restore: docs/runbooks/ansible-install.md § Disaster recovery.

- name: Backup directory (postgres-only)
  ansible.builtin.file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install backup script
  ansible.builtin.template:
    src: vaultdms-pg-backup.sh.j2
    dest: /usr/local/sbin/vaultdms-pg-backup
    owner: root
    group: postgres
    mode: "0750"

- name: Install daily pg_dump cron
  ansible.builtin.cron:
    name: "vaultdms pg_dump daily"
    user: postgres
    minute: "{{ postgres_backup_minute }}"
    hour: "{{ postgres_backup_hour }}"
    job: /usr/local/sbin/vaultdms-pg-backup
    state: present
