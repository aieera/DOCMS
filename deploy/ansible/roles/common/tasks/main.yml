# common — baseline hardening + vaultdms user + paths on every host.
# Runs first via the umbrella playbook.

- name: Detect OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Debian']
    fail_msg: |
      Unsupported OS family: {{ ansible_os_family }}.
      Supported: RHEL 8/9, Ubuntu 22.04/24.04.

- name: Create vaultdms group
  ansible.builtin.group:
    name: "{{ vaultdms_group }}"
    system: true
    state: present

- name: Create vaultdms user
  ansible.builtin.user:
    name: "{{ vaultdms_user }}"
    group: "{{ vaultdms_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vaultdms_state_dir }}"
    create_home: false
    state: present

- name: Create platform directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vaultdms_user }}"
    group: "{{ vaultdms_group }}"
    mode: "0750"
  loop:
    - "{{ vaultdms_install_dir }}"
    - "{{ vaultdms_bin_dir }}"
    - "{{ vaultdms_config_dir }}"
    - "{{ vaultdms_state_dir }}"
    - "{{ vaultdms_log_dir }}"

# ----- Firewall (O-11) --------------------------------------------------------
# Service ports (HTTP 8080, health 8081, gRPC 9090) on app hosts, and
# Postgres on db hosts, accept connections only from
# vaultdms_service_allowed_cidrs / vaultdms_app_cidr — never any source.
# The earlier any-source allow rules are removed. Failures are not
# swallowed: set vaultdms_manage_firewall=false when an external firewall
# owns these hosts.
- name: Firewall rules (RHEL/firewalld)
  when:
    - vaultdms_manage_firewall | bool
    - ansible_os_family == 'RedHat'
  block:
    - name: Firewalld — remove legacy any-source service-port rules
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ common_service_ports }}"

    - name: Firewalld — allow service ports from the allowed CIDRs (app hosts)
      ansible.posix.firewalld:
        rich_rule: 'rule family="ipv4" source address="{{ item.0 }}" port port="{{ item.1 }}" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ vaultdms_service_allowed_cidrs | product(common_service_ports) | list }}"
      when: "'app' in group_names"

    - name: Firewalld — allow Postgres from the app CIDR (db hosts)
      ansible.posix.firewalld:
        rich_rule: 'rule family="ipv4" source address="{{ vaultdms_app_cidr }}" port port="{{ vaultdms_db_port }}" protocol="tcp" accept'
        permanent: true
        immediate: true
        state: enabled
      when: "'db' in group_names"

- name: Firewall rules (Ubuntu/ufw)
  when:
    - vaultdms_manage_firewall | bool
    - ansible_os_family == 'Debian'
  block:
    - name: Ufw — remove legacy any-source service-port rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop: "{{ common_service_ports }}"

    - name: Ufw — allow service ports from the allowed CIDRs (app hosts)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1 }}"
        proto: tcp
      loop: "{{ vaultdms_service_allowed_cidrs | product(common_service_ports) | list }}"
      when: "'app' in group_names"

    - name: Ufw — allow Postgres from the app CIDR (db hosts)
      community.general.ufw:
        rule: allow
        from_ip: "{{ vaultdms_app_cidr }}"
        to_port: "{{ vaultdms_db_port }}"
        proto: tcp
      when: "'db' in group_names"

# logrotate config covering /var/log/vaultdms/*.log. Each service writes
# its stdout/stderr through systemd's journal, but Go services that log
# to a file (via SEDOC_LOG_FILE) get rotated by this config.
- name: Install logrotate config
  ansible.builtin.copy:
    dest: /etc/logrotate.d/vaultdms
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ vaultdms_log_dir }}/*.log {
        daily
        rotate 14
        compress
        delaycompress
        missingok
        notifempty
        copytruncate
        su {{ vaultdms_user }} {{ vaultdms_group }}
      }

# SELinux / AppArmor: leave enforcing. The sedoc-service role installs
# binaries under /opt/vaultdms which is unconfined by default policies;
# if your environment has a custom policy, add the appropriate fcontext
# rule there rather than disabling the MAC system here.
