- name: Application services (document)
  hosts: app
  become: true
  tags: [app, document]
  roles:
    - role: sedoc-service
      vars:
        vaultdms_service_name: document
        vaultdms_service_grpc_port: 9090
        vaultdms_service_http_port: 8080
        vaultdms_service_health_port: 8081

# The other 13 Go services follow the same pattern — copy the block
# above with the service name and ports. See ADR 0093 §"Adding a new
# service" for the full list. Today's commit only installs `document`
# as the worked example.
