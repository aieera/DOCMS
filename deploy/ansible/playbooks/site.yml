# Umbrella playbook (ADR 0093). Brings the whole stack up against the
# inventory's tier groups. For a partial install, target a specific
# playbook (postgres.yml, document.yml, …) instead.
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --tags app
#   ansible-playbook playbooks/site.yml --limit db01.internal

- name: Baseline hardening on every host
  hosts: vaultdms
  become: true
  tags: [common]
  roles:
    - common

- name: PostgreSQL — primary data store
  hosts: db
  become: true
  tags: [db, infra]
  roles:
    - postgres

