# Wave 13.1 — integration-test infrastructure.
#
# Minimal set: postgres + redis + nats + opensearch + minio +
# temporal-dev. No services under test here; each service's
# _integration_test.go dials these by env-var URL.
#
# Every service binds on localhost so developers can run the
# same compose stack interactively.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultdms
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: vaultdms_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdms"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  nats:
    image: nats:2.10
    command: ["-js"]
    ports: ["4222:4222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: DevRoot_1234
    ports: ["9200:9200"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-01-29T03-56-32Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopass
    ports:
      - "9000:9000"
      - "9001:9001"

  temporal:
    image: temporalio/auto-setup:1.23
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: vaultdms
      POSTGRES_PWD: devpassword
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
