groups:
  # ===========================================================================
  # SLO burn-rate alerts — multi-window, multi-burn-rate (Google SRE workbook)
  #
  # Two pages per SLO:
  #   - fast: 2% of 30d budget burned in 1h  (short + long window confirm)
  #   - slow: 10% of 30d budget burned in 6h
  #
  # Short-window is the "is it happening right now" signal; long-window is
  # the "is this a real trend, not a blip" signal. Both must fire, so a
  # single bad minute can't page.
  #
  # Each SLO is defined by its target availability/latency; the burn-rate
  # multiplier is derived from how fast we'd exhaust the budget at current
  # error rate. 14.4x in 1h = 2% of a 30d budget consumed in one hour.
  #
  # SLOs tracked here (spec §13.6):
  #   upload-init  : 99.9% of requests < 500ms
  #   search-query : 99.0% of requests < 400ms (p99)
  #   ocr-complete : 95.0% of jobs   < 30s (p95)
  #   permission   : 99.9% of checks < 50ms (p99)
  #   api-avail    : 99.9% non-5xx across /api/v1/*
  # ===========================================================================
  - name: slo.burn-rate.api-availability
    rules:
      # --- fast burn: 2% budget in 1h (14.4x) ---
      - alert: SLOBurnFastAPIAvailability
        expr: >
          (
            sum(rate(http_requests_total{path=~"/api/v1/.*",status=~"5.."}[1h]))
            / sum(rate(http_requests_total{path=~"/api/v1/.*"}[1h]))
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(http_requests_total{path=~"/api/v1/.*",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{path=~"/api/v1/.*"}[5m]))
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: platform
          slo: api-availability
          burn: fast
        annotations:
          summary: "API availability SLO burning fast (2% of 30d budget in 1h)"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

      # --- slow burn: 10% budget in 6h (6x) ---
      - alert: SLOBurnSlowAPIAvailability
        expr: >
          (
            sum(rate(http_requests_total{path=~"/api/v1/.*",status=~"5.."}[6h]))
            / sum(rate(http_requests_total{path=~"/api/v1/.*"}[6h]))
          ) > (6 * 0.001)
          and
          (
            sum(rate(http_requests_total{path=~"/api/v1/.*",status=~"5.."}[30m]))
            / sum(rate(http_requests_total{path=~"/api/v1/.*"}[30m]))
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          team: platform
          slo: api-availability
          burn: slow
        annotations:
          summary: "API availability SLO burning slow (10% of 30d budget in 6h)"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

  - name: slo.burn-rate.upload-init
    rules:
      - alert: SLOBurnFastUploadInit
        expr: >
          (
            sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init",le="+Inf"}[1h]))
            -
            sum(rate(http_request_duration_seconds_bucket{path="/api/v1/documents/upload-init",le="0.5"}[1h]))
          )
          /
          sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init"}[1h]))
          > (14.4 * 0.001)
          and
          (
            sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init"}[5m]))
            -
            sum(rate(http_request_duration_seconds_bucket{path="/api/v1/documents/upload-init",le="0.5"}[5m]))
          )
          /
          sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init"}[5m]))
          > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: platform
          slo: upload-init-latency
          burn: fast
        annotations:
          summary: "upload-init latency SLO burning fast (2% budget in 1h)"
          description: ">0.1% of upload-init requests exceed 500ms, fast enough to burn 2% of 30d budget in 1h"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

      - alert: SLOBurnSlowUploadInit
        expr: >
          (
            sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init"}[6h]))
            -
            sum(rate(http_request_duration_seconds_bucket{path="/api/v1/documents/upload-init",le="0.5"}[6h]))
          )
          /
          sum(rate(http_request_duration_seconds_count{path="/api/v1/documents/upload-init"}[6h]))
          > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          team: platform
          slo: upload-init-latency
          burn: slow
        annotations:
          summary: "upload-init latency SLO burning slow (10% budget in 6h)"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

  - name: slo.burn-rate.search
    rules:
      - alert: SLOBurnFastSearch
        expr: >
          (
            sum(rate(http_request_duration_seconds_count{path="/api/v1/search"}[1h]))
            -
            sum(rate(http_request_duration_seconds_bucket{path="/api/v1/search",le="0.4"}[1h]))
          )
          /
          sum(rate(http_request_duration_seconds_count{path="/api/v1/search"}[1h]))
          > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          team: search
          slo: search-latency
          burn: fast
        annotations:
          summary: "search p99 SLO burning fast (2% budget in 1h)"
          description: "search latency target: 99% of queries < 400ms"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

      - alert: SLOBurnSlowSearch
        expr: >
          (
            sum(rate(http_request_duration_seconds_count{path="/api/v1/search"}[6h]))
            -
            sum(rate(http_request_duration_seconds_bucket{path="/api/v1/search",le="0.4"}[6h]))
          )
          /
          sum(rate(http_request_duration_seconds_count{path="/api/v1/search"}[6h]))
          > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
          team: search
          slo: search-latency
          burn: slow
        annotations:
          summary: "search p99 SLO burning slow (10% budget in 6h)"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

  - name: slo.burn-rate.permission
    rules:
      # Permission checks are hot-path for *every* request; breaching the
      # 50ms p99 target has compounding effects upstream.
      - alert: SLOBurnFastPermission
        expr: >
          (
            sum(rate(permission_check_duration_seconds_count[1h]))
            -
            sum(rate(permission_check_duration_seconds_bucket{le="0.05"}[1h]))
          )
          /
          sum(rate(permission_check_duration_seconds_count[1h]))
          > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: policy
          slo: permission-latency
          burn: fast
        annotations:
          summary: "permission-check p99 SLO burning fast"
          description: "policy evaluator p99 >50ms is a platform-wide slowdown"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"

  - name: slo.burn-rate.ocr
    rules:
      # OCR is async/batch; budget tolerance is wider (5% / p95 < 30s).
      - alert: SLOBurnSlowOCR
        expr: >
          (
            sum(rate(ocr_job_duration_seconds_count[6h]))
            -
            sum(rate(ocr_job_duration_seconds_bucket{le="30"}[6h]))
          )
          /
          sum(rate(ocr_job_duration_seconds_count[6h]))
          > (6 * 0.05)
        for: 30m
        labels:
          severity: warning
          team: ai
          slo: ocr-latency
          burn: slow
        annotations:
          summary: "OCR p95 SLO burning slow (10% of budget in 6h)"
          runbook: "https://wiki.vaultdms.io/runbooks/slo-burn"
