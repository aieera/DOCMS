# ZAP false-positive justification log.
#
# Every entry in ops/security/zap-baseline.conf with IGNORE/WARN needs
# a line here. Format:
#
#   RULE_ID | YYYY-MM-DD | reviewer | justification
#
# The reviewer is the name or GitHub handle of whoever last accepted
# the suppression. Re-justify on every release train — stale
# suppressions are themselves a risk (the false-positive may have
# become a real one when the code under it changed).

10021 | 2026-04-24 | sulthansha | X-Content-Type-Options is set by pkg/gateway.SecurityHeadersMiddleware on every /api route. ZAP sees this as missing when it hits /healthz (which bypasses middleware intentionally — kube probes don't need security headers). Re-verify whenever pkg/gateway/waf.go changes.

10035 | 2026-04-24 | sulthansha | Strict-Transport-Security is set at the ingress (Kong in prod, nginx in staging). ZAP runs inside the cluster and hits the service directly, so the header isn't visible on the wire. A prod-facing scan (DAST wave 2) against the ingress URL will surface it. Keep suppressed for the baseline in-cluster scan only.

10038 | 2026-04-24 | sulthansha | CSP missing on /metrics. The endpoint is Prometheus-only — no browser context, no form input — so CSP doesn't apply. If /metrics ever returns HTML, remove this suppression.
