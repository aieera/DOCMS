# OWASP ZAP baseline configuration for VaultDMS staging scans.
#
# Format: one rule per line, `RULE_ID  ACTION  URL_PATTERN`.
# Actions:  IGNORE | WARN | FAIL
# URL_PATTERN is optional; when absent, the rule applies globally.
#
# Baseline scan is passive-only (no authenticated write attempts, no
# fuzzing). Runs nightly from `.github/workflows/dast-zap.yml`
# against the staging deploy. Findings feed into the Security tab
# via SARIF; P0/P1 (HIGH/CRITICAL) block the next release tag.
#
# Tuning principles:
#   - Default is FAIL on HIGH alerts (ZAP rule IDs are documented at
#     https://www.zaproxy.org/docs/alerts/).
#   - Suppress rules that are known false-positives for this repo
#     (documented below, never blanket).
#   - Session-authenticated routes are not exercised here — those
#     need the authenticated scan (follow-up, DAST wave 2).

# --- Rules with known false-positives (see ops/security/zap-ignore.conf
# for the full justification log) ---
10021   IGNORE   # X-Content-Type-Options — set by pkg/gateway/SecurityHeadersMiddleware; rule false-fires on /healthz which bypasses middleware by design.
10035   IGNORE   # Strict-Transport-Security header — set by ingress, invisible to ZAP hitting staging's in-cluster address.
10038   IGNORE   # CSP header missing on /metrics — Prometheus scrapes this; no browser context, CSP is a category error.

# --- Explicit FAIL on the high-risk rules we care about ---
40009   FAIL     # SQL injection
40012   FAIL     # Cross-Site Scripting (reflected)
40014   FAIL     # Cross-Site Scripting (persistent)
40016   FAIL     # XSS (persistent, prime)
40017   FAIL     # XSS (persistent, spider)
40018   FAIL     # SQL Injection (mysql)
90019   FAIL     # Server-Side Code Injection
90020   FAIL     # Remote OS Command Injection
90022   FAIL     # Application Error Disclosure
90033   FAIL     # Loosely scoped cookie
