# Prometheus scrape config for local development.
#
# Each Go service exposes /metrics on its VAULTDMS_HEALTH_PORT (see
# pkg/health/health.go). In compose the ports are the container-level
# health ports, not the host-mapped ones — inside the compose network
# we address containers by service-name:health-port.
#
# In production this is managed by the Prometheus operator; this file
# is intentionally dev-only. Alert rules under rules/ are portable.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8081"]
  - job_name: policy
    metrics_path: /metrics
    static_configs:
      - targets: ["policy:8081"]
  - job_name: document
    metrics_path: /metrics
    static_configs:
      - targets: ["document:8081"]
  - job_name: storage
    metrics_path: /metrics
    static_configs:
      - targets: ["storage:8081"]
  - job_name: search
    metrics_path: /metrics
    static_configs:
      - targets: ["search:8081"]
  - job_name: audit
    metrics_path: /metrics
    static_configs:
      - targets: ["audit:8081"]
  - job_name: workflow
    metrics_path: /metrics
    static_configs:
      - targets: ["workflow:8081"]
  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ["notification:8081"]
  - job_name: signature
    metrics_path: /metrics
    static_configs:
      - targets: ["signature:8081"]
  - job_name: billing
    metrics_path: /metrics
    static_configs:
      - targets: ["billing:8081"]
  - job_name: connector
    metrics_path: /metrics
    static_configs:
      - targets: ["connector:8081"]
  - job_name: acknowledgement
    metrics_path: /metrics
    static_configs:
      - targets: ["acknowledgement:8081"]
