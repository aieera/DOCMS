<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeDoc — Folders</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ───────────────────────── tokens ───────────────────────── */
  :root {
    --bg:        #e8eaef;
    --card:      #ffffff;

    --ink:       #1d2330;   /* headings            */
    --ink-2:     #353c4b;   /* body                */
    --muted:     #8b92a4;   /* secondary           */
    --faint:     #aab0c0;   /* tertiary / icons    */

    --line:      #eef0f5;   /* hairline divider    */
    --line-2:    #e4e7ee;   /* stronger border     */
    --hover:     #f6f7fa;   /* row hover           */

    --primary:   #7a5af8;
    --primary-700:#6a45f0;
    --primary-50:#f0edfe;
    --primary-tint:#f6f4ff;

    --folder-a:  #fcd989;
    --folder-b:  #f6c557;
    --folder-tab:#f2b53f;

    --danger:    #f15b53;
    --danger-50: #fdeceb;

    --shadow-card: 0 30px 70px -30px rgba(40,44,63,.28);
    --shadow-pop:  0 18px 44px -14px rgba(35,38,58,.30), 0 2px 8px rgba(35,38,58,.06);
    --shadow-tile: 0 10px 26px -16px rgba(46,50,70,.30);

    --r-lg: 18px;
    --r-md: 14px;
    --r-sm: 10px;

    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #eef0f6 0%, transparent 60%),
      var(--bg);
    color: var(--ink-2);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: grid;
    place-items: center;
    padding: 28px;
  }
  ::selection { background: var(--primary-50); }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #dfe2ea; border-radius: 9px; border: 2px solid var(--card); }
  ::-webkit-scrollbar-thumb:hover { background: #cfd3df; }

  /* ───────────────────────── shell ───────────────────────── */
  .app {
    width: min(1480px, 100%);
    height: min(920px, calc(100vh - 56px));
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow-card);
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* far-left icon rail */
  .rail {
    width: 66px;
    flex: none;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 18px;
    gap: 6px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 13px; flex: none;
    background: linear-gradient(150deg, #2a2f3c, #15181f);
    display: grid; place-items: center;
    box-shadow: 0 8px 18px -8px rgba(20,23,30,.7);
    margin-bottom: 14px;
  }
  .logo svg { width: 19px; height: 19px; }
  .rail-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .rail-btn {
    width: 42px; height: 42px; border-radius: 13px;
    display: grid; place-items: center; color: var(--faint);
    transition: background .18s, color .18s, transform .18s;
  }
  .rail-btn svg { width: 21px; height: 21px; }
  .rail-btn:hover { background: var(--hover); color: var(--ink-2); }
  .rail-btn.active { background: var(--primary-50); color: var(--primary); }
  .rail-spacer { flex: 1; }

  /* main column = topbar + content */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    height: 70px; flex: none;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 18px;
    padding: 0 22px 0 20px;
  }
  .hamb { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--ink); transition: background .18s; }
  .hamb:hover { background: var(--hover); }
  .hamb svg { width: 20px; height: 20px; }
  .topbar h1 { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }

  .topsearch {
    flex: 1; max-width: 420px; margin: 0 auto;
    position: relative; display: flex; align-items: center;
  }
  .topsearch svg.lead { position: absolute; left: 16px; width: 18px; height: 18px; color: var(--faint); }
  .topsearch input {
    width: 100%; height: 44px; border-radius: 13px;
    background: #f5f6f9; border: 1px solid transparent;
    padding: 0 44px 0 44px; font-size: 14.5px; color: var(--ink);
    transition: background .18s, border-color .18s, box-shadow .18s;
  }
  .topsearch input::placeholder { color: var(--faint); }
  .topsearch input:focus { outline: none; background: #fff; border-color: var(--line-2); box-shadow: 0 0 0 4px var(--primary-tint); }
  .kbd {
    position: absolute; right: 10px; width: 24px; height: 24px;
    display: grid; place-items: center; border-radius: 7px;
    background: #fff; border: 1px solid var(--line-2);
    font-size: 13px; color: var(--muted); font-weight: 600;
  }

  .topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .icon-btn { position: relative; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); transition: background .18s; }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 20px; height: 20px; }
  .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; }
  .avatar { width: 42px; height: 42px; border-radius: 13px; object-fit: cover; box-shadow: 0 0 0 1px var(--line-2); }

  .content { flex: 1; display: flex; min-height: 0; }

  /* ─────────────────── left: folder tree ─────────────────── */
  .tree {
    width: 264px; flex: none;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 20px 16px 16px;
  }
  .tree-head { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--faint); padding: 0 8px 12px; }
  .tree-scroll { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }

  .node { user-select: none; }
  .node-row {
    display: flex; align-items: center; gap: 11px;
    height: 42px; padding: 0 10px; border-radius: 12px;
    color: var(--ink-2); font-size: 14.5px; font-weight: 600;
    transition: background .16s, color .16s;
  }
  .node-row:hover { background: var(--hover); }
  .node-row.active { background: var(--primary-50); color: var(--primary-700); }
  .node-row .fi { width: 22px; height: 18px; flex: none; }
  .node-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .2s; flex: none; }
  .node.open > .node-row .chev { transform: rotate(90deg); }

  .children {
    margin-left: 21px; padding-left: 13px;
    border-left: 1.5px dashed #dfe3ec;
    display: none;
  }
  .node.open > .children { display: block; }
  .leaf {
    display: flex; align-items: center; gap: 10px; position: relative;
    height: 40px; padding: 0 10px; border-radius: 11px;
    color: var(--ink-2); font-size: 14px; font-weight: 500;
    transition: background .16s;
  }
  .leaf::before { content:""; position:absolute; left:-13px; top:50%; width:11px; height:1.5px; background:#dfe3ec; }
  .leaf:hover { background: var(--hover); }
  .leaf .fi { width: 19px; height: 16px; flex: none; }

  .tree-foot { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
  .storage-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px 9px; }
  .storage-row .lbl { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .storage-row .pct { font-size: 13px; font-weight: 700; color: var(--muted); }
  .bar { height: 8px; border-radius: 8px; background: #edeef3; margin: 0 8px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 70%; border-radius: 8px;
    background: linear-gradient(90deg, #9b7bff, var(--primary));
    box-shadow: 0 1px 4px rgba(122,90,248,.5); }

  /* ─────────────────── center ─────────────────── */
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .center-top { padding: 22px 26px 6px; display: flex; gap: 16px; align-items: center; }
  .ctr-search { flex: 1; position: relative; display: flex; align-items: center; }
  .ctr-search svg { position: absolute; left: 16px; width: 18px; height: 18px; color: var(--faint); }
  .ctr-search input {
    width: 100%; height: 50px; border-radius: 14px;
    background: #f6f7fa; border: 1px solid var(--line);
    padding: 0 18px 0 46px; font-size: 14.5px; color: var(--ink);
    transition: background .18s, border-color .18s, box-shadow .18s;
  }
  .ctr-search input::placeholder { color: var(--faint); }
  .ctr-search input:focus { outline: none; background: #fff; border-color: #d9dbff; box-shadow: 0 0 0 4px var(--primary-tint); }
  .upload {
    height: 50px; padding: 0 22px; border-radius: 14px; flex: none;
    background: linear-gradient(180deg, #8468fb, var(--primary));
    color: #fff; font-size: 14.5px; font-weight: 700;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 12px 24px -10px rgba(122,90,248,.7), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .16s, box-shadow .16s, filter .16s;
  }
  .upload:hover { transform: translateY(-1px); box-shadow: 0 16px 30px -10px rgba(122,90,248,.8), inset 0 1px 0 rgba(255,255,255,.25); }
  .upload:active { transform: translateY(0); }
  .upload svg { width: 18px; height: 18px; }

  .scroll { flex: 1; overflow-y: auto; padding: 14px 26px 30px; }
  .sec-title { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; margin: 12px 2px 16px; }
  .files-title { margin-top: 30px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }

  .card {
    position: relative; border-radius: var(--r-md);
    padding: 18px 16px 16px; cursor: pointer;
    border: 1px solid transparent;
    transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
  }
  .card:hover { background: #fff; border-color: var(--line); box-shadow: var(--shadow-tile); transform: translateY(-2px); }
  .card.selected { background: var(--primary-tint); border-color: #d9d2ff; }
  .card .thumb { display: grid; place-items: center; height: 76px; }
  .card .thumb svg { filter: drop-shadow(0 10px 14px rgba(214,168,40,.30)); }
  .file .thumb svg { filter: drop-shadow(0 8px 14px rgba(60,66,90,.14)); }
  .card .nm { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sz { margin-top: 3px; font-size: 12.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .more {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
    border-radius: 9px; display: grid; place-items: center; color: var(--muted);
    opacity: 0; transform: translateY(-2px); transition: opacity .16s, transform .16s, background .16s, color .16s;
  }
  .card:hover .more { opacity: 1; transform: none; }
  .card .more:hover { background: #eceef3; color: var(--ink); }
  .card .more svg { width: 18px; height: 18px; }

  .new-folder {
    border: 1.6px dashed #d6dae4; border-radius: var(--r-md);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); font-size: 13.5px; font-weight: 600;
    min-height: 152px; transition: border-color .18s, color .18s, background .18s;
  }
  .new-folder:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-tint); }
  .new-folder .plus { width: 44px; height: 44px; border-radius: 14px; background: #f4f5f9; display: grid; place-items: center; transition: background .18s, color .18s; }
  .new-folder:hover .plus { background: #fff; color: var(--primary); }
  .new-folder .plus svg { width: 22px; height: 22px; }

  /* ─────────────────── right: details ─────────────────── */
  .details {
    width: 312px; flex: none; border-left: 1px solid var(--line);
    padding: 26px 24px; overflow-y: auto;
  }
  .preview { display: grid; place-items: center; padding: 6px 0 4px; }
  .preview svg { filter: drop-shadow(0 22px 26px rgba(214,168,40,.32)); }
  .preview-name { text-align: center; font-size: 20px; font-weight: 700; color: var(--ink); margin: 14px 0 26px; letter-spacing: -.02em; }

  .d-head { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--faint); margin-bottom: 14px; }
  .meta { display: flex; flex-direction: column; gap: 15px; margin-bottom: 28px; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .meta-row .k { color: var(--muted); font-weight: 500; }
  .meta-row .v { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta-row .v.link { color: var(--primary); }

  .d-divider { height: 1px; background: var(--line); margin: 6px 0 24px; }

  .set-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .set-row .k { font-size: 14.5px; color: var(--ink-2); font-weight: 600; }
  .toggle {
    width: 44px; height: 26px; border-radius: 999px; background: #e3e5ec; position: relative;
    transition: background .2s; flex: none;
  }
  .toggle::after { content:""; position:absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.18); transition: transform .2s; }
  .toggle.on { background: var(--primary); }
  .toggle.on::after { transform: translateX(18px); }

  /* ─────────────────── context menu ─────────────────── */
  .menu {
    position: fixed; z-index: 60; min-width: 196px;
    background: #fff; border-radius: 16px; padding: 8px;
    box-shadow: var(--shadow-pop); border: 1px solid var(--line);
    display: none;
  }
  .menu.show { display: block; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } to { opacity: 1; transform: none; } }
  .mi { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); width: 100%; transition: background .14s; }
  .mi svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .mi:hover { background: var(--hover); }
  .mi.danger { color: var(--danger); }
  .mi.danger svg { color: var(--danger); }
  .mi.danger:hover { background: var(--danger-50); }
  .menu-sep { height: 1px; background: var(--line); margin: 7px 6px; }

  /* entrance */
  .reveal { opacity: 0; transform: translateY(8px); animation: rise .5s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 1180px) { .details { display: none; } }
  @media (max-width: 920px)  { .tree { display: none; } }
</style>
</head>
<body>
<div class="app">

  <!-- ───────── icon rail ───────── -->
  <aside class="rail">
    <div class="logo" title="SeDoc">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5.6 5.6l12.8 12.8M3 12h18M5.6 18.4L18.4 5.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <nav class="rail-nav">
      <button class="rail-btn" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
      <button class="rail-btn" title="Workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7V5.5A2.5 2.5 0 0 1 8.5 3h7A2.5 2.5 0 0 1 18 5.5V7"/><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M3 12h18"/></svg></button>
      <button class="rail-btn" title="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9h17M8 3v3M16 3v3" stroke-linecap="round"/></svg></button>
      <button class="rail-btn" title="Mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6" stroke-linecap="round"/></svg></button>
      <button class="rail-btn" title="Messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H9l-4 4z"/></svg></button>
      <button class="rail-btn" title="Docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v12.5A1.5 1.5 0 0 1 16.5 21h-9A1.5 1.5 0 0 1 6 19.5v-15A1.5 1.5 0 0 1 7.5 3z"/><path d="M14 3v4h4M9 13h6M9 16.5h4" stroke-linecap="round"/></svg></button>
      <button class="rail-btn active" title="Files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg></button>
      <button class="rail-btn" title="Library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v14.5a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 0 5 21z"/><path d="M5 18.5A1.5 1.5 0 0 1 6.5 17H19" stroke-linecap="round"/></svg></button>
      <button class="rail-btn" title="Contacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><circle cx="12" cy="10" r="2.6"/><path d="M8 17a4 4 0 0 1 8 0" stroke-linecap="round"/></svg></button>
    </nav>
    <div class="rail-spacer"></div>
    <button class="rail-btn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 12a7.4 7.4 0 0 0-.1-1.1l2-1.5-2-3.4-2.3 1a7.3 7.3 0 0 0-1.9-1.1l-.3-2.4H10.2l-.3 2.4a7.3 7.3 0 0 0-1.9 1.1l-2.3-1-2 3.4 2 1.5a7.5 7.5 0 0 0 0 2.2l-2 1.5 2 3.4 2.3-1a7.3 7.3 0 0 0 1.9 1.1l.3 2.4h3.6l.3-2.4a7.3 7.3 0 0 0 1.9-1.1l2.3 1 2-3.4-2-1.5c.06-.36.1-.73.1-1.1z"/></svg></button>
  </aside>

  <!-- ───────── main ───────── -->
  <div class="main">

    <!-- topbar -->
    <header class="topbar">
      <button class="hamb" id="hamb" title="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h11M4 18h16" stroke-linecap="round"/></svg></button>
      <h1>Folders</h1>
      <div class="topsearch">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
        <input id="topSearch" type="text" placeholder="Search" />
        <span class="kbd">/</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0" stroke-linecap="round"/></svg></button>
        <img class="avatar" alt="You" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a78bfa'/><stop offset='1' stop-color='%237a5af8'/></linearGradient></defs><rect width='84' height='84' fill='url(%23g)'/><circle cx='42' cy='33' r='15' fill='%23fff' opacity='.92'/><path d='M14 80c2-17 14-26 28-26s26 9 28 26z' fill='%23fff' opacity='.92'/></svg>" />
      </div>
    </header>

    <div class="content">

      <!-- left tree -->
      <aside class="tree" id="tree">
        <div class="tree-head">FOLDERS</div>
        <div class="tree-scroll" id="treeScroll"></div>
        <div class="tree-foot">
          <div class="node-row" style="margin-bottom:10px">
            <svg class="fi" viewBox="0 0 24 24" fill="none" stroke="#aab0c0" stroke-width="1.8"><path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7" stroke-linecap="round"/></svg>
            <span class="label">Trash</span>
          </div>
          <div class="storage-row"><span class="lbl">Storage</span><span class="pct">70%</span></div>
          <div class="bar"><span></span></div>
        </div>
      </aside>

      <!-- center -->
      <section class="center">
        <div class="center-top">
          <div class="ctr-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Search…" />
          </div>
          <button class="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke-linecap="round"/></svg>Upload</button>
        </div>

        <div class="scroll">
          <h2 class="sec-title">Folders</h2>
          <div class="grid" id="folderGrid"></div>

          <h2 class="sec-title files-title">Files</h2>
          <div class="grid" id="fileGrid"></div>
        </div>
      </section>

      <!-- right details -->
      <aside class="details">
        <div class="preview" id="previewIcon"></div>
        <div class="preview-name" id="previewName">Projects</div>

        <div class="d-head">INFO</div>
        <div class="meta">
          <div class="meta-row"><span class="k">Type</span><span class="v">Folder</span></div>
          <div class="meta-row"><span class="k">Size</span><span class="v">3.2 GB</span></div>
          <div class="meta-row"><span class="k">Owner</span><span class="v">ArtTemplate</span></div>
          <div class="meta-row"><span class="k">Location</span><span class="v link">My Files</span></div>
          <div class="meta-row"><span class="k">Modified</span><span class="v">Sep 17, 2020 4:25</span></div>
          <div class="meta-row"><span class="k">Created</span><span class="v">Sep 10, 2020 2:25</span></div>
        </div>

        <div class="d-divider"></div>
        <div class="d-head">SETTINGS</div>
        <div class="set-row"><span class="k">File Sharing</span><button class="toggle on" data-toggle></button></div>
        <div class="set-row"><span class="k">Backup</span><button class="toggle" data-toggle></button></div>
        <div class="set-row"><span class="k">Sync</span><button class="toggle" data-toggle></button></div>
      </aside>
    </div>
  </div>

  <!-- context menu -->
  <div class="menu" id="ctxMenu" role="menu">
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.3M8.3 13.2l7.4 4.3" stroke-linecap="round"/></svg>Share</button>
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a4 4 0 0 0 5.7.3l2.6-2.6a4 4 0 1 0-5.7-5.7L11.2 6.4" stroke-linecap="round"/><path d="M14 11a4 4 0 0 0-5.7-.3L5.7 13.3a4 4 0 1 0 5.7 5.7l1.4-1.4" stroke-linecap="round"/></svg>Sharing Link</button>
    <div class="menu-sep"></div>
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0 4-4m-4 4-4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke-linecap="round"/></svg>Download</button>
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16z" stroke-linejoin="round"/></svg>Rename</button>
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A1.5 1.5 0 0 1 6.5 5H15" stroke-linecap="round"/></svg>Copy</button>
    <button class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h13m0 0-4.5-4.5M17 12l-4.5 4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5v14" stroke-linecap="round"/></svg>Move</button>
    <div class="menu-sep"></div>
    <button class="mi danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7" stroke-linecap="round"/></svg>Delete</button>
  </div>
</div>

<script>
/* ───────────────── icon factories ───────────────── */
const NS = 'http://www.w3.org/2000/svg';

// Friendly folder on a fixed 64×56 viewBox (scaled by width/height so the
// path geometry is reliable). `glyph` overlays a faint app-type mark.
let _fgid = 0;
function folderSVG(size = 60, glyph = null) {
  const id = 'fg' + (_fgid++);
  let inner = '';
  if (glyph === 'music') inner = `<g opacity=".92"><circle cx="27" cy="41" r="3" fill="#fff"/><circle cx="38" cy="39" r="3" fill="#fff"/><path d="M30 41V31l11-2v10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  if (glyph === 'image') inner = `<g opacity=".92"><rect x="22" y="30" width="20" height="15" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="28" cy="36" r="2" fill="#fff"/><path d="M24 44l6-6 4 4 5-5 3 3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  if (glyph === 'doc')   inner = `<g stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"><path d="M26 34h12M26 39h12M26 44h7"/></g>`;
  return `<svg width="${size}" height="${Math.round(size*0.875)}" viewBox="0 0 64 56" fill="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd989"/><stop offset="1" stop-color="#f6c557"/></linearGradient></defs>
    <path d="M4 14a8 8 0 0 1 8-8h13a3 3 0 0 1 2.3 1.1l3 3.4a3 3 0 0 0 2.3 1.1h21.4a8 8 0 0 1 8 8v4H4z" fill="#f2b53f"/>
    <rect x="4" y="18" width="56" height="34" rx="9" fill="url(#${id})"/>
    ${inner}
  </svg>`;
}

// tiny tree-row folder
function treeFolder() {
  return `<svg viewBox="0 0 24 20" fill="none"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h5.2a1.5 1.5 0 0 1 1.1.5L11 5h9.5A1.5 1.5 0 0 1 22 6.5v10A1.5 1.5 0 0 1 20.5 18h-17A1.5 1.5 0 0 1 2 16.5z" fill="#f0bd4e"/><path d="M2 7h20v9.5A1.5 1.5 0 0 1 20.5 18h-17A1.5 1.5 0 0 1 2 16.5z" fill="#fbd277"/></svg>`;
}

// page-shaped file with a brand glyph
function fileSVG(kind) {
  const glyphs = {
    figma: `<g transform="translate(20,26)"><path d="M9 0H4.5a4.5 4.5 0 0 0 0 9H9z" fill="#F24E1E"/><path d="M9 9H4.5a4.5 4.5 0 0 0 0 9H9z" fill="#A259FF"/><path d="M9 18H4.5a4.5 4.5 0 1 0 4.5 4.5z" fill="#0ACF83"/><path d="M9 0h4.5a4.5 4.5 0 0 1 0 9H9z" fill="#FF7262"/><circle cx="13.5" cy="13.5" r="4.5" fill="#1ABCFE"/></g>`,
    sketch: `<g transform="translate(18,26)"><path d="M11 0 2 4 0 9l11 13L22 9l-2-5z" fill="#FDB300"/><path d="M0 9h22L11 22z" fill="#EA6C00"/><path d="M2 4 11 6 20 4 18 9H4z" fill="#FDAD00"/></g>`,
    word: `<rect x="19" y="27" width="20" height="20" rx="4.5" fill="#2B579A"/><text x="29" y="41.5" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="#fff">W</text>`,
    ps:  `<rect x="19" y="27" width="20" height="20" rx="4.5" fill="#001E36"/><text x="29" y="41.2" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="11.5" font-weight="800" fill="#31A8FF">Ps</text>`,
    pdf: `<rect x="19" y="28" width="20" height="18" rx="4" fill="#EB5757"/><text x="29" y="40.8" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="8.5" font-weight="800" fill="#fff">PDF</text>`,
    zip: `<g transform="translate(25,26)" stroke="#9aa2b4" stroke-width="2.2" stroke-linecap="round"><path d="M4 0v22"/><path d="M0 3h8M0 8h8M0 13h8M0 18h8"/></g>`,
  };
  return `<svg width="58" height="68" viewBox="0 0 58 68" fill="none">
    <path d="M8 6a4 4 0 0 1 4-4h22l16 15v43a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="#fff" stroke="#e6e9ef" stroke-width="1.4"/>
    <path d="M34 2v11a4 4 0 0 0 4 4h12" fill="#f1f3f8"/>
    ${glyphs[kind] || ''}
  </svg>`;
}

/* ───────────────── data ───────────────── */
const folders = [
  { name: 'Design',    size: '5.8 GB' },
  { name: 'Resources', size: '2.1 GB' },
  { name: 'Music',     size: '3.4 GB', glyph: 'music' },
  { name: 'Pictures',  size: '1.7 GB', glyph: 'image' },
  { name: 'Documents', size: '440 MB', glyph: 'doc' },
];
const files = [
  { name: 'Rocket – Admin Dashboard', size: '1.8 MB', kind: 'figma' },
  { name: 'Rocket – Admin Dashboard', size: '1.5 MB', kind: 'sketch' },
  { name: 'Arion – Admin Template',   size: '1.2 MB', kind: 'sketch' },
  { name: 'Project Brief',            size: '1.4 MB', kind: 'word' },
  { name: 'Design',                   size: '1.9 GB', kind: 'zip' },
  { name: 'vCard – Resume',           size: '2.5 MB', kind: 'ps' },
  { name: 'Project Brief',            size: '1.2 MB', kind: 'word' },
  { name: 'Brand Styles Guide',       size: '4.5 MB', kind: 'pdf' },
];
const tree = [
  { name: 'Design' },
  { name: 'Projects', open: true, children: ['Projects_01','Projects_02','Projects_03','Projects_04'] },
  { name: 'Music' }, { name: 'Pictures' }, { name: 'Documents' }, { name: 'Downloads' },
];

/* ───────────────── render ───────────────── */
const folderGrid = document.getElementById('folderGrid');
folders.forEach((f, i) => {
  const el = document.createElement('div');
  el.className = 'card folder reveal';
  el.style.animationDelay = (i * 45) + 'ms';
  el.dataset.name = f.name;
  el.innerHTML = `
    <button class="more" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg></button>
    <div class="thumb">${folderSVG(64, f.glyph || null)}</div>
    <div class="nm">${f.name}</div><div class="sz">${f.size}</div>`;
  folderGrid.appendChild(el);
});
// dashed New Folder tile
const nf = document.createElement('button');
nf.className = 'new-folder reveal';
nf.style.animationDelay = (folders.length * 45) + 'ms';
nf.innerHTML = `<span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></span>New Folder`;
folderGrid.appendChild(nf);

const fileGrid = document.getElementById('fileGrid');
files.forEach((f, i) => {
  const el = document.createElement('div');
  el.className = 'card file reveal';
  el.style.animationDelay = (220 + i * 40) + 'ms';
  el.dataset.name = f.name;
  el.innerHTML = `
    <button class="more" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg></button>
    <div class="thumb">${fileSVG(f.kind)}</div>
    <div class="nm">${f.name}</div><div class="sz">${f.size}</div>`;
  fileGrid.appendChild(el);
});

// tree
const treeScroll = document.getElementById('treeScroll');
tree.forEach(n => {
  const node = document.createElement('div');
  node.className = 'node' + (n.open ? ' open' : '');
  const hasKids = !!n.children;
  node.innerHTML = `
    <div class="node-row${n.name==='Projects'?' active':''}">
      <span class="fi">${treeFolder()}</span>
      <span class="label">${n.name}</span>
      ${hasKids ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                : `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
    </div>
    ${hasKids ? `<div class="children">${n.children.map(c=>`<div class="leaf"><span class="fi">${treeFolder()}</span><span class="label">${c}</span></div>`).join('')}</div>` : ''}`;
  const row = node.querySelector('.node-row');
  row.addEventListener('click', () => {
    if (hasKids) node.classList.toggle('open');
    document.querySelectorAll('.tree .node-row').forEach(r => r.classList.remove('active'));
    row.classList.add('active');
  });
  treeScroll.appendChild(node);
});

/* selection + details preview */
document.getElementById('previewIcon').innerHTML = folderSVG(118);
function select(card) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const isFolder = card.classList.contains('folder');
  document.getElementById('previewName').textContent = card.dataset.name;
  document.getElementById('previewIcon').innerHTML = isFolder
    ? folderSVG(118, folders.find(f=>f.name===card.dataset.name)?.glyph || null)
    : `<div style="transform:scale(1.5)">${card.querySelector('.thumb').innerHTML}</div>`;
}
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => select(c)));

/* toggles */
document.querySelectorAll('[data-toggle]').forEach(t => t.addEventListener('click', () => t.classList.toggle('on')));

/* ───────────────── context menu ───────────────── */
const menu = document.getElementById('ctxMenu');
function openMenu(x, y) {
  menu.classList.add('show');
  const r = menu.getBoundingClientRect();
  const px = Math.min(x, window.innerWidth - r.width - 12);
  const py = Math.min(y, window.innerHeight - r.height - 12);
  menu.style.left = px + 'px';
  menu.style.top = py + 'px';
}
function closeMenu() { menu.classList.remove('show'); }

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('contextmenu', e => { e.preventDefault(); select(card); openMenu(e.clientX, e.clientY); });
  const more = card.querySelector('.more');
  if (more) more.addEventListener('click', e => {
    e.stopPropagation(); select(card);
    const r = more.getBoundingClientRect();
    openMenu(r.right - 4, r.bottom + 6);
  });
});
document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMenu(); });
document.addEventListener('scroll', closeMenu, true);
window.addEventListener('resize', closeMenu);
menu.querySelectorAll('.mi').forEach(mi => mi.addEventListener('click', closeMenu));

/* Initial state mirrors the reference: the details panel shows the tree's
   active folder ("Projects"), while the context menu sits open over a center
   folder ("Resources"). Selecting/opening a card afterwards updates the panel. */
window.addEventListener('load', () => {
  const target = [...document.querySelectorAll('.card.folder')].find(c => c.dataset.name === 'Resources');
  if (target) { target.classList.add('selected'); const r = target.getBoundingClientRect(); openMenu(r.left + r.width * 0.5, r.top + r.height * 0.42); }
});

/* sidebar collapse */
document.getElementById('hamb').addEventListener('click', () => {
  const t = document.getElementById('tree');
  t.style.display = t.style.display === 'none' ? '' : 'none';
});

/* "/" focuses search */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) {
    e.preventDefault(); document.getElementById('topSearch').focus();
  }
  if (e.key === 'Escape') closeMenu();
});
</script>
</body>
</html>
