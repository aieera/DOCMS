# nginx for the SeDoc SPA image (web/Dockerfile). Runs unprivileged (uid 1000)
# on :3000 with all writable state in /tmp (readOnlyRootFilesystem-safe).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Hashed build assets are immutable.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback: every client-side route serves index.html, never cached.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
