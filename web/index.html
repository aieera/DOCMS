<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SeDoc</title>
    <script>
      // Apply the persisted theme before React mounts. Without this
      // the page renders one frame in light mode then snaps to dark,
      // which is jarring. ThemeProvider takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem('vaultdms-theme');
          var mode = stored || 'system';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = resolved;
        } catch (e) { /* localStorage unavailable; stay default */ }
      })();
    </script>
  </head>
  <body class="antialiased">
    <!--
      Static boot spinner. main.tsx awaits initI18n() before the FIRST
      ReactDOM render, so nothing React-side paints until the locale
      bundle loads (1-2s on a cold navigation). Without markup here the
      #root div is empty and the page is blank white until then. This
      inline spinner (no JS, no external CSS — globals.css hasn't loaded
      yet either) paints on the first frame and React replaces it on
      mount. Gray-500 is deliberately theme-neutral so it reads on both
      the light and dark canvas the theme <script> above may have set.
    -->
    <div id="root">
      <div id="app-boot" aria-label="Loading" role="status" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7280;">
        <div style="width:28px;height:28px;border-radius:9999px;border:3px solid currentColor;border-top-color:transparent;opacity:.5;animation:app-boot-spin .7s linear infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-boot > div { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
