server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # BFF proxy — the browser only ever talks to the BFF (which holds the SeDoc
    # key). Identity headers (X-ERP-User/X-ERP-Admin) are forwarded as-is.
    location /files/ {
        proxy_pass http://bff:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
