# Scrubbed access log: log $uri (the normalized PATH only) instead of $request /
# $request_uri, so query strings — which could carry free-text search terms — are
# never written to access logs. Defense-in-depth: search already moved to a POST
# body, but this strips any query string from any request.
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log scrubbed;

    # BFF proxy — the browser only ever talks to the BFF (which holds the SeDoc
    # key). Identity headers (X-ERP-User/X-ERP-Admin) are forwarded as-is.
    location /files/ {
        proxy_pass http://bff:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
