<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SeDoc</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="signed-out" hidden>
    <h2>SeDoc</h2>
    <p>Sign in to your workspace to search and upload.</p>
    <button id="sign-in">Sign in</button>
  </div>

  <div id="signed-in" hidden>
    <header>
      <input id="search" type="search" placeholder="Search documents…" autofocus>
    </header>
    <ul id="results"></ul>
    <div class="actions">
      <button id="clip">Clip this page</button>
      <button id="upload">Upload file…</button>
      <input id="file" type="file" hidden>
      <button id="sign-out" class="link">Sign out</button>
    </div>
    <div id="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
