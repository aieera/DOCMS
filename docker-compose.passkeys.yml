# ADR 0070 — dev override that enables WebAuthn on the auth service.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.passkeys.yml up -d auth
#
# RPID = "localhost" because browsers exempt localhost from the
# HTTPS requirement. Origins covers the typical Vite dev port + the
# Kong-mode :8080 frontend.
#
# Drop the override file (or just `docker compose up -d auth` against
# the base file alone) to revert.

services:
  auth:
    environment:
      VAULTDMS_WEBAUTHN_RPID:         "localhost"
      VAULTDMS_WEBAUTHN_DISPLAY_NAME: "VaultDMS (dev)"
      VAULTDMS_WEBAUTHN_ORIGINS:      "http://localhost:3000,http://localhost:8080"
      # HMAC secret for the begin/finish session token. Falls back to
      # the gateway secret if unset; the override sets it anyway so a
      # rotation of the gateway secret doesn't invalidate in-flight
      # registrations.
      VAULTDMS_WEBAUTHN_HMAC_SECRET:  "dev-only-webauthn-hmac-rotate-in-prod"
